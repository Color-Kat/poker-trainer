    BTN: RG('22+, A2s+, A7o+, K7s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, K9o+, Q9o+, J9o+, T9o'),
  };
  OPEN['UTG+1'] = OPEN.UTG; OPEN.LJ = OPEN.MP; OPEN.SB = OPEN.BB = OPEN.CO;
  // One step below each range component (66 for 77+, ATs for AJs+): ТЗ 6.3 counts these as "acceptable".
  const BORDER = {};
  for (const pos in OPEN) {
    BORDER[pos] = new Set(Cards.HAND_CODES.filter((c) => {
      if (OPEN[pos].has(c)) return false;
      const { hi, lo, type } = Cards.codeInfo(c), up = Cards.rankChar(lo + 1);
      return type === 'p' ? OPEN[pos].has(up + up) : lo + 1 < hi && OPEN[pos].has(c[0] + up + type);
    }));
  }
  const PREMIUM = RG('QQ+, AK');
  const REG_CALL = RG('JJ-22, AQs, AJs, KQs');
  const SMALL_PAIRS = RG('66-22');
  const CONNECTORS = RG('76s, 87s, 98s, T9s, JTs, QJs');
  const LIGHT_3B = RG('A5s-A2s, 65s, 76s, 87s, 98s, T9s');
  const ROCK_CALL = RG('JJ-99, AQ, AJs, ATs, KQ, KJs, QJs, JTs');
  const ROCK_4B = RG('KK+, AK');
  const PAIRS = RG('22+');
  // ponytail: per-position "top X% of hands" thresholds (Equity.holeTopPct), calibrated with tools/sim-bots.js on
  // random all-bot lineups; re-run it after changing any number here.
  const ROCK_OPEN = { UTG: 0.12, 'UTG+1': 0.12, MP: 0.12, LJ: 0.12, HJ: 0.12, CO: 0.13, BTN: 0.16, SB: 0.11 };
  const REG_ISO = { 'UTG+1': 0.14, MP: 0.2, LJ: 0.22, HJ: 0.26, CO: 0.33, BTN: 0.4, SB: 0.3 }; // tight early, wide late
  const SPECULATIVE = RG('22+, A2s+, 54s, 65s, 76s, 87s, 98s, T9s, JTs, QJs, KQs'); // over-limp material
  const STATION_LIMP = { UTG: 0.5, 'UTG+1': 0.5, MP: 0.55, LJ: 0.55, HJ: 0.6, CO: 0.65, BTN: 0.7, SB: 0.75 };
  const MANIAC_OPEN = { UTG: 0.45, 'UTG+1': 0.45, MP: 0.45, LJ: 0.36, HJ: 0.38, CO: 0.43, BTN: 0.52, SB: 0.5, BB: 0.3 };
  const PUSH = { UTG: 0.1, 'UTG+1': 0.11, MP: 0.13, LJ: 0.15, HJ: 0.18, CO: 0.22, BTN: 0.3, SB: 0.35, BB: 0.3 };
  const WIDE_3B = RG('77+, A9+, A8s-A7s, KJ+, KTs, QJ, QTs, JTs, T9s');                // vs loose / steal raisers
  const WIDE_CALL = RG('66-22, A6s-A2s, K8s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, 54s, KTo+, QTo+, JTo');

  function preInfo(table, hand, seat, L) {
    const hole = hand.hole[seat], bb = hand.bb, pos = hand.pos[seat];
    const log = hand.log.filter((e) => e.street === 'preflop');
    const raises = log.filter((e) => e.type === 'raise' || e.type === 'bet');
    const last = raises[raises.length - 1];
    const firstI = raises.length ? log.indexOf(raises[0]) : log.length;
    const others = hand.seats.filter((s) => s !== seat && !hand.folded[s]);
    return {
      L, bb, pos, code: Cards.handCode(hole[0], hole[1]), top: Equity.holeTopPct(hole),
      nRaises: raises.length,
      limpers: log.slice(0, firstI).filter((e) => e.type === 'call').length,
      callers: last ? log.slice(log.indexOf(last) + 1).filter((e) => e.type === 'call').length : 0,
      raiseBB: hand.currentBet / bb,
      // a maniac or a steal from late position: worth 3-betting/calling lighter
      wide: !!last && (base(table.players[last.seat]) === 'maniac' || ['CO', 'BTN', 'SB'].includes(hand.pos[last.seat])),
      eff: Math.min(hand.startStacks[seat], Math.max(0, ...others.map((s) => hand.startStacks[s]))) / bb,
      shove: !!last && hand.allIn[last.seat],
      ip: last ? hand.seats.indexOf(seat) > hand.seats.indexOf(last.seat) : pos !== 'SB' && pos !== 'BB',
      late: pos === 'CO' || pos === 'BTN',
      allin: L.toCall >= 0.4 * L.stack || !L.canRaise, // calling is (nearly) a stack decision
    };
  }
  const reraise = (f, mult) => to(f.L.currentBet * (mult + f.callers));
  const odds = (L) => L.toCall / (L.pot + L.toCall);
  // Calling (nearly) all-in: the style's range `t`, a little wider when the price is good.
  const commit = (f, t) => (f.top <= t || f.top <= 2 * (0.4 - odds(f.L)) ? CALL : FOLD);
  // A short stack's shove: against such a wide range almost any hand calls at odds ≤ 0.25 and almost none
  // at ≥ 0.45 (k = how loosely the style calls).
  const cheapShove = (f, k) => f.shove && f.top <= k * 4 * (0.45 - odds(f.L));

  // Short stack (or only short opponents left): push or fold. k widens/narrows the position push ranges,
  // ck is the style's looseness when calling a cheap shove.
  function shortStack(f, k, ck) {
    const t = PUSH[f.pos] * k;
    if (f.nRaises === 0) return f.top <= t ? ALLIN : f.L.canCheck ? CHECK : FOLD;
    return f.top <= t / 3 || cheapShove(f, ck) ? ALLIN : FOLD;
  }

  const PRE = {
    reg(f) {
      const { L, code, pos, nRaises, bb, top } = f;
      if (f.eff <= 12) return shortStack(f, 1, 1);
      if (f.allin) return PREMIUM.has(code) ? CALL : commit(f, f.wide ? 0.05 : 0);
      if (nRaises === 0) {
        // ТЗ 6.1: BB raises a lone SB limp with the CO range; otherwise the position table exactly, behind limpers
        // too (raise to isolate), where speculative hands may over-limp in late position — as the coach teaches.
        if (L.canCheck) return (f.limpers <= 1 ? OPEN.BB.has(code) : top <= 0.12) ? to(bb * (3 + f.limpers)) : CHECK;
        const iso = f.limpers && top <= REG_ISO[pos]; // limpers are usually weak: isolate a bit wider than the table
        if (OPEN[pos].has(code) || (BORDER[pos].has(code) && U.chance(0.5)) || iso) return to(bb * (2.5 + f.limpers));
        return f.limpers && (f.late || pos === 'SB') && SPECULATIVE.has(code) ? CALL : FOLD;
      }
      if (nRaises === 1) {
        // 3-bet: premiums; vs a loose raiser or with callers in between (squeeze) a wider value range; some light ones
        if (PREMIUM.has(code) || ((f.wide || f.callers) && WIDE_3B.has(code)) || (f.ip && LIGHT_3B.has(code) && U.chance(0.5))) return reraise(f, f.ip ? 3 : 3.5);
        if ((REG_CALL.has(code) && (!SMALL_PAIRS.has(code) || f.eff >= 20 * f.raiseBB)) || (f.late && CONNECTORS.has(code))) return CALL;
        if ((f.wide && WIDE_CALL.has(code)) || (pos === 'BB' && f.raiseBB <= 4 && top <= 0.3)) return CALL; // defend the BB
        return FOLD;
      }
      if (!PREMIUM.has(code)) return FOLD;
      if (code === 'AA' || code === 'KK') return nRaises === 2 ? reraise(f, 2.3) : ALLIN;
      return nRaises === 2 && U.chance(0.4) ? reraise(f, 2.3) : CALL;
    },
    rock(f) {
      const { L, code, pos, nRaises, top, bb } = f;
      if (f.eff <= 12) return shortStack(f, 0.6, 0.6);
      if (f.allin) return ROCK_4B.has(code) ? CALL : commit(f, 0);
      if (nRaises === 0) {
        if (L.canCheck) return top <= 0.05 ? to(bb * (3 + f.limpers)) : CHECK;
        if (top <= ROCK_OPEN[pos]) return to(bb * (3 + f.limpers));
        // passive: over-limps hoping to hit, limps small pairs late for a cheap set
        if (f.limpers && (PAIRS.has(code) || top <= 0.2)) return CALL;
        return (pos === 'SB' || f.late) && PAIRS.has(code) ? CALL : FOLD;
      }
      if (nRaises === 1) {
        if (PREMIUM.has(code)) return reraise(f, 3);
        if (ROCK_CALL.has(code)) return CALL;
        if (PAIRS.has(code) && f.raiseBB <= 5 && f.eff >= 20 * f.raiseBB) return CALL; // set-mining
        return FOLD;
      }
      if (!ROCK_4B.has(code)) return FOLD;
      if (code === 'AA' || code === 'KK') return nRaises === 2 ? reraise(f, 2.3) : ALLIN;
      return CALL;
    },
    station(f) {
      const { L, code, pos, nRaises, top, bb } = f;
      // No push/fold when short: a station stays loose and passive at any depth (it just shoves its few raises).
      if (nRaises === 0) {
        if (top <= 0.08) return f.eff <= 10 ? ALLIN : to(bb * (3 + f.limpers));
        if (L.canCheck) return CHECK;
        return top <= STATION_LIMP[pos] ? CALL : FOLD;
      }
      if ((code === 'AA' || code === 'KK') && U.chance(0.6)) return f.allin ? ALLIN : reraise(f, 3);
      const t = (nRaises === 1 ? 0.5 : 0.12) * (f.raiseBB <= 5 ? 1 : f.raiseBB <= 10 ? 0.5 : f.raiseBB <= 25 ? 0.25 : 0.15);
      return top <= t || cheapShove(f, 1.6) ? CALL : FOLD;
    },
    maniac(f) {
      const { L, nRaises, top, bb, pos } = f;
      if (f.eff <= 15) return shortStack(f, 1.6, 1.3);
      if (f.allin) return commit(f, 0.12);
      const size = () => to(bb * (U.pick([3, 3.5, 4, 5]) + f.limpers));
      if (nRaises === 0) {
        if (L.canCheck) return top <= MANIAC_OPEN.BB && U.chance(0.7) ? size() : CHECK;
        if (top <= MANIAC_OPEN[pos]) return top <= 0.03 && U.chance(0.2) ? ALLIN : size();
        if (top <= MANIAC_OPEN[pos] + 0.12 || (pos === 'SB' && U.chance(0.5))) return CALL;
        return FOLD;
      }
      if (nRaises === 1) {
        if (top <= 0.18) return top <= 0.03 && U.chance(0.25) ? ALLIN : reraise(f, rnd(3, 4));
        return top <= 0.4 * (f.raiseBB <= 6 ? 1 : 0.5) ? CALL : FOLD;
      }
      if (top <= 0.05) return ALLIN;
      return top <= (nRaises === 2 ? 0.2 : 0.1) ? CALL : FOLD;
    },
  };

  // ---------- postflop ----------
  const memo = new WeakMap(); // hand → { 'seat:boardLen': { eq, hs } } (a bot may act several times per street)

  function postInfo(hand, seat, L, human) {
    const hole = hand.hole[seat], board = hand.board, a = analyze(hole, board);
    const opps = hand.seats.filter((s) => s !== seat && !hand.folded[s]);
    let m = memo.get(hand);
    if (!m) memo.set(hand, (m = {}));
    const k = seat + ':' + board.length;
    const e = m[k] || (m[k] = { eq: Equity.vsRandom(hole, board, opps.length, { iters: 300 }), hs: handStrength(hole, board) });
    const aggr = hand.log.filter((x) => x.street === hand.street && (x.type === 'bet' || x.type === 'raise'));
    const pre = hand.log.filter((x) => x.street === 'preflop' && x.type === 'raise');
    const live = hand.seats.filter((s) => !hand.folded[s] && !hand.allIn[s]);
    const prev = board.slice(0, board.length - 1);
    const bettor = aggr.length ? aggr[aggr.length - 1].seat : null;
    const la = human && human.lastAction;
    return {
      L, a, cls: a.cls, eq: e.eq, hs: e.hs, nuts: a.cls === 'strong' && e.hs >= 0.97,
      nOpp: opps.length, street: hand.street, river: board.length === 5,
      bf: L.toCall / Math.max(1, L.pot - L.toCall), odds: L.toCall / (L.pot + L.toCall),
      spr: L.stack / Math.max(1, L.pot),
      pfr: pre.length > 0 && pre[pre.length - 1].seat === seat,
      ip: live[live.length - 1] === seat,
      scary: board.length > 3 && scaryBoard(prev, board, Math.max(...prev.map(Cards.rank))),
      slow: !!(la && bettor === human.seat && la.street === hand.street && (la.type === 'bet' || la.type === 'raise')
        && la.thinkMs > (human.avgThinkMs || 0) + 2000),
    };
  }

  const POST = {
    rock(f) {
      const { L, cls, bf } = f;
      if (!L.toCall) {
        const p = { strong: 0.6, medium: f.nOpp === 1 ? 0.15 : 0.05, draw: 0.03, bluff: 0.02 }[cls];
        return U.chance(p) ? potBet(L, rnd(0.33, 0.5)) : CHECK;
      }
      if (f.nuts && L.canRaise) {
        if (f.street !== 'flop') return U.chance(0.6) ? potBet(L, rnd(0.8, 1.1)) : CALL; // big late raise = nuts
        return U.chance(0.35) ? potBet(L, 0.5) : CALL;
      }
      if (cls === 'strong') return bf > 1.2 && f.hs < 0.85 && U.chance(0.5) ? FOLD : CALL;
      if (cls === 'medium') return U.chance((bf <= 0.4 ? 0.6 : bf <= 0.75 ? 0.2 : 0.03) * (f.nOpp > 1 ? 0.6 : 1)) ? CALL : FOLD;
      if (cls === 'draw') return bf <= 0.4 && f.eq >= f.odds ? CALL : FOLD;
      return FOLD;
    },
    station(f) {
      const { L, cls, bf, a } = f;
      if (!L.toCall) {
        const p = cls === 'strong' ? (f.nuts ? 0.45 : 0.3) : cls === 'medium' ? 0.08 : 0;
        return U.chance(p) ? potBet(L, rnd(0.3, 0.45)) : CHECK;
      }
      if (f.nuts && L.canRaise && U.chance(0.55)) return potBet(L, f.street === 'flop' ? 0.5 : rnd(1, 1.3)); // monsters: big later
      if (cls !== 'bluff' || a.pair || (a.sOuts === 1 && !f.river)) return CALL;
      if ((a.aceHigh || a.over) && bf <= 0.75) return U.chance(f.river ? 0.5 : 0.9) ? CALL : FOLD;
      return U.chance({ flop: 0.45, turn: 0.3, river: 0.12 }[f.street]) ? CALL : FOLD;
    },
    reg(f) {
      const { L, cls, bf, a, street } = f;
      const size = () => potBet(L, rnd(0.5, 0.75));
      if (!L.toCall) {
        if (street === 'flop' && f.pfr) { // continuation bet
          const p = { strong: 0.85, medium: 0.7, draw: 0.75, bluff: f.nOpp > 2 ? 0.3 : 0.6 }[cls];
          return U.chance(p) ? size() : CHECK;
        }
        if (cls === 'strong') return U.chance(0.8) ? (f.nuts && f.river ? potBet(L, rnd(0.75, 1)) : size()) : CHECK;
        if (cls === 'medium') return U.chance(f.river ? 0.25 : 0.35) ? potBet(L, 0.5) : CHECK;
        if (cls === 'draw') return U.chance(a.outs >= 12 ? 0.55 : 0.35) ? size() : CHECK;
        if (f.nOpp > 2) return CHECK;
        if (street === 'flop') return f.ip && f.nOpp === 1 && U.chance(0.25) ? potBet(L, 0.5) : CHECK;
        return U.chance((f.scary ? 0.3 : 0.1) * (f.ip ? 1 : 0.5)) ? size() : CHECK; // bluff on scary turns/rivers
      }
      if (f.nuts && L.canRaise) return U.chance(0.65) ? potBet(L, rnd(0.75, 1)) : CALL;
      if (cls === 'strong') {
        if (L.canRaise && U.chance(street === 'flop' ? 0.35 : 0.2)) return size();
        return bf > 1 && f.hs < 0.8 && U.chance(0.4) ? FOLD : CALL;
      }
      if (cls === 'medium') {
        let p = bf <= 0.55 ? 0.95 : bf <= 0.85 ? 0.65 : 0.3;
        if (f.nOpp > 1) p *= 0.75;
        if (f.slow) p *= 0.4; // a long think before a bet usually means strength
        return f.eq >= f.odds * 0.8 && U.chance(p) ? CALL : FOLD;
      }
      if (cls === 'draw') {
        if (L.canRaise && a.outs >= 8 && U.chance(street === 'flop' ? 0.3 : 0.15)) return potBet(L, rnd(0.6, 0.8)); // semi-bluff
        return f.eq >= f.odds - (street === 'flop' ? 0.1 : 0.04) ? CALL : FOLD; // implied odds
      }
      if (L.canRaise && street === 'flop' && f.ip && f.nOpp === 1 && bf <= 0.5 && U.chance(0.05)) return potBet(L, 0.7);
      // float small bets heads-up with overcards / ace high or a gutshot
      return !f.river && f.nOpp === 1 && bf <= 0.6 && (a.over || a.aceHigh || a.sOuts) && U.chance(0.4) ? CALL : FOLD;
    },
    maniac(f) {
      const { L, cls, bf, a } = f;
      const big = () => (f.spr < 1.5 || U.chance(cls === 'strong' ? 0.25 : 0.12) ? ALLIN : potBet(L, U.pick([0.75, 1, 1, 1.25, 1.5])));
      if (!L.toCall) return U.chance({ strong: 0.9, medium: 0.75, draw: 0.85, bluff: 0.65 }[cls]) ? big() : CHECK;
      if (cls === 'strong') return L.canRaise && U.chance(0.65) ? big() : CALL;
      if (cls === 'medium') return L.canRaise && U.chance(0.4) ? big() : bf > 1.5 && U.chance(0.3) ? FOLD : CALL;
      if (cls === 'draw') return L.canRaise && U.chance(0.5) ? big() : CALL;
      if (L.canRaise && U.chance(0.25)) return big();
      return U.chance(a.pair || a.aceHigh || a.sOuts ? 0.55 : 0.25) ? CALL : FOLD;
    },
  };

  // Timing tells: honest styles tank with monsters and snap-fold junk; the actor does the opposite.
  function think(style, action, strong) {
    const aggressive = action.type === 'raise', easy = action.type === 'fold' || action.type === 'check';
    let ms = U.randInt(700, 1600);
    if (style === 'rock' || style === 'station') {
      if (aggressive && strong) ms += U.randInt(900, 1800);
      else if (easy) ms *= 0.6;
    } else if (style === 'reg') ms = U.randInt(1100, 1700);
    else if (style === 'maniac') ms = U.randInt(450, 3200);
    else if (style === 'actor') {
      if (strong) ms = U.randInt(450, 900);
      else if (aggressive) ms += U.randInt(1200, 2000);
    }
    return Math.round(U.clamp(ms, 400, 3500));
  }

  function decide({ table, hand, seat, legal, human } = {}) {
    const L = legal || Engine.legal(hand), p = table.players[seat], st = base(p);
    let intent, strong;
    if (hand.street === 'preflop') {
      const f = preInfo(table, hand, seat, L);
      intent = PRE[st](f);
      strong = f.top <= 0.05;
    } else {
      const f = postInfo(hand, seat, L, human);
      intent = POST[st](f);
      if (intent === FOLD && f.bf <= 0.2 && f.eq >= 2.5 * f.odds) intent = CALL; // a tiny bet never buys the pot
      strong = f.cls === 'strong';
    }
    const action = legalize(intent, L);
    return { action, thinkMs: think(p.style, action, strong) };
  }

  // ---------- tells ----------
  const CHAT = ['«Кто-нибудь смотрел вчера футбол?»', '«Эх, сейчас бы кофе…»', '«А долго ещё до перерыва?»',
    '«Хорошая сегодня погода, правда?»', '«Кстати, где тут можно нормально поужинать?»'];
  // [text for reviews ("Игорь …"), short bubble] — subtle (rock, reg) and obvious (station, maniac) versions.
  const TELLS = {
    glance: { shown: 'strength', subtle: ['бросает быстрый взгляд на свои фишки', 'взгляд на фишки'],
      obvious: ['сразу смотрит на свои фишки и начинает их пересчитывать', 'пересчитывает фишки'] },
    freeze: { shown: 'strength', subtle: ['на секунду задерживает дыхание', 'задерживает дыхание'],
      obvious: ['замирает и заметно задерживает дыхание', 'замирает'] },
    quiet: { shown: 'strength', subtle: ['перестаёт болтать и замолкает', 'замолкает'],
      obvious: ['резко замолкает и выпрямляется на стуле', 'резко замолкает'] },
    lookaway: { shown: 'weakness', subtle: ['безразлично отводит взгляд в сторону', 'смотрит в сторону'],
      obvious: ['отворачивается от стола и безразлично смотрит в сторону', 'смотрит в сторону'] },
    chatter: { shown: 'weakness', subtle: ['начинает болтать с соседом', null], obvious: ['начинает громко болтать со всеми подряд', null] },
    shrug: { shown: 'weakness', subtle: ['едва заметно пожимает плечами', 'пожимает плечами'],
      obvious: ['разочарованно пожимает плечами и откидывается на стуле', 'пожимает плечами'] },
  };
  const KINDS = { strength: ['glance', 'freeze', 'quiet'], weakness: ['lookaway', 'chatter', 'shrug'] };
  const STREET_GEN = { flop: 'флоп', turn: 'тёрн', river: 'ривер' };
  const meaningOf = (shown, street) => (shown === 'strength'
    ? (street === 'flop' ? 'это часто сигнал, что флоп попал' : `это часто сигнал, что ${STREET_GEN[street]} усилил руку`)
    : street === 'flop' ? 'так часто ведут себя, когда флоп не попал' : 'так часто ведут себя, когда карта не помогла');

  function honest(seat, shown, truth, street, tone, extra = {}) {
    const anim = U.pick(KINDS[shown]), [text, bubble] = TELLS[anim][tone];
    return { seat, shown, truth, acting: false, random: false, text, bubble: bubble || U.pick(CHAT), anim, meaning: meaningOf(shown, street), ...extra };
  }
  // Acting: a strong hand plays weak (sigh), a weak hand plays strong (smile / chip toss).
  function acted(seat, truth, street, onBet = false) {
    if (truth === 'strong') {
      return { seat, shown: 'weakness', truth, acting: true, random: false, anim: 'sigh',
        text: onBet ? 'ставит с тяжёлым демонстративным вздохом' : 'демонстративно вздыхает',
        bubble: onBet ? '«Ну ладно, поставлю…»' : street === 'flop' ? '«Ну и флоп…»' : '«Ну и карта…»',
        meaning: 'показная слабость часто скрывает сильную руку' };
    }
    const toss = U.chance(0.5);
    return { seat, shown: 'strength', truth, acting: true, random: false, anim: toss ? 'toss' : 'smile',
      text: toss ? (onBet ? 'с вызовом бросает фишки в банк' : 'с вызовом поигрывает фишками') : 'показно улыбается и уверенно смотрит на соперников',
      bubble: toss ? (onBet ? 'бросает фишки' : 'играет фишками') : 'улыбается',
      meaning: onBet ? 'показная уверенность при ставке часто прикрывает блеф' : 'показная уверенность часто прикрывает слабую руку' };
  }
  // The style's way of showing a strong or weak change of its hand.
  function show(style, seat, truth, street) {
    const shown = truth === 'strong' ? 'strength' : 'weakness';
    switch (style) {
      case 'station': return honest(seat, shown, truth, street, 'obvious');
      case 'reg': return U.chance(0.5) ? acted(seat, truth, street) : honest(seat, shown, truth, street, 'subtle');
      case 'maniac': return honest(seat, U.chance(0.5) ? 'strength' : 'weakness', truth, street, 'obvious', { random: true });
      case 'actor': return acted(seat, truth, street);
      default: return honest(seat, shown, truth, street, 'subtle');
    }
  }
  // Noise looks exactly like the style's real tells (so it cannot be filtered out by its wording), for a random truth.
  const noise = (style, seat, truth, street) =>
    ({ ...show(style, seat, U.chance(0.5) ? 'strong' : 'weak', street), truth, acting: false, random: true });

  // How the new card(s) changed the bot's holding: 'strong' | 'weak' | 'neutral'.
  function streetTruth(hole, prev, board) {
    const pair = Cards.rank(hole[0]) === Cards.rank(hole[1]);
    const before = prev.length >= 3 ? analyze(hole, prev) : { cls: pair ? 'medium' : 'bluff', cat: pair ? 1 : 0 };
    const after = analyze(hole, board);
    if (after.cls === 'strong') return before.cls !== 'strong' || after.cat > before.cat ? 'strong' : 'neutral';
    if (after.cls === 'bluff' || (before.cls === 'strong' && after.cls === 'medium')) return 'weak';
    if (after.cls === 'medium' && scaryBoard(prev, board, after.pairRank)) return 'weak';
    return 'neutral';
  }

  const SHOW = { rock: 0.45, station: 0.85, reg: 0.15, maniac: 0.6, actor: 0.8 };

  function streetReaction({ table, hand, seat, newCards = [] } = {}) {
    const p = table.players[seat], hole = hand.hole[seat];
    if (!p || p.isHuman || !hole || hand.folded[seat] || hand.board.length < 3) return null;
    const fresh = new Set(newCards), street = hand.street;
    const prev = hand.board.filter((c) => !fresh.has(c));
    const truth = streetTruth(hole, prev, hand.board);
    if (!U.chance(SHOW[p.style] ?? 0.3)) return null;
    if (truth === 'neutral') return U.chance(0.13) ? noise(p.style, seat, truth, street) : null; // mostly nothing to show
    return U.chance(0.13) ? noise(p.style, seat, truth, street) : show(p.style, seat, truth, street);
  }

  // Occasional tell right after the bot's own bet/raise; like street tells, some show a made-up holding (noise).
  function betReaction({ table, hand, seat, entry } = {}) {
    const p = table.players[seat], hole = hand.hole[seat];
    if (!p || p.isHuman || !hole || !entry || (entry.type !== 'bet' && entry.type !== 'raise') || hand.board.length < 3) return null;
    const a = analyze(hole, hand.board), truth = a.cls === 'strong' ? 'strong' : a.cls === 'medium' ? 'neutral' : 'weak';
    if (p.style === 'maniac') return U.chance(0.2) ? { ...acted(seat, U.chance(0.5) ? 'strong' : 'weak', hand.street, true), truth, acting: false, random: true } : null;
    const fake = U.chance(0.15), t = fake ? U.pick(['strong', 'weak']) : truth; // the holding the tell is about
    const monster = fake ? t === 'strong' : a.cls === 'strong' && a.cat >= 2;
    let r = null;
    if ((p.style === 'rock' || p.style === 'station') && monster && U.chance(p.style === 'rock' ? 0.25 : 0.5)) {
      const subtle = p.style === 'rock';
      r = { seat, shown: 'strength', truth, acting: false, random: false, anim: 'tremble',
        text: subtle ? 'ставит, и пальцы едва заметно дрожат' : 'ставит фишки, и руки заметно дрожат',
        bubble: 'руки дрожат', meaning: 'дрожь в руках при ставке часто выдаёт очень сильную руку — так волнуются, а не блефуют' };
    } else if (p.style === 'actor' && t !== 'neutral' && U.chance(t === 'weak' ? 0.6 : 0.3)) r = acted(seat, t, hand.street, true);
    else if (p.style === 'reg' && t !== 'neutral' && U.chance(0.04)) r = acted(seat, t, hand.street, true);
    return r && fake ? { ...r, truth, acting: false, random: true } : r;
  }

  // Composition of each style's big (add ≥ 0.66 × pot before, as in Coach.readQuestion) postflop bets/raises by
  // classifyHolding, measured with tools/sim-bots.js (25k + 25k hands, 9- and 6-max); re-measure after changing
  // the policies or classifyHolding.
  const READ_PROFILE = {
    rock: { strong: 0.98, medium: 0.02, draw: 0, bluff: 0 },
    station: { strong: 0.97, medium: 0.03, draw: 0, bluff: 0 },
    reg: { strong: 0.49, medium: 0.12, draw: 0.09, bluff: 0.3 },
    maniac: { strong: 0.13, medium: 0.23, draw: 0.09, bluff: 0.55 },
  };

  return {
    STYLE_IDS, BASE_STYLES, STYLES, NAMES, createBot, randomLineup, decide, streetReaction, betReaction,
    classifyHolding, READ_PROFILE, foldEquity, base,
  };
})();

// ===== 60-ranges.js =====
// ===== Ranges: preflop tables (SPEC §6), situation detection, verdicts, hints, range grids =====
const Ranges = (() => {
  const EARLY = '77+, AJs+, AQo+, KQs';
  const MIDDLE = '55+, ATs+, AJo+, KJs+, QJs, JTs, KQo';
  const CO_TEXT = '22+, A2s+, A9o+, K9s+, Q9s+, J9s+, T9s, 98s, 87s, KTo+, QTo+, JTo';
  // Smaller tables use the last N labels (Engine.positionNames), so lookup by label implements the SPEC "shift".
  const OPEN_TEXT = {
    UTG: EARLY, 'UTG+1': EARLY, MP: MIDDLE, LJ: MIDDLE,
    HJ: '22+, A9s+, ATo+, KTs+, QTs+, JTs, T9s, KJo+',
    CO: CO_TEXT,
    BTN: '22+, A2s+, A7o+, K7s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, K9o+, Q9o+, J9o+, T9o',
    SB: CO_TEXT, // SB opens like CO
    BB: CO_TEXT, // BB raises limpers with the CO range
  };

  // One step below each component: 77+ → 66, AJs+ → ATs, KQo → KJo (codes already in the range excluded).
  function borderOf(text, inRange) {
    const out = new Set();
    for (const t of text.split(',').map((s) => s.trim())) {
      const lo = Cards.rankOf(t[1]) - 1;
      if (lo < 2) continue;
      out.add(t[0] === t[1] ? Cards.rankChar(lo).repeat(2) : t[0] + Cards.rankChar(lo) + t[2]);
    }
    for (const c of inRange) out.delete(c);
    return out;
  }
  const OPEN = {}, BORDER = {};
  for (const p of Object.keys(OPEN_TEXT)) {
    OPEN[p] = Cards.parseRange(OPEN_TEXT[p]);
    BORDER[p] = borderOf(OPEN_TEXT[p], OPEN[p]);
  }
  const open = (pos) => OPEN[pos] || new Set();
  const border = (pos) => BORDER[pos] || new Set();

  const set = (t) => Cards.parseRange(t);
  const PREMIUM = set('QQ+, AK'), PAIRS = set('JJ-22'), SMALL_PAIRS = set('66-22');
  const SUITED_CALL = set('AQs, AJs, KQs'), CONNECTORS = set('76s, 87s, 98s, T9s, JTs, QJs'), VS_BORDER = set('AQo, ATs, KJs');
  const VS_CALL = set('JJ-22, AQs, AJs, KQs, 76s, 87s, 98s, T9s, JTs, QJs');
  const isLate = (pos) => pos === 'BTN' || pos === 'CO';
  const VS_RAISE_TEXT = 'Против рейза: 3-бет — QQ+, AK; колл — JJ–22 (маленькие пары — если стек ≥ 20 рейзов), AQs, AJs, KQs, одномастные коннекторы 76s+ (только на BTN/CO); остальное — сброс.';

  const POS_INFO = {
    UTG: { group: 'Ранняя', text: 'Ранняя позиция: ты ходишь одним из первых, а после тебя почти весь стол. Играй только сильные руки — у кого-то сзади легко окажется рука лучше, а после флопа ты будешь без позиции.' },
    'UTG+1': { group: 'Ранняя', text: 'Ранняя позиция: после тебя ещё почти весь стол. Играй только сильные руки — диапазон такой же узкий, как у UTG.' },
    MP: { group: 'Средняя', text: 'Средняя позиция: часть игроков уже сбросила, но после тебя ещё много соперников. Диапазон чуть шире, чем в ранней позиции.' },
    LJ: { group: 'Средняя', text: 'Лоуджек — средняя позиция: после тебя ещё HJ, CO, баттон и блайнды. Диапазон как у MP: пары от 55, сильные тузы и картинки.' },
    HJ: { group: 'Средняя', text: 'Хайджек — последняя средняя позиция: после тебя только CO, баттон и блайнды. Можно добавить все пары и больше одномастных рук.' },
    CO: { group: 'Поздняя', text: 'Катофф — поздняя позиция: после тебя только баттон и блайнды, а после флопа ты часто ходишь последним. Открывай широко.' },
    BTN: { group: 'Поздняя', text: 'Баттон (дилер) — лучшая позиция: после флопа ты всегда ходишь последним и видишь действия соперников. Самый широкий диапазон.' },
    SB: { group: 'Блайнд', text: 'Малый блайнд: половина ставки уже внесена, но после флопа ты ходишь первым, без позиции. Открывай диапазоном CO.' },
    BB: { group: 'Блайнд', text: 'Большой блайнд: ставка уже внесена, и на префлопе ты ходишь последним. Если никто не повышал — смотри флоп бесплатно (чек), а с рукой из диапазона CO можно повысить.' },
  };

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  // 'K-J разномастные', 'A-Q одномастные', 'пара семёрок'
  function codeRu(code) {
    const { hi, lo, type } = Cards.codeInfo(code);
    if (type === 'p') return 'пара ' + Cards.rankRu(hi, Cards.GEN_PL);
    return `${Cards.rankLabel(hi)}-${Cards.rankLabel(lo)} ${type === 's' ? 'одномастные' : 'разномастные'}`;
  }

  // Preflop context of the hero's current decision. Works both before Engine.act (hero to act)
  // and right after it (then the decision is the hero's last voluntary preflop entry).
  function situation(hand, seat) {
    const pre = hand.log.filter((e) => e.street === 'preflop');
    const voluntary = (e) => e.type !== 'sb' && e.type !== 'bb';
    const isRaise = (e) => e.type === 'raise' || e.type === 'bet';
    let cut = pre.length;
    if (!(hand.street === 'preflop' && hand.toAct === seat)) {
      for (let i = pre.length - 1; i >= 0; i--) if (pre[i].seat === seat && voluntary(pre[i])) { cut = i; break; }
    }
    const prior = pre.slice(0, cut);
    const raiseList = prior.filter(isRaise), first = prior.findIndex(isRaise);
    const raises = raiseList.length;
    const limpers = prior.filter((e, i) => e.type === 'call' && (first < 0 || i < first)).length;
    const heroRaised = raiseList.some((e) => e.seat === seat);
    const raiser = raises ? raiseList[raises - 1].seat : null;
    const raiseTo = Math.max(hand.bb, ...prior.map((e) => e.to || 0));
    const heroIn = Math.max(0, ...prior.filter((e) => e.seat === seat).map((e) => e.to || 0));
    const pos = hand.pos[seat], idx = hand.order.indexOf(seat);
    const playersAfter = hand.order.slice(idx + 1).filter((s) => !hand.folded[s] && !hand.allIn[s]).length;
    const st = hand.startStacks;
    const effStack = raiser === null ? st[seat] : Math.min(st[seat], st[raiser]);
    const kind = raises >= 2 || (raises && heroRaised) ? 'vs3bet' : raises ? 'vsRaise'
      : pos === 'BB' ? (limpers ? 'bbOption' : 'walk') : limpers ? 'limped' : 'open';
    // Engine.legal's raise rule: chips beyond the call, someone left to raise against, and an incomplete
    // all-in raise does not reopen the betting for a player who already acted since the last full raise.
    let cur = hand.bb, minRaise = hand.bb, fullAt = -1;
    prior.forEach((e, i) => { if (isRaise(e)) { if (!e.incomplete) { minRaise = e.to - cur; fullAt = i; } cur = Math.max(cur, e.to); } });
    const toCall = Math.max(0, raiseTo - heroIn), stack = st[seat] - heroIn;
    const acted = prior.some((e, i) => i >= fullAt && e.seat === seat && voluntary(e));
    const canRaise = stack > toCall && hand.seats.some((s) => s !== seat && !hand.folded[s] && !hand.allIn[s]) && (!acted || toCall >= minRaise);
    const pot = U.sum(prior.map((e) => e.add || 0)), call = Math.min(toCall, stack);
    return { kind, pos, n: hand.order.length, playersAfter, limpers, raises, raiser, raiseTo, effStack, toCall,
      stack, canRaise, pot, price: call ? call / (pot + call) : 0, allIn: raiser !== null && !!hand.allIn[raiser] };
  }

  const B = 'best', OK = 'ok', M = 'mistake';
  // No more betting after this call (short shove, or the hero's last chips) and at most 20% needed.
  const cheapAllIn = (sit) => (sit.allIn || sit.stack <= sit.toCall) && sit.price <= 0.2;
  const priceText = (sit) => `доплатить нужно всего ${U.fmt(Math.min(sit.toCall, sit.stack))} при банке ${U.fmt(sit.pot)}`;
  const V = (best, fold, call, raise, check) => ({ best, v: check ? { fold, check, raise } : { fold, call, raise } });

  // Verdicts by the SPEC tables + explanation lines (independent of the action actually taken).
  function decide(sit, code, hand, table) {
    const { kind, pos } = sit;
    const pair = code.length === 2, C = cap(codeRu(code));
    const enters = (yes) => (yes ? '' : 'не ') + (pair ? 'входит' : 'входят');
    const text = OPEN_TEXT[pos] || CO_TEXT;
    const why = [];
    let d;
    if (kind === 'open') {
      if (open(pos).has(code)) { d = V('raise', M, M, B); why.push(`${C} ${enters(true)} в диапазон этой позиции (${text}) — открывай рейзом.`); }
      else if (border(pos).has(code)) { d = V('fold', B, M, OK); why.push(`${C} — рука на границе диапазона: в таблице этой позиции (${text}) её нет, но она соседняя. Рейз допустим, надёжнее — сбросить.`); }
      else { d = V('fold', B, M, M); why.push(`${C} ${enters(false)} в диапазон этой позиции (${text}).`); }
    } else if (kind === 'limped') {
      const { hi, lo, type } = Cards.codeInfo(code);
      const speculative = pair || (type === 's' && (hi === 14 || (hi - lo === 1 && lo >= 4)));
      const limp = speculative && (isLate(pos) || pos === 'SB') ? OK : M;
      why.push(`Перед тобой ${U.nplural(sit.limpers, 'лимпер', 'лимпера', 'лимперов')}: ${sit.limpers > 1 ? 'игроки просто уравняли' : 'игрок просто уравнял'} большой блайнд.`);
      if (open(pos).has(code)) { d = V('raise', M, limp, B); why.push(`${C} ${enters(true)} в диапазон ${pos} (${text}) — рейзи: изолируй лимперов и забери инициативу.`); }
      else { d = V('fold', B, limp, border(pos).has(code) ? OK : M); why.push(`${C} ${enters(false)} в диапазон ${pos} (${text}).`); }
      if (limp === OK) why.push('Доплатить (оверлимп) допустимо: пары, одномастные коннекторы и одномастные тузы в поздней позиции и на малом блайнде дёшево смотрят флоп.');
    } else if (kind === 'bbOption') {
      const inCO = open('CO').has(code);
      d = V(inCO ? 'raise' : 'check', M, null, inCO ? B : M, B);
      why.push('Никто не повышал — ты на большом блайнде и можешь бесплатно посмотреть флоп.');
      why.push(inCO ? `${C} ${enters(true)} в диапазон CO (${CO_TEXT}) — можно повысить, чек тоже верен.`
        : `${C} ${enters(false)} в диапазон CO (${CO_TEXT}) — повышать незачем, просто чек.`);
    } else if (kind === 'vsRaise') {
      const late = isLate(pos), p = table && table.players[sit.raiser];
      why.push(`${p ? p.name : 'Соперник'} (${hand.pos[sit.raiser]}) повышает до ${U.fmt(sit.raiseTo)}.`);
      if (PREMIUM.has(code)) {
        d = V('raise', M, OK, B);
        why.push(sit.canRaise ? 'QQ+ и AK против рейза — 3-бет (ререйз): строй банк с лучшей рукой. Колл тоже допустим.'
          : 'QQ+ и AK — лучшие руки против рейза. Повысить уже нельзя, так что просто колл.');
      } else if (SMALL_PAIRS.has(code)) {
        const deep = sit.effStack >= 20 * sit.raiseTo;
        d = deep ? V('call', M, B, M) : V('fold', B, M, M);
        why.push(`Игра на сет: нужно ≥ 20 рейзов соперника в стеке, у тебя ${Math.floor(sit.effStack / sit.raiseTo)}${deep ? ' — хватает, колл.' : ' — мало, сброс.'}`);
      } else if (PAIRS.has(code)) {
        const jt = code === 'JJ' || code === 'TT';
        d = V('call', M, B, jt ? OK : M);
        why.push(`Пары JJ–22 против рейза — колл${jt ? ' (3-бет с JJ и TT тоже допустим)' : ''}.`);
      } else if (SUITED_CALL.has(code)) {
        const aq = code === 'AQs';
        d = V('call', M, B, aq ? OK : M);
        why.push(`${C} против рейза — колл${aq ? ' (3-бет тоже допустим)' : ''}.`);
      } else if (CONNECTORS.has(code) && late) {
        d = V('call', M, B, M);
        why.push('Одномастные коннекторы 76s+ на BTN/CO — колл: ты в позиции, и рука хорошо собирает стриты и флеши.');
      } else if (VS_BORDER.has(code) || (code === 'QJs' && !late) || (code === '65s' && late)) {
        d = V('fold', B, OK, M);
        why.push(`${C} — рука на границе: колл допустим, но по таблице это сброс.`);
      } else {
        d = V('fold', B, M, M);
        why.push(CONNECTORS.has(code) ? 'Одномастные коннекторы против рейза коллируют только на BTN/CO — здесь сброс.'
          : `${C} ${enters(false)} в список рук для игры против рейза — сброс.`);
      }
      why.push(VS_RAISE_TEXT);
    } else if (kind === 'vs3bet') {
      if (PREMIUM.has(code)) {
        d = V('raise', M, OK, B);
        why.push(sit.canRaise ? 'Против рейза и ререйза продолжай только с QQ+ и AK: лучше ещё один ререйз, колл допустим.'
          : 'Против рейза и ререйза продолжай только с QQ+ и AK. Повысить уже нельзя, так что просто колл.');
      } else if (code === 'JJ' || code === 'AQs') { d = V('fold', B, OK, M); why.push(`Против рейза и ререйза играют только QQ+ и AK. ${C} — на границе: колл допустим, но надёжнее сбросить.`); }
      else { d = V('fold', B, M, M); why.push('Против рейза и ререйза играют только QQ+ и AK, остальное — сброс.'); }
    } else {
      d = { best: 'check', v: { check: B } };
      why.push('Все сбросили — банк твой без борьбы.');
    }
    if (!sit.canRaise && d.v.raise) { // only call or fold is left
      const { raise, ...v } = d.v;
      d = raise === B && d.best === 'raise' ? { best: 'call', v: { ...v, call: B } } : { best: d.best, v };
    }
    // The tables assume a normal raise. Against a short shove, or when the call is the hero's last chips,
    // there is no more betting: a tiny price makes calling right with almost anything.
    if (cheapAllIn(sit) && d.best === 'fold') {
      const p = table && table.players[sit.raiser];
      d = { best: 'call', v: { ...d.v, fold: M, call: B } };
      why.push(`${sit.allIn ? `${p ? p.name : 'Соперник'} идёт олл-ин` : 'Твой колл — это олл-ин'}, и ${priceText(sit)}: ` +
        `хватит ${U.pctNum(sit.price * 100)} эквити — столько есть почти у любой руки. Колл.`);
    }
    return { ...d, why };
  }

  const NOUN = { fold: 'сброс', check: 'чек', call: 'колл', raise: 'рейз' };
  const INF = { fold: 'сбросить', check: 'чекнуть', call: 'заколлировать', raise: 'сделать рейз' };
  const noun = (a, kind) => (a === 'raise' && kind === 'vsRaise' ? '3-бет' : a === 'raise' && kind === 'vs3bet' ? '4-бет' : NOUN[a]);
  const inf = (a, kind) => (a === 'raise' && kind === 'vsRaise' ? 'сделать 3-бет (ререйз)' : a === 'raise' && kind === 'vs3bet' ? 'сделать 4-бет (ререйз)' : INF[a]);
  const posLine = (s) => `Ты на позиции ${s.pos} за столом на ${s.n}. ` +
    (s.playersAfter ? `После тебя ещё ${U.nplural(s.playersAfter, 'игрок', 'игрока', 'игроков')}.` : 'После тебя никого нет — ты ходишь последним.');

  // action: { type: 'fold'|'check'|'call'|'raise', to } or a type string.
  function evaluate(hand, seat, action, table) {
    const hole = hand.hole[seat];
    if (!hole) return null;
    const sit = situation(hand, seat), code = Cards.handCode(hole[0], hole[1]);
    const d = decide(sit, code, hand, table);
    let t = typeof action === 'string' ? action : action && action.type;
    if (t === 'bet' || t === 'allin') t = 'raise';
    if (t === 'raise' && !sit.canRaise && sit.toCall) t = 'call'; // Engine turns it into a call
    if (t === 'call' && !sit.toCall) t = 'check';
    if (t === 'check' && sit.toCall) t = 'call';
    const vd = d.v[t] || M;
    const verdict = vd === B ? 'correct' : vd === OK ? 'acceptable' : 'mistake';
    const alts = Object.keys(d.v).filter((a) => a !== d.best && d.v[a] === B);
    const right = inf(d.best, sit.kind) + (alts.length ? ` (или ${alts.map((a) => inf(a, sit.kind)).join(', ')})` : '');
    const lines = [posLine(sit), ...d.why];
    const inRange = open(sit.pos).has(code) || border(sit.pos).has(code);
    if (vd === M && t === 'call' && sit.kind === 'open' && inRange) lines.push('Лимп отдаёт инициативу — либо рейз, либо сброс.');
    if (vd === M && t === 'call' && sit.kind === 'limped') {
      lines.push(open(sit.pos).has(code) ? 'Не доплачивай с такой рукой — рейзи: так ты изолируешь лимперов и берёшь инициативу.'
        : 'Доплачивать с такой рукой — лишние потери: она слабая и без потенциала.');
    }
    if (t === 'fold' && sit.kind === 'bbOption') lines.push('Никогда не сбрасывай, когда можно бесплатно чекнуть.');
    if (verdict === 'mistake') lines.push(`Правильно: ${right}.`);
    if (verdict === 'acceptable') lines.push(`Лучше: ${right}.`);
    const title = verdict === 'correct' ? `✅ Префлоп: ${noun(t, sit.kind)} — верно.`
      : verdict === 'acceptable' ? '⚠️ Префлоп: допустимо.'
      : `❌ Префлоп: ты сыграл «${noun(t, sit.kind)}», правильно — ${right}.`;

  // Learning-mode hint before acting: what the position means, the situation, the range — no verdict.
  function hint(hand, seat, table) {
    const s = situation(hand, seat), hole = hand.hole[seat];
    const C = codeRu(Cards.handCode(hole[0], hole[1]));
    const info = POS_INFO[s.pos] || { group: 'Блайнд', text: '' };
    const lines = [info.text];
    const ask = (where) => `Спроси себя: есть ли твоя рука (${C}) ${where}?`;
    const behind = s.playersAfter ? ` И сколько игроков после тебя (${s.playersAfter}) ещё могут проснуться с сильной рукой?` : '';
    if (s.kind === 'open') {
      lines.push(`До тебя все сбросили — ты открываешь торговлю. Диапазон открытия ${s.pos}: ${OPEN_TEXT[s.pos]}.`, ask('в этом диапазоне') + behind);
    } else if (s.kind === 'limped') {
      lines.push(`Перед тобой ${U.nplural(s.limpers, 'лимпер', 'лимпера', 'лимперов')}. С рукой из диапазона ${s.pos} (${OPEN_TEXT[s.pos]}) — рейз; пары, одномастные коннекторы и одномастные тузы в поздней позиции можно доплатить; остальное — сброс.`,
        ask('в этом диапазоне') + ' Если нет — стоит ли она того, чтобы доплачивать?');
    } else if (s.kind === 'bbOption') {
      lines.push(`Никто не повышал — чек бесплатный. Повышать стоит с руками из диапазона CO: ${CO_TEXT}.`, ask('в диапазоне CO') + ' Если нет — просто чек, сбрасывать нельзя.');
    } else if (s.kind === 'vsRaise') {
      const p = table && table.players[s.raiser], small = SMALL_PAIRS.has(Cards.handCode(hole[0], hole[1]));
      lines.push(`${p ? p.name : 'Соперник'} (${hand.pos[s.raiser]}) повышает до ${U.fmt(s.raiseTo)}. Против рейза играют гораздо уже, чем при открытии. ${VS_RAISE_TEXT}`,
        ask('в этом списке') + (small ? ` Для маленькой пары проверь стек: нужно ≥ 20 рейзов соперника (у тебя ${Math.floor(s.effStack / s.raiseTo)}).` : ''));
    } else if (s.kind === 'vs3bet') {
      lines.push('Был рейз и ререйз — дальше играют только QQ+ и AK.', ask('среди них'));
    } else {
      lines.push('Все сбросили — банк твой.');
    }
    if (cheapAllIn(s)) lines.push(`Но это олл-ин, и ${priceText(s)} — сравни цену с шансами банка, прежде чем сбрасывать.`);
    const group = info.group === 'Блайнд' ? 'блайнд' : info.group.toLowerCase() + ' позиция';
    return { title: `💡 Подсказка: ${s.pos} — ${group}`, lines };
  }

  // 13 rows × 13 cells {code, cls} in Cards.gridCode order (row i, column j).
  function grid(key) {
    const cls = (code) => {
      if (key === 'vsRaise') return PREMIUM.has(code) ? 'raise' : VS_CALL.has(code) ? 'call' : 'out';
      if (key === 'vs3bet') return PREMIUM.has(code) ? 'raise' : 'out';
      return open(key).has(code) ? 'in' : border(key).has(code) ? 'border' : 'out';
    };
    return Array.from({ length: 13 }, (_, i) => Array.from({ length: 13 }, (_, j) => {
      const code = Cards.gridCode(i, j);
      return { code, cls: cls(code) };
    }));
  }

  return { OPEN_TEXT, POS_INFO, open, border, situation, evaluate, hint, grid, codeRu };

// ===== 61-coach.js =====
// ===== Coach: postflop teaching (SPEC §7, §9.3, §9.4) — outs, rule of 2 and 4, pot odds, action, reads, tells, timing =====
const Coach = (() => {
  const { CAT } = HandEval;
  const R = Cards.rank, S = Cards.suit;
  const STREET_RU = { flop: 'флоп', turn: 'тёрн', river: 'ривер' };

  const eng = () => { try { return Engine; } catch (e) { return null; } };
  const bots = () => { try { return Bots; } catch (e) { return null; } };

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const joinRu = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' и ' + a[a.length - 1] : a.join(''));
  const outsW = (n) => n + ' ' + U.plural(n, 'аут', 'аута', 'аутов');
  const NP = (r) => Cards.rankRu(r, Cards.NOM_PL), GP = (r) => Cards.rankRu(r, Cards.GEN_PL);
  const cardsTight = (h) => h.map(Cards.str).join('');                 // 'K♠Q♦'
  const pctR = (x) => Math.round(x) + '%';
  // Genitive of a Russian first name (Bots.NAMES): Игорь → Игоря, Ольга → Ольги, Марина → Марины, Олег → Олега
  function gen(name) {
    const [w, ...rest] = String(name).split(' ');
    const g = w === 'Павел' ? 'Павла' : /[ьй]$/.test(w) ? w.slice(0, -1) + 'я' : /[гкхжшщч]а$/.test(w) ? w.slice(0, -1) + 'и'
      : /а$/.test(w) ? w.slice(0, -1) + 'ы' : /я$/.test(w) ? w.slice(0, -1) + 'и' : w + 'а';

  }

  // ---------- bot style info (with fallbacks when Bots is unavailable) ----------
  const FALLBACK = {
    rock: { name: 'Камень', foldEquity: 'high' }, station: { name: 'Коллинг-станция', foldEquity: 'none' },
    reg: { name: 'Регуляр', foldEquity: 'medium' }, maniac: { name: 'Маньяк', foldEquity: 'low' }, actor: { name: 'Актёр' },
  };
  const PROFILE = { // composition of big bets, used only without Bots.READ_PROFILE
    rock: { strong: 0.85, medium: 0.1, draw: 0.05, bluff: 0 }, station: { strong: 0.9, medium: 0.1, draw: 0, bluff: 0 },
    reg: { strong: 0.5, medium: 0.15, draw: 0.15, bluff: 0.2 }, maniac: { strong: 0.25, medium: 0.25, draw: 0.2, bluff: 0.3 },
  };
  const WEAK_MIX = { strong: 0.15, medium: 0.45, draw: 0.2, bluff: 0.2 };   // what small bets look like
  const LOOSE = { rock: 0.15, reg: 0.22, maniac: 0.5, station: 0.55 };      // preflop: holeTopPct ≤ x
  const baseOf = (p) => { const B = bots(); return (B && B.base ? B.base(p) : FALLBACK[p.baseStyle] ? p.baseStyle : p.style) || 'reg'; };
  const styleName = (p) => { const B = bots(); const st = (B && B.STYLES && B.STYLES[p.style]) || FALLBACK[p.style]; return st ? st.name : String(p.style); };
  const foldEqOf = (p) => { const B = bots(); return (B && B.foldEquity ? B.foldEquity(p) : (FALLBACK[baseOf(p)] || {}).foldEquity) || 'medium'; };
  const classify = (h, board) => { const B = bots(); return B && B.classifyHolding ? B.classifyHolding(h, board) : classifyLocal(h, board); };
  const lower = (f) => LEVELS[Math.max(0, LEVELS.indexOf(f) - 1)];

  // ---------- made hand ----------
  function madeInfo(hole, board) {
    const sc = HandEval.score([...hole, ...board]), cat = HandEval.cat(sc);
    const br = board.map(R), hr = hole.map(R), top = Math.max(...br);
    const on = (r) => br.filter((x) => x === r).length;
    let strength = 'none', label = 'ничего';
    if (hr[0] === hr[1]) {

    } else {
      const paired = hr.filter((r) => on(r));

      else if (paired.length === 2) [strength, label] = ['strong', 'две пары'];
      else if (paired.length === 1) [strength, label] = paired[0] === top ? ['medium', 'топ-пара'] : ['weak', 'слабая пара'];

  }

  // ---------- outs (structural, hero-specific, next card only) ----------
  const DIRTY_RU = {
    pair: ['спаривает борд, у соперника может быть фулл-хаус', 'спаривают борд, у соперника может быть фулл-хаус'],
    flush: ['даёт стрит, но на борде будет минимум 3 карты одной масти: у соперника может быть флеш', 'дают стрит, но на борде будет минимум 3 карты одной масти: у соперника может быть флеш'],
    nonnut: ['даёт не натсовый флеш: у соперника может быть флеш старше', 'дают не натсовый флеш: у соперника может быть флеш старше'],
  };
  const NO_OUTS = { total: 0, clean: 0, dirty: 0, over: 0, list: [], cleanList: [], dirtyList: [], overList: [], draws: [] };
  const fourIn = (m, x) => [0, 1, 2, 3].every((i) => m & (1 << (x + i)));
  // OESD: the two completing ranks sit on both ends of four ranks in a row (2-3-4-5 is open: ace or six).
  const openEnded = (m, [a, b]) => (b - a === 5 && fourIn(m, a + 1)) || (b === 14 && a === 6 && fourIn(m, 2));

  function computeOuts(hole, board) {
    const all = [...hole, ...board], known = new Set(all);
    const unseen = Cards.deck().filter((c) => !known.has(c));
    const cur = HandEval.score(all), curCat = HandEval.cat(cur);
    const br = board.map(R), hr = hole.map(R);
    const on = (r) => br.filter((x) => x === r).length;
    const ofRank = (...rs) => unseen.filter((c) => rs.includes(R(c)));
    const draws = [];
    const add = (type, cards, text) => {
      // an out must improve the hand, and beyond what the board alone would give (no board flushes/straights)
      cards = cards.filter((c) => { const s = HandEval.score([...all, c]); return s > cur && s > HandEval.score([...board, c]); });
      if (cards.length) draws.push({ type, n: cards.length, cards, text: text(cards.length, cards) });
    };
    if (curCat < CAT.FLUSH) {
      for (let s = 0; s < 4; s++) {
        const hs = hole.filter((c) => S(c) === s), bs = board.filter((c) => S(c) === s);
        if (hs.length && hs.length + bs.length === 4) {
          add('flush', unseen.filter((c) => S(c) === s), (n) => `У тебя 4 ${Cards.suitRu(s, 4)} (${Cards.strList(hs)} + ${Cards.strList(bs)} на борде). ` +
            `${cap(Cards.suitRu(s, 13))} в колоде 13, видно 4 → осталось ${outsW(n)}.`);
        }
      }
      const mask = (cs) => cs.reduce((m, c) => m | (1 << R(c)), 0);
      const am = mask(all), bm = mask(board), top = HandEval.straightTop(am), ranks = [];

        const t = HandEval.straightTop(am | (1 << r));

      }
      if (ranks.length) {
        const type = ranks.length === 1 ? 'gutshot' : ranks.length > 2 ? 'straight' : openEnded(am, ranks) ? 'oesd' : 'double';
        const names = joinRu(ranks.map(NP)), k = ranks.length, full = ofRank(...ranks);
        const head = { gutshot: 'Гатшот', oesd: 'Открытое стрит-дро', double: 'Двойной гатшот', straight: 'Стрит-дро' }[type];
        add(type, full, (n, kept) => {
          // the only straight card that fails is a 5th card of the board's suit: the board itself then holds a flush
          const lost = full.filter((c) => !kept.includes(c));
          const why = lost.length ? `${joinRu(lost.map(Cards.str))} не в счёт: с ${lost.length > 1 ? 'ними' : 'ней'} на борде флеш — ` : '';
          return k === 1 ? `${head}: стрит дают только ${names} (${why}${outsW(n)}).`
            : `${head}: стрит дают ${names} (${k} × 4 = ${lost.length ? `${4 * k}, но ${why}` : ''}${outsW(n)}).`;
        });
      }
    }
    const caseText = (r) => `каре — ${Cards.strList(ofRank(r))}`;
    if (hr[0] === hr[1]) {
      const p = hr[0], others = [...new Set(br.filter((r) => r !== p))];
      if (!on(p)) add('set', ofRank(p), (n) => `Карманная пара: сет дают оставшиеся ${NP(p)} (${outsW(n)}).`);
      else if (on(p) === 1) add('boat', ofRank(p, ...others), (n) => `Сет ${GP(p)}: фулл-хаус дают ${joinRu(others.map(NP))} (спаривают борд), ${caseText(p)} (${outsW(n)}).`);
    } else {
      const trips = hr.find((r) => on(r) === 2), paired = hr.filter((r) => on(r) === 1);
      if (trips) {
        const kicker = hr.find((r) => r !== trips);
        const fill = [...new Set([...br.filter((r) => r !== trips), ...(on(kicker) ? [] : [kicker])])];
        add('boat', ofRank(trips, ...fill), (n) => `Тройка ${GP(trips)}: фулл-хаус дают ${joinRu(fill.map(NP))}, ${caseText(trips)} (${outsW(n)}).`);
      } else if (paired.length === 2) {
        add('boat', ofRank(...paired), (n) => `Две пары: фулл-хаус дают оставшиеся ${NP(paired[0])} и ${NP(paired[1])} (${outsW(n)}).`);
      } else if (paired.length === 1) {
        const r = paired[0], other = hr.find((x) => x !== r);
        add('trips', ofRank(r), (n) => `Пара ${GP(r)}: тройку дают оставшиеся ${NP(r)} (${outsW(n)}).`);
        if (!on(other)) add('twopair', ofRank(other), (n) => `Две пары дают оставшиеся ${NP(other)} (${outsW(n)}).`);

    const dirtyCode = (x) => {
      const cat = HandEval.cat(HandEval.score([...all, x]));
      if ((cat === CAT.STRAIGHT || cat === CAT.FLUSH) && br.includes(R(x))) return 'pair';
      if (cat === CAT.STRAIGHT && [0, 1, 2, 3].some((s) => [...board, x].filter((c) => S(c) === s).length >= 3)) return 'flush';

    const dirty = new Set(dirtyList.map((d) => d.c)), cleanList = list.filter((c) => !dirty.has(c));
    const holePair = hr[0] === hr[1] || hr.some(on), maxB = Math.max(...br);
    const overList = holePair || curCat >= CAT.STRAIGHT ? []
      : hole.filter((c) => R(c) > maxB).flatMap((c) => ofRank(R(c))).filter((c) => !inList.has(c));

  function classifyLocal(h, board) {

    if (board.length < 5 && computeOuts(h, board).draws.some((d) => d.type === 'flush' || d.type === 'oesd' || d.type === 'double')) return 'draw';
