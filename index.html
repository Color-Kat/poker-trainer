  }

  // ---------- equity vs style-weighted ranges (made spots) ----------
  function betMix(base, frac) {
    const B = bots(), p = (B && B.READ_PROFILE && B.READ_PROFILE[base]) || PROFILE[base] || PROFILE.reg;
    const k = U.clamp(frac / 0.66, 0.3, 1); // smaller bets → weaker mix
    const out = {};
    for (const c of Object.keys(WEAK_MIX)) out[c] = (p[c] || 0) * k + WEAK_MIX[c] * (1 - k);
    return out;
  }
  // Opponent holdings are drawn directly from the weighted combo list (rejection sampling with a few
  // tries cannot reach tight ranges like a rock's); each sample is run out once via Equity.calc.
  function estimateEq(hole, board, opps, iters = 1500) {
    const dead = new Set([...hole, ...board]), deck = Cards.deck().filter((c) => !dead.has(c));
    const combos = [], cls = [], top = [];
    for (let i = 0; i < deck.length; i++) for (let j = i + 1; j < deck.length; j++) {
      const h = [deck[i], deck[j]];
      combos.push(h); cls.push(classify(h, board)); top.push(Equity.holeTopPct(h));
    }
    const samplers = opps.map(({ base, frac }) => {
      const mix = betMix(base, frac), loose = LOOSE[base] || 0.3, cnt = {};
      combos.forEach((h, k) => { if (top[k] <= loose) cnt[cls[k]] = (cnt[cls[k]] || 0) + 1; });
      let acc = 0;
      const cum = combos.map((h, k) => (acc += top[k] <= loose ? (mix[cls[k]] || 0) / cnt[cls[k]] : 0));
      return { cum, total: acc };
    });
    const pick = ({ cum, total }) => {
      if (!total) return combos[Math.floor(U.rng() * combos.length)];
      const x = U.rng() * total;
      let lo = 0, hi = cum.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] > x) hi = m; else lo = m + 1; }
      return combos[lo];
    };
    let sum = 0, n = 0;
    for (let it = 0; it < iters; it++) {
      const used = new Set(), hands = [hole];
      for (const sm of samplers) {
        let h = pick(sm);
        for (let t = 0; t < 30 && (used.has(h[0]) || used.has(h[1])); t++) h = pick(sm);
        if (used.has(h[0]) || used.has(h[1])) break; // tight ranges collided: drop the sample, never share a card
        used.add(h[0]); used.add(h[1]); hands.push(h);
      }
      if (hands.length <= samplers.length) continue;
      sum += Equity.calc(hands, board, { iters: 1, exactLimit: 0 }).eq[0];
      n++;
    }
    return sum / Math.max(1, n);
  }

  // ---------- spot analysis ----------
  function legalFor(hand, seat, table) {
    const E = eng();
    if (E && E.legal && hand.toAct === seat && hand.phase === 'betting') {
      try { const L = E.legal(hand); if (L) return L; } catch (e) { /* fall back below */ }
    }
    const stack = table.players[seat].stack, myBet = hand.bets[seat] || 0;
    const toCall = Math.min(Math.max(0, hand.currentBet - myBet), stack);
    const others = hand.seats.some((s) => s !== seat && !hand.folded[s] && !hand.allIn[s]);
    return { toCall, stack, myBet, canRaise: stack > toCall && others };
  }
  // The latest bet/raise on the current street by someone other than `seat`.
  function lastWager(hand, seat) {
    for (let i = hand.log.length - 1; i >= 0; i--) {
      const e = hand.log[i];
      if (e.street !== hand.street) break;
      if (e.seat !== seat && (e.type === 'bet' || e.type === 'raise')) return e;
    }
    return null;
  }
  const paidOf = (hand, s) => (hand.committed[s] || 0) - ((hand.returned && hand.returned[s]) || 0);

  function analyze(hand, seat, table) {
    if (!hand || hand.street === 'preflop' || hand.phase === 'done') return null;
    const hole = hand.hole[seat], board = hand.board.slice();
    if (!hole || board.length < 3) return null;
    const lg = legalFor(hand, seat, table), toCall = lg.toCall, facing = toCall > 0;
    const street = hand.street, river = street === 'river';
    if (river && !facing) return null;
    const oppSeats = hand.seats.filter((s) => s !== seat && !hand.folded[s]);
    if (!oppSeats.length) return null;
    const made = madeInfo(hole, board), outs = river ? NO_OUTS : computeOuts(hole, board);
    const kind = made.strength === 'strong' || made.strength === 'medium' ? 'made' : !river && (outs.total || outs.over) ? 'draw' : 'nodraw';
    if (!facing && kind !== 'draw') return null;

    const nOpp = oppSeats.length, multiway = nOpp >= 2;
    const wager = facing ? lastWager(hand, seat) : null;
    const bettor = wager ? wager.seat : facing ? hand.lastRaiser : null;
    const sizeFrac = wager && wager.potBefore > 0 ? wager.add / wager.potBefore : 0;
    const myBet = hand.bets[seat] || 0, full = Math.max(0, hand.currentBet - myBet);
    const E = eng();
    let pot = E && E.pot ? E.pot(hand) : hand.seats.reduce((a, s) => a + paidOf(hand, s), 0);
    const short = facing && toCall < full; // hero can only call all-in for less: the excess is not his to win
    if (short) { const lim = paidOf(hand, seat) + toCall; pot = hand.seats.reduce((a, s) => a + Math.min(paidOf(hand, s), lim), 0); }
    const allInSpot = facing && (toCall >= lg.stack || oppSeats.every((s) => hand.allIn[s]));
    const cardsToSee = street === 'flop' && allInSpot ? 2 : 1;
    const correctOuts = multiway ? outs.clean : outs.total;
    const overOk = !multiway && outs.over > 0 && (!facing || sizeFrac < 0.5);
    const rule = (o) => (cardsToSee === 1 ? o * 2 : o * 4 - Math.max(0, o - 8));
    const needed = facing ? (toCall / (pot + toCall)) * 100 : 0;

    const P = (s) => table.players[s];
    const vSeat = bettor !== null && bettor !== undefined ? bettor
      : oppSeats.reduce((a, s) => (LEVELS.indexOf(foldEqOf(P(s))) < LEVELS.indexOf(foldEqOf(P(a))) ? s : a));
    const vp = P(vSeat), villainFE = foldEqOf(vp), base = baseOf(vp);
    const sp = {
      street, kind, facing, hole: hole.slice(), board, pot, toCall, betTo: hand.currentBet, bettor: facing ? bettor : null, sizeFrac, allInSpot,
      nOpp, multiway, outs, correctOuts, acceptedOuts: overOk ? [correctOuts, correctOuts + outs.over] : [correctOuts],
      cardsToSee, ruleEq: rule(correctOuts), needed, estEq: null, made, foldEq: multiway ? lower(villainFE) : villainFE,
      seat, myBet, short, canRaise: !!lg.canRaise, overOk, villainFE,
      potStart: hand.potAtStreetStart != null ? hand.potAtStreetStart : pot - U.sum(hand.bets),
      opps: oppSeats.map((s) => ({ seat: s, name: P(s).name })),
      villain: { seat: vSeat, name: vp.name, styleName: styleName(vp), base, revealed: !!vp.revealed },
      bigLate: !!(wager && wager.type === 'raise' && sizeFrac >= 0.66 && (street === 'turn' || street === 'river') && (base === 'rock' || base === 'station')),
    };
    if (facing && (kind === 'made' || river || made.strength === 'weak')) { // a weak pair also has showdown value
      sp.estEq = estimateEq(hole, board, oppSeats.map((s) => ({ base: baseOf(P(s)), frac: s === bettor ? sizeFrac : 0.33 })));
    }
    Object.assign(sp, kind === 'draw' || (kind === 'nodraw' && !river) ? drawVerdicts(sp) : madeVerdicts(sp));
    sp.questions = kind === 'made' || river ? ['potodds'] : facing ? ['outs', 'cards', 'equity', 'potodds'] : ['outs'];
    return sp;
  }

  const B = 'best', OK = 'ok', M = 'mistake';
  function drawVerdicts(sp) {
    const o = sp.correctOuts, fe = sp.foldEq, folds = fe === 'high' || fe === 'medium';
    let best, v;
    // no bet: a semi-bluff needs fold equity — against a calling station only a huge draw may bet
    if (!sp.facing) { best = 'check'; v = { check: B, raise: o >= 8 && folds ? B : fe === 'none' && o < 12 ? M : OK, fold: M }; }
    // 12+ outs: the raise is preferred; when the rule says the call loses, folding (not calling) is the fallback
    else if (o >= 12 && fe !== 'none' && sp.canRaise) { best = 'raise'; v = sp.ruleEq >= sp.needed ? { raise: B, call: OK, fold: M } : { raise: B, fold: OK, call: M }; }
    else if (sp.ruleEq >= sp.needed) { best = 'call'; v = { call: B, raise: o >= 8 && folds ? OK : M, fold: M }; }
    else if (o >= 8 && folds) { best = 'fold'; v = { fold: B, raise: B, call: M }; }
    else if (o >= 8 && fe === 'low') { best = 'fold'; v = { fold: B, raise: OK, call: M }; }
    else { best = 'fold'; v = { fold: B, call: M, raise: M }; }
    if (showdownCall(sp) && v.call === M) { // a weak pair that is often ahead of this bettor: calling is right too
      v = { ...v, call: B, fold: v.fold === M ? M : OK };
      if (best === 'fold') best = 'call';
    }
    if (!sp.canRaise) delete v.raise;
    return { best, verdicts: v };
  }
  const showdownCall = (sp) => sp.facing && sp.estEq != null && sp.ruleEq < sp.needed && sp.estEq * 100 >= sp.needed;
  // The estimate is a rough range model: within 3 pp of the price (less for tiny prices) call and fold are both acceptable.
  const isClose = (sp) => Math.abs(sp.estEq * 100 - sp.needed) < Math.min(3, sp.needed / 4);
  function madeVerdicts(sp) {
    const eq = sp.estEq, nutsRaise = sp.bigLate && sp.made.strength !== 'strong', close = isClose(sp);
    let res;
    if (nutsRaise || eq * 100 < sp.needed) res = { best: 'fold', verdicts: { fold: B, call: close && !nutsRaise ? OK : M, raise: M } };
    else res = { best: 'call', verdicts: { call: B, raise: eq >= 0.75 ? B : eq >= 0.65 ? OK : M, fold: close ? OK : M } };
    if (!sp.canRaise) delete res.verdicts.raise;
    return res;
  }

  // ---------- questions ----------
  const OUTS_HINT = 'Посчитай карты, которые сделают руку сильной: флеш-дро — 9 аутов, открытое стрит-дро — 8, гатшот — 4, ' +
    'карманная пара до сета — 2, пара до трипса — 2, вторая пара к своей карте — 3. Каждую карту считай один раз.';
  function questions(spot, settings) {
    if (!spot) return [];
    const on = (settings && settings.questions) || {};
    const Q = {
      outs: { id: 'outs', type: 'number', prompt: 'Сколько у тебя аутов?', unit: 'аутов',
        hint: OUTS_HINT + (spot.multiway ? ' В банке 3+ игроков — считай только чистые ауты.' : '') },
      cards: { id: 'cards', type: 'choice', prompt: 'Сколько карт увидишь за эту ставку?', options: [{ v: 1, label: 'Одну' }, { v: 2, label: 'Две' }],
        hint: 'Две карты — только если сейчас флоп и после твоего колла ставок больше не будет (олл-ин). Иначе — одну.' },
      equity: { id: 'equity', type: 'number', prompt: 'Твоё эквити по правилу 2 и 4?', unit: '%',
        hint: 'Одна карта: ауты × 2. Две карты: ауты × 4, а если аутов больше 8 — ауты × 4 − (ауты − 8).' },
      potodds: { id: 'potodds', type: 'number', prompt: 'Какой процент нужен по шансам банка?', unit: '%',
        info: { pot: spot.pot, bet: spot.betTo, toCall: spot.toCall },
        hint: 'Нужный % = твой колл ÷ (банк вместе со ставкой соперника + твой колл) × 100.' },
    };
    return (spot.questions || []).filter((id) => on[id === 'cards' ? 'outs' : id] !== false).map((id) => Q[id]);
  }

  // ---------- answer checks ----------
  const fb = (kind, verdict, title, lines) => ({ kind, verdict, title, lines, ok: verdict !== 'mistake' });
  const num = (v) => (typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')));
  const ruleOf = (sp) => (o) => (sp.cardsToSee === 1 ? o * 2 : o * 4 - Math.max(0, o - 8));
  const formula = (sp, o) => (sp.cardsToSee === 1 ? `${o} × 2 = ${o * 2}%` : o > 8 ? `${o} × 4 − (${o} − 8) = ${ruleOf(sp)(o)}%` : `${o} × 4 = ${o * 4}%`);
  const cardsNote = (sp) => (sp.cardsToSee === 2 ? '(две карты: олл-ин на флопе)' : sp.street === 'turn' ? '(одна карта: впереди только ривер)' : '(одна карта, ставка не олл-ин)');

  // accusative singular: туза, короля, валета, but даму, десятку …
  const accOf = (r) => { const n = Cards.rankRu(r); return n.endsWith('а') ? n.slice(0, -1) + 'у' : Cards.rankRu(r, Cards.GEN); };
  function overNote(sp) {
    const ranks = [...new Set(sp.outs.overList.map(R))].sort((a, b) => b - a);
    const names = cap(joinRu(ranks.map(NP))), pairOf = Cards.rankRu(ranks[0], Cards.GEN);
    if (!sp.overOk) return `${names} не считаем: ${sp.multiway ? 'соперников несколько' : 'соперник ставил крупно'}, и пары ${pairOf} может не хватить.`;
    const how = ranks.length > 1 ? `${names} можно посчитать как оверкарты, по 3 аута на каждую` : `${cap(accOf(ranks[0]))} можно посчитать как оверкарту — ещё 3 аута`;
    return `${how}: ${sp.facing ? 'ставка небольшая' : 'соперник не ставил'}, и пары ${pairOf} может хватить. Тогда ${sp.correctOuts + sp.outs.over} — тоже верно.`;
  }
  function outsLines(sp) {
    const o = sp.outs, lines = o.draws.map((d) => d.text);
    if (!o.draws.length) lines.push('Ни одна карта не сделает твою руку сильной: дро нет — 0 аутов.');
    else if (o.draws.length > 1) {
      const sum = U.sum(o.draws.map((d) => d.n)), dup = sum - o.total;
      lines.push(`Всего: ${o.draws.map((d) => d.n).join(' + ')}${dup ? ` − ${dup} (эти карты посчитаны дважды)` : ''} = ${outsW(o.total)}.`);
    }
    if (o.over) lines.push(overNote(sp));
    if (o.dirty) {
      lines.push('Грязные ауты: ' + Object.keys(DIRTY_RU).map((k) => {
        const cs = o.dirtyList.filter((d) => d.code === k).map((d) => Cards.str(d.c));
        return cs.length ? `${cs.join(', ')} — ${DIRTY_RU[k][cs.length > 1 ? 1 : 0]}` : null;
      }).filter(Boolean).join('; ') + '.');
    }
    if (sp.multiway && o.total) {
      lines.push(o.dirty ? `В банке 3+ игроков — считаем только чистые ауты: против нескольких соперников грязные слишком часто проигрывают. ${o.total} − ${o.dirty} = ${o.clean}.`
        : 'В банке 3+ игроков — считаем только чистые ауты; здесь все ауты чистые.');
    }
    return lines;
  }
  function potLines(sp) {
    const { pot, toCall, potStart, myBet } = sp, f = U.fmt;
    const bets = pot - potStart, n = Math.round(sp.needed);
    const head = sp.short ? `Банк, который ты можешь выиграть, — ${f(pot)} (лишнее сверх твоего стека тебе не достанется).`
      : bets === sp.betTo && !myBet ? `Банк ${f(potStart)} + ставка ${f(bets)} = ${f(pot)}.`
      : `Банк ${f(potStart)} + ставки на этой улице ${f(bets)} = ${f(pot)}.`;
    const mine = myBet ? ` Ты уже вложил ${f(myBet)} на этой улице — доплатить нужно ${f(toCall)}.` : '';
    return [`${head}${mine} Твой колл ${f(toCall)}. ${f(toCall)} ÷ (${f(pot)} + ${f(toCall)}) = ${n}%.`];
  }

  function check(spot, qid, value, answers = {}) {
    const sp = spot, x = num(value), rule = ruleOf(sp);
    const said = (s) => (Number.isFinite(x) ? `ты указал ${s}` : 'ты ничего не указал');
    if (qid === 'outs') {
      const hit = sp.acceptedOuts.find((a) => Math.abs(x - a) <= 1);
      const lines = outsLines(sp);
      if (hit === undefined) return fb('outs', M, `❌ Ауты: ${said(x)}, правильно ${sp.correctOuts}.`, lines);
      return fb('outs', 'correct', hit === sp.correctOuts ? `✅ Ауты: ${sp.correctOuts} — верно.` : `✅ Ауты: ${x} — засчитано (с оверкартами; без них ${sp.correctOuts}).`, lines);
    }
    if (qid === 'cards') {
      const w = (k) => (k === 2 ? 'две' : 'одна');
      const why = sp.cardsToSee === 2 ? 'Олл-ин на флопе: после колла ставок больше не будет, и ты увидишь и тёрн, и ривер.'
        : sp.street === 'turn' ? 'Сейчас тёрн — впереди только одна карта, ривер.'
        : 'Ставка не олл-ин: на тёрне соперник может поставить снова, поэтому этот колл покупает только одну карту.';
      return x === sp.cardsToSee ? fb('cards', 'correct', `✅ Карты: ${w(x)} — верно.`, [why])
        : fb('cards', M, `❌ Карты: ${said(`«${x === 2 ? 'две' : x === 1 ? 'одну' : x}»`)}, правильно — ${w(sp.cardsToSee)}.`, [why]);
    }
    if (qid === 'equity') {
      const note = cardsNote(sp), hit = sp.acceptedOuts.find((a) => Math.abs(x - rule(a)) <= 3);
      if (hit !== undefined) {
        return fb('equity', 'correct', hit === sp.correctOuts ? `✅ Эквити: ${formula(sp, hit)} ${note}.`
          : `✅ Эквити: ${formula(sp, hit)} ${note} — засчитано (с оверкартами).`, hit === sp.correctOuts ? [] : [`Без оверкарт: ${formula(sp, sp.correctOuts)}.`]);
      }
      const own = num(answers.outs);
      if (Number.isFinite(own) && Math.abs(x - rule(own)) <= 3) {
        return fb('equity', 'acceptable', `⚠️ Эквити: метод верный (${formula(sp, own)}), но ауты посчитаны неверно.`, [`Правильно: ${formula(sp, sp.correctOuts)} ${note}.`]);
      }
      return fb('equity', M, `❌ Эквити: ${said(x + '%')}, правильно ${sp.ruleEq}%.`,
        [`${formula(sp, sp.correctOuts)} ${note}.`, 'Правило 2 и 4: одна карта — ауты × 2, две карты (олл-ин на флопе) — ауты × 4, а при 9+ аутах вычти (ауты − 8).']);
    }
    if (qid === 'potodds') {
      const n = Math.round(sp.needed); // ±2 around the exact value or the rounded one the player is shown
      return Math.min(Math.abs(x - sp.needed), Math.abs(x - n)) <= 2 ? fb('potodds', 'correct', `✅ Шансы банка: ${n}% — верно.`, potLines(sp))
        : fb('potodds', M, `❌ Шансы банка: ${said(x + '%')}, правильно ${n}%.`, potLines(sp));
    }
    return null;
  }

  // ---------- action ----------
  const FE_RU = {
    high: ['сбрасывает часто', 'часто сбрасывает на агрессию'], medium: ['сбрасывает иногда', 'иногда сбрасывает на агрессию'],
    low: ['сбрасывает редко', 'редко сбрасывает на агрессию'], none: ['почти никогда не сбрасывает', 'почти никогда не сбрасывает'],
  };
  const who = (sp) => {
    const v = sp.villain, fe = FE_RU[sp.villainFE];
    if (sp.multiway && !sp.facing) return `Самый цепкий из соперников, ${v.name}${v.revealed ? ` («${v.styleName}»), ${fe[0]}` : `, ${fe[1]}`}`; // no bettor to point at
    return v.revealed ? `Соперник «${v.styleName}» (${fe[0]})` : `Этот соперник ${fe[1]}`;
  };
  const isDrawSpot = (sp) => sp.kind === 'draw' || (sp.kind === 'nodraw' && sp.street !== 'river');
  const nounOf = (sp, a) => (a === 'raise' ? (sp.kind === 'draw' ? (sp.facing ? 'рейз-полублеф' : 'ставка-полублеф') : sp.facing ? 'рейз' : 'ставка')
    : { fold: 'сброс', check: 'чек', call: 'колл' }[a]);
  const pastOf = (sp, a) => (a === 'raise' ? (sp.facing ? 'сделал рейз' : 'поставил') : { fold: 'сбросил', check: 'чекнул', call: 'заколлировал' }[a]);
  // '33%' or '33,3%' when rounding would hide which side of the comparison we are on
  const showNeed = (sp) => (Math.round(sp.needed) === sp.ruleEq && sp.ruleEq !== sp.needed ? U.pctNum(sp.needed, 1) : pctR(sp.needed));

  const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const rangeOf = (sp) => (sp.multiway ? 'соперники так играют' : 'этот соперник так ставит');
  function actionLines(sp, t) {
    const L = [], o = sp.correctOuts, E = sp.ruleEq, N = sp.needed, v = sp.verdicts;
    if (isDrawSpot(sp)) {
      if (!sp.facing) {
        L.push('Чек бесплатный: следующую карту ты увидишь, ничего не доплачивая.');
        if (v.raise === B) L.push(`${who(sp)}, а у тебя ${outsW(o)} — ставка-полублеф тоже хороша: можешь забрать банк сразу, а если заплатят, у тебя остаётся дро.`);
        else if (v.raise === OK) {
          L.push(o < 8 ? `У тебя всего ${outsW(o)} — ставка-полублеф допустима, но проще взять бесплатную карту.`
            : sp.foldEq === 'none' ? `${who(sp)}, так что блефовать бессмысленно. Но у тебя ${outsW(o)}: ставка допустима — такое дро часто выигрывает и само. Бесплатная карта тоже хороша.`
            : `${who(sp)} — ставка-полублеф допустима, но бесплатная карта надёжнее.`);
        } else if (v.raise === M) L.push(`${who(sp)} — полублеф против него не сработает, бери бесплатную карту.`);
        if (t === 'fold') L.push('Никогда не сбрасывай, когда можно бесплатно чекнуть.');
        return L;
      }
      if (showdownCall(sp)) {
        L.push(`По аутам ${E}% < ${showNeed(sp)} — как дро колл невыгоден.`);
        L.push(`Но у тебя уже есть готовая рука (${lowerFirst(sp.made.name)}): против рук, с которыми ${rangeOf(sp)}, у тебя примерно ${pctR(sp.estEq * 100)} эквити — колл окупается.`);
      } else L.push(`${E}% ${E >= N ? '≥' : '<'} ${showNeed(sp)} — колл ${E >= N ? 'окупается в долгую' : 'в долгую невыгоден'}.`);
      if (!o && sp.kind === 'nodraw') L.push('У тебя нет ни готовой руки, ни дро — платить не за что.');
      if (o >= 12 && v.raise === B) {
        const eqTo = sp.street === 'flop' ? `около ${o * 4 - (o - 8)}% до ривера` : `около ${o * 2}% на ривере`;
        L.push(`${outsW(o)} — очень сильное дро (${eqTo}): рейз-полублеф выигрывает сразу, если соперник сбросит, а если заплатит — у тебя всё равно много шансов.`);
      } else if (o >= 8 && sp.canRaise) {
        const fe = sp.foldEq;
        if (fe === 'high' || fe === 'medium') L.push(`${who(sp)}, поэтому рейз как полублеф ${E < N ? 'тоже был бы разумным вариантом' : 'тоже допустим'}.`);
        else if (fe === 'low') L.push(`${who(sp)} — рейз-полублеф ${E < N ? 'допустим, но сбросить надёжнее' : 'здесь не лучший вариант'}.`);
        else L.push(`${who(sp)} — полублеф против него не сработает.`);
        if (sp.multiway) L.push('Соперников несколько — шанс, что сбросят все, ниже.');
      } else if (t === 'raise' && o < 8) {
        L.push(`Рейз как полублеф имеет смысл только с сильным дро (8+ аутов) против соперника, который умеет сбрасывать${o ? `, а у тебя ${outsW(o)}` : ''}.`);
      }
      return L;
    }
    const m = sp.made, tag = ['сет', 'трипс', 'оверпара', 'топ-пара', 'слабая пара', 'играет борд'].includes(m.label) ? ` (${m.label})` : '';
    L.push(`Твоя рука: ${lowerFirst(m.name)}${tag}.`);
    if (sp.bigLate && m.strength !== 'strong') {
      const end = m.strength === 'none' ? 'Твои карты не дали даже пары — сброс.' : 'С одной парой — сброс.';
      L.push(sp.villain.revealed ? `Соперник «${sp.villain.styleName}»: крупный рейз на поздней улице от такого соперника — почти всегда натс. ${end}`
        : `Этот соперник редко ставит крупно: крупный рейз на поздней улице от такого соперника — почти всегда натс. ${end}`);
      return L;
    }
    const eq = sp.estEq * 100, ok = eq >= N, close = isClose(sp);
    const p = (x) => (close ? U.pctNum(x, 1) : pctR(x));
    L.push(`Против рук, с которыми ${rangeOf(sp)}, у тебя примерно ${p(eq)} эквити — нужно ${p(N)}. ` +
      (close ? `Это почти на грани: ${ok ? 'колл чуть выгоднее, сброс тоже допустим' : 'сброс чуть выгоднее, колл тоже допустим'}.` : ok ? 'Колл окупается.' : 'Колл невыгоден — сбрасывай.'));
    if (v.raise === B || v.raise === OK) L.push('Рука сильная — повысить за ценностью тоже хорошо.');
    return L;
  }

  function evaluateAction(spot, action) {
    if (!spot) return null;
    const sp = spot;
    let t = typeof action === 'string' ? action : action && action.type;
    if (t === 'bet' || t === 'allin') t = 'raise';
    if (t === 'call' && !sp.facing) t = 'check';
    if (t === 'check' && sp.facing) t = 'call';
    const vd = sp.verdicts[t] || M;
    const verdict = vd === B ? 'correct' : vd === OK ? 'acceptable' : 'mistake';
    const alts = Object.keys(sp.verdicts).filter((a) => a !== sp.best && sp.verdicts[a] === B);
    const right = nounOf(sp, sp.best) + (alts.length ? ` (или ${alts.map((a) => nounOf(sp, a)).join(', ')})` : '');
    const title = verdict === 'correct' ? `✅ Действие: ${nounOf(sp, t)} — верно.`
      : verdict === 'acceptable' ? `⚠️ Действие: ${nounOf(sp, t)} — допустимо, но лучше ${right}.`
      : `❌ Действие: ты ${pastOf(sp, t)}, правильно — ${right}.`;
    return fb('action', verdict, title, actionLines(sp, t));
  }

  // ---------- after the hand: real equity vs the actual cards ----------
  function realEquity(spot, hand) {
    if (!spot || !hand || !(spot.questions || []).includes('outs')) return null;
    if (!spot.opps.every((o) => hand.hole[o.seat])) return null;
    const opp = spot.opps.map((o) => hand.hole[o.seat]), hands = [spot.hole, ...opp];
    const real = Equity.calc(hands, spot.board, { toCome: spot.cardsToSee }).eq[0] * 100, rule = spot.ruleEq;
    const vs = spot.opps.map((o, i) => `${cardsTight(opp[i])} (${o.name})`).join(' и ');
    const d = real - rule;
    let why;
    const sc = (h, c = []) => HandEval.score([...h, ...spot.board, ...c]);
    if (Math.abs(d) < 3) why = `Правило 2 и 4 работает: разница всего ${U.dec(Math.abs(d), 1)} п.п.`;
    else if (d > 0 && opp.every((h) => sc(spot.hole) > sc(h))) why = 'Реально больше: ты выигрываешь и без попадания — сейчас твоя рука сильнее.';
    else if (d > 0) { // behind now: uncounted cards (dirty outs, overcards …) win as well
      const counted = new Set(spot.multiway ? spot.outs.cleanList : spot.outs.list), seen = new Set([...spot.hole, ...spot.board, ...opp.flat()]);
      const extra = spot.cardsToSee === 1 ? Cards.deck().filter((c) => !seen.has(c) && !counted.has(c) && opp.every((h) => sc(spot.hole, [c]) > sc(h, [c]))) : [];
      why = extra.length ? `Реально больше: против этих рук выигрывают и карты, которые не вошли в подсчёт: ${extra.map(Cards.str).join(', ')}.`
        : 'Реально больше: против этих рук выигрывают и карты, которые не вошли в подсчёт аутов.';
    } else {
      const parts = [];
      if (spot.cardsToSee === 1) {
        const held = new Set(opp.flat()), mine = spot.multiway ? spot.outs.cleanList : spot.outs.list;
        const blocked = mine.filter((c) => held.has(c));
        const lost = mine.filter((c) => !held.has(c) && HandEval.score([...spot.hole, ...spot.board, c]) < Math.max(...opp.map((h) => HandEval.score([...h, ...spot.board, c]))));
        if (blocked.length) parts.push(`${blocked.map(Cards.str).join(', ')} — у соперника на руках`);
        if (lost.length) parts.push(`${lost.map(Cards.str).join(', ')} не спасают: у соперника всё равно рука сильнее`);
      }
      why = parts.length ? `Реально меньше: часть аутов не работает (${parts.join('; ')}).`
        : 'Реально меньше: соперник уже впереди, и часть твоих аутов не помогает против его руки.';
    }
    return { kind: 'realEquity', verdict: 'info', ok: true, title: `ℹ️ По правилу: ${rule}%. Реально против ${vs}: ${U.pctNum(real, 1)}.`, lines: [why] };
  }

  // ---------- reading the opponent (SPEC 9.3) ----------
  const READ_OPTIONS = [{ v: 'strong', label: 'Очень сильная рука' }, { v: 'medium', label: 'Средняя рука' }, { v: 'draw', label: 'Дро' }, { v: 'bluff', label: 'Блеф' }];
  const TRUTH_RU = { strong: 'очень сильная рука', medium: 'средняя рука', draw: 'дро', bluff: 'блеф' };
  const DRAW_RU = { flush: 'флеш-дро', oesd: 'открытое стрит-дро', double: 'двойной гатшот', gutshot: 'гатшот', straight: 'стрит-дро' };

  function readQuestion(hand, seat, table) {
    if (!hand || hand.street === 'preflop' || hand.phase !== 'betting') return null;
    if (hand.currentBet - (hand.bets[seat] || 0) <= 0) return null;
    const e = lastWager(hand, seat), p = e && table.players[e.seat];
    if (!p || p.isHuman || !hand.hole[e.seat]) return null;
    const sizeFrac = e.potBefore > 0 ? e.add / e.potBefore : 1;
    if (sizeFrac < 0.66) return null;
    return { bettor: e.seat, truth: classify(hand.hole[e.seat], hand.board), sizeFrac, street: hand.street,
      board: hand.board.slice(), allIn: !!e.allIn, entry: e.i, options: READ_OPTIONS };
  }

  function holdingRu(hole, board) {
    const m = madeInfo(hole, board), r = R(hole[0]);
    let s = m.label === 'сет' ? 'сет ' + GP(r) : m.strength === 'none' && m.cat > CAT.HIGH ? `ничего, ${lowerFirst(m.name)} только на борде` : lowerFirst(m.name);
    if (board.length < 5) {
      const d = computeOuts(hole, board).draws.find((x) => DRAW_RU[x.type]);
      if (d) s += ' + ' + DRAW_RU[d.type];
    }
    return s;
  }

  function preflopRu(hand, seat) {
    let raises = 0, strong = false;
    const acts = [];
    for (const e of hand.log) {
      if (e.street !== 'preflop') break;
      if (e.seat === seat && e.type !== 'sb' && e.type !== 'bb' && e.type !== 'fold') {
        if (e.type === 'raise') strong = true;
        acts.push(e.type === 'raise' ? (raises === 0 ? 'открытие рейзом' : raises === 1 ? '3-бет' : 'ререйз')
          : e.type === 'call' ? (raises === 0 ? (hand.pos[seat] === 'SB' ? 'доплата с малого блайнда' : 'лимп') : 'колл рейза')
          : 'чек на большом блайнде');
      }
      if (e.type === 'raise' || e.type === 'bet') raises++;
    }
    if (!acts.length) return null;
    const why = strong ? 'это говорит о сильном диапазоне' : acts.length === 1 && acts[0] === 'чек на большом блайнде' ? 'рука может быть любой: флоп был бесплатным'
      : 'обычно так играют средние и спекулятивные руки';
    return `Префлоп: ${acts.join(', затем ')} — ${why}.`;
  }

  function playerTypeRu(p) {
    if (p.revealed) {
      // «Такой игрок …» keeps the description's «его ставка» grammatical for female bots too
      const B = bots(), st = B && B.STYLES && B.STYLES[p.style];
      return `${p.name} — «${styleName(p)}»${st && st.type ? ` (${st.type})` : ''}.${st && st.desc ? ' Такой игрок ' + lowerFirst(st.desc.split('. ')[0].replace(/\.$/, '')) + '.' : ''}`;
    }
    const h = p.hud || { hands: 0, vpip: 0, pfr: 0 };
    if (h.hands < 8) return `Статистики у ${gen(p.name)} пока мало (${U.nplural(h.hands, 'раздача', 'раздачи', 'раздач')}) — опирайся на остальные признаки.`;
    const vpip = h.vpip / h.hands, pfr = h.pfr / h.hands, loose = vpip >= 0.3, aggr = pfr >= vpip * 0.5;
    const desc = loose ? (aggr ? 'лузовый агрессивный игрок: часто ставит крупно с чем угодно' : 'лузовый пассивный игрок: играет много рук, но крупно ставит в основном с силой')
      : aggr ? 'тайтовый агрессивный игрок: ставит и с сильными руками, и с дро, иногда блефует' : 'тайтовый пассивный игрок: крупно ставит почти только с сильной рукой';
    return `${p.name} играет ${pctR(vpip * 100)} раздач и повышает префлоп в ${pctR(pfr * 100)} раздач — похоже, это ${desc}.`;
  }

  function readReview(read, answer, hand, table, extras = {}) {
    if (!read || !hand || !table) return null;
    const p = table.players[read.bettor], hole = hand.hole[read.bettor];
    if (!p || !hole) return null;
    const ok = answer === read.truth, lab = (READ_OPTIONS.find((o) => o.v === answer) || {}).label;
    const lines = ['Признаки:', playerTypeRu(p)];
    const pos = hand.pos[read.bettor];
    if (pos) {
      lines.push(`Позиция: ${pos}${['CO', 'BTN'].includes(pos) ? ' — из поздней позиции чаще ставят широким диапазоном, в том числе блефуют.'
        : ['UTG', 'UTG+1'].includes(pos) ? ' — из ранней позиции обычно играют сильные руки.'
        : ['MP', 'LJ', 'HJ'].includes(pos) ? ' — из средней позиции играют чуть шире, чем из ранней, но всё ещё довольно сильные руки.' : '.'}`);
    }
    const pre = preflopRu(hand, read.bettor);
    if (pre) lines.push(pre);
    lines.push(`Размер ставки: ${pctR(read.sizeFrac * 100)} банка${read.allIn ? ' (олл-ин)' : ''} — крупно: так ставят с очень сильной рукой или с блефом, средние руки обычно ставят меньше.`);
    const ms = extras.thinkMs;
    if (Number.isFinite(ms)) {
      const s = U.dec(ms / 1000, 1);
      lines.push(ms < 1200 ? `Тайминг: быстрая ставка (${s} с) — часто это заранее решённое действие: сильная рука или блеф.`
        : ms > 3000 ? `Тайминг: долгое раздумье (${s} с) — сомнение чаще бывает со средней рукой или дро, но это может быть и спектакль.`
        : `Тайминг: обычная пауза (${s} с) — ничего особенного не подсказывает.`);
    }
    if (Array.isArray(extras.tellsSeen)) {
      const seen = extras.tellsSeen.filter((r) => r && r.seat === read.bettor);
      if (!seen.length) lines.push(`Теллов у ${gen(p.name)} ты не видел.`);
      for (const r of seen) lines.push(`Телл: ${p.name} ${r.text}${r.meaning ? ` — ${r.meaning}` : ''}${r.acting ? ' (на деле это был спектакль: показанное было обратным)' : ''}.`);
    }
    lines.push(`На самом деле у ${gen(p.name)}: ${cardsTight(hole)} — ${holdingRu(hole, read.board || hand.board)} (${TRUTH_RU[read.truth]}).`);
    const title = ok ? `✅ Чтение соперника: верно — ${TRUTH_RU[read.truth]}.`
      : lab ? `❌ Чтение соперника: ты выбрал «${lab}», а на самом деле — ${TRUTH_RU[read.truth]}.` : `❌ Чтение соперника: на самом деле — ${TRUTH_RU[read.truth]}.`;
    return fb('read', ok ? 'correct' : M, title, lines);
  }

  // ---------- tells: the reaction the player missed while looking at the board ----------
  function lookHint(missed, table, street) {
    const honest = (missed || []).filter((r) => r && !r.acting && !r.random && r.truth !== 'neutral' && table.players[r.seat]);
    const r = honest.find((x) => x.shown === 'strength') || honest[0];
    if (!r) return null;
    const st = STREET_RU[street] || 'флоп';
    const meaning = String(r.meaning || '').replace(/флоп/g, st);
    return fb('tells', M, `❌ Теллы: ты смотрел на борд, когда открывался ${st}.`,
      [`Ты смотрел на борд. В этот момент ${table.players[r.seat].name} ${r.text}${meaning ? ` — ${meaning}` : ''}. Смотри на соперников, борд никуда не денется.`]);
  }

  // ---------- the player's own timing (SPEC 9.4) ----------
  const timing = (() => {
    let log = [];
    const avg = (a) => U.sum(a.map((x) => x.ms)) / a.length;
    return {
      add(ms, strong) { log.push({ ms: +ms || 0, strong: !!strong }); if (log.length > 20) log.shift(); },
      warning() {
        const s = log.filter((x) => x.strong), w = log.filter((x) => !x.strong);
        if (s.length < 3 || w.length < 3 || avg(s) - avg(w) <= 2000) return null;
        return 'Твой тайминг выдаёт силу руки. Держи одинаковую паузу перед каждым действием.';
      },
      reset() { log = []; },
    };
  })();
  function heroStrong(hole, board) {
    if (!hole) return false;
    if (!board || board.length < 3) return Equity.holeTopPct(hole) <= 0.12;
    const k = classify(hole, board);
    return k === 'strong' || k === 'medium';
  }

  return { analyze, questions, check, evaluateAction, realEquity, readQuestion, readReview, lookHint, timing, heroStrong, computeOuts, madeInfo };
})();

// ===== 70-view.js =====
// ===== View: tiny shared DOM helpers (cards, suit-coloured text, modal, toast) =====
// Used by UI (table) and Screens. Pure string builders are DOM-free; DOM functions touch
// `document` only when called.
const View = (() => {
  // '<div class="pcard red"><span class="pc-r">A</span><span class="pc-s">♥</span></div>'
  // opts: {size:'sm'|'xs', hl:bool, dim:bool, corner:bool (adds corner index)}
  function cardHTML(c, opts = {}) {
    const cls = ['pcard'];
    if (opts.size) cls.push(opts.size);
    if (opts.hl) cls.push('hl');
    if (opts.dim) cls.push('dim');
    if (c === null || c === undefined) return `<div class="${cls.join(' ')} back" aria-label="карта рубашкой"></div>`;
    if (c === -1) return `<div class="${cls.join(' ')} empty"></div>`;
    if (Cards.isRed(c)) cls.push('red');
    const r = Cards.rankLabel(Cards.rank(c)), s = Cards.SUIT_SYMBOLS[Cards.suit(c)];
    return `<div class="${cls.join(' ')}" data-c="${c}" aria-label="${r}${s}"><span class="pc-r">${r}</span><span class="pc-s">${s}</span></div>`;
  }
  const cardsHTML = (cards, opts = {}) => `<span class="cards-row">${cards.map((c) => cardHTML(c, opts)).join('')}</span>`;

  // Escape plain text and colour suit symbols: 'A♥ K♥' → 'A<span class="s-red">♥</span> …'
  const suitText = (text) => U.esc(text).replace(/[♥♦]/g, '<span class="s-red">$&</span>');

  // Feedback block: fb = {verdict:'correct'|'acceptable'|'mistake'|'info', title, lines:[...]}
  function feedbackHTML(fb) {
    const lines = (fb.lines || []).map((l) => `<div class="fb-line">${suitText(l)}</div>`).join('');
    return `<div class="fb ${fb.verdict || 'info'}"><div class="fb-title v-${fb.verdict || 'info'}">${suitText(fb.title || '')}</div>${lines}</div>`;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  // modal(title, bodyHTML, {buttons:[{label, value, cls}], wide:bool, onOpen(root)}) → Promise<value|null>
  function modal(title, bodyHTML, opts = {}) {
    return new Promise((resolve) => {
      const buttons = opts.buttons || [{ label: 'Закрыть', value: null, cls: 'btn-primary' }];
      const back = el(`<div class="modal-back" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
        <div class="modal"${opts.wide ? ' style="width:min(980px,100%)"' : ''}>
          <div class="modal-head"><h2>${U.esc(title)}</h2><button class="btn btn-ghost btn-sm" data-x aria-label="Закрыть">✕</button></div>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-foot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${U.esc(b.label)}</button>`).join('')}</div>
        </div></div>`);
      const close = (v) => { document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      back.addEventListener('click', (e) => {
        if (e.target === back || e.target.closest('[data-x]')) return close(null);
        const b = e.target.closest('[data-i]');
        if (b && b.parentElement.classList.contains('modal-foot')) close(buttons[+b.dataset.i].value);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(back);
      if (opts.onOpen) opts.onOpen(back.querySelector('.modal-body'));
      const first = back.querySelector('.modal-foot .btn');
      if (first) first.focus({ preventScroll: true });
    });
  }

  function toast(text, ms = 3000) {
    let wrap = document.querySelector('.toast-wrap');
    if (!wrap) { wrap = el('<div class="toast-wrap" aria-live="polite"></div>'); document.body.appendChild(wrap); }
    const t = el(`<div class="toast">${suitText(text)}</div>`);
    wrap.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }

  return { cardHTML, cardsHTML, suitText, feedbackHTML, el, modal, toast };
})();

// ===== 72-settings.js =====
// ===== Settings: user preferences, validated and persisted via U.storage ('settings') =====
const Settings = (() => {
  const KEY = 'settings';
  const STYLE_IDS = ['rock', 'station', 'reg', 'maniac', 'actor'];
  const SPEED = { slow: 1.6, normal: 1, fast: 0.45 };
  const DEFAULTS = {
    players: 9, startBB: 100, levelHands: 10, speed: 'normal',
    botsMode: 'random', botStyles: ['rock', 'station', 'reg', 'maniac', 'actor', 'reg', 'rock', 'station'],
    questions: { preflop: true, outs: true, equity: true, potodds: true, read: true, tells: true },
    practiceFreq: 50, tournamentReview: 'hand',
  };
  const LIMITS = { players: [2, 9], startBB: [20, 300], levelHands: [5, 30] };
  const ENUMS = { speed: Object.keys(SPEED), botsMode: ['random', 'manual'], practiceFreq: [25, 50, 75, 100], tournamentReview: ['hand', 'end'] };

  const copy = (o) => JSON.parse(JSON.stringify(o));

  // `base` with every field of `raw` that has a valid type/range applied; garbage is ignored.
  function clean(raw, base) {
    const r = raw && typeof raw === 'object' ? raw : {};
    const out = copy(base);
    for (const [k, [lo, hi]] of Object.entries(LIMITS)) if (Number.isInteger(r[k]) && r[k] >= lo && r[k] <= hi) out[k] = r[k];
    for (const [k, list] of Object.entries(ENUMS)) if (list.includes(r[k])) out[k] = r[k];
    if (Array.isArray(r.botStyles)) out.botStyles = out.botStyles.map((d, i) => (STYLE_IDS.includes(r.botStyles[i]) ? r.botStyles[i] : d));
    const q = r.questions && typeof r.questions === 'object' ? r.questions : {};
    for (const k in out.questions) if (typeof q[k] === 'boolean') out.questions[k] = q[k];
    return out;
  }

  let cur = null; // loaded once; stays in memory when storage is unavailable
  const load = () => cur || (cur = clean(U.storage.get(KEY, null), DEFAULTS));
  const get = () => copy(load());
  // Shallow merge (questions merged per key), validated, persisted. set(DEFAULTS) = reset.
  function set(patch) {
    cur = clean(patch, load());
    U.storage.set(KEY, cur);
    return get();
  }
  const speedFactor = () => SPEED[load().speed];
  const reload = () => { cur = null; return get(); }; // re-read storage (tests)

  return { DEFAULTS, LIMITS, STYLE_IDS, get, set, speedFactor, reload };
})();

// ===== 75-stats.js =====
// ===== Stats: answer accuracy (total / category / preflop position / session), last mistakes =====
// Persisted via U.storage ('stats'); works in memory when storage is unavailable.
const Stats = (() => {
  const KEY = 'stats';
  const CATS = ['preflop', 'outs', 'equity', 'potodds', 'action', 'read', 'tells'];
  const CAT_RU = { preflop: 'Префлоп', outs: 'Ауты', equity: 'Эквити', potodds: 'Шансы банка', action: 'Действие', read: 'Чтение соперника', tells: 'Теллы' };
  const POSITIONS = ['UTG', 'UTG+1', 'MP', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  const MAX_SESSIONS = 30, MAX_MISTAKES = 20;

  const copy = (o) => JSON.parse(JSON.stringify(o));
  const arr = (a) => (Array.isArray(a) ? a : []);
  const cnt = (c) => {
    const n = c && Number.isInteger(c.n) && c.n > 0 ? c.n : 0;
    return { ok: c && Number.isInteger(c.ok) && c.ok > 0 ? Math.min(c.ok, n) : 0, n };
  };
  const cnts = (m, keys) => Object.fromEntries(keys.map((k) => [k, cnt(m && m[k])]));
  const cards = (a) => arr(a).filter((c) => Number.isInteger(c) && c >= 0 && c < 52);
  const mistake = (m) => ({
    ts: Number.isFinite(m.ts) ? m.ts : Date.now(), cat: String(m.cat || ''), title: String(m.title || ''),
    lines: arr(m.lines).map(String), handNo: Number.isInteger(m.handNo) ? m.handNo : null,
    mode: m.mode ? String(m.mode) : null, pos: m.pos ? String(m.pos) : null, hole: cards(m.hole), board: cards(m.board),
  });
  const session = (s) => ({ id: String(s.id || U.uid('s')), ts: Number.isFinite(s.ts) ? s.ts : 0, mode: s.mode || null, ...cnt(s), byCat: cnts(s.byCat, CATS) });

  // Validated copy of stored data (garbage → empty).
  function clean(raw) {
    const r = raw && typeof raw === 'object' ? raw : {};
    const look = cnt(r.looks && { ok: r.looks.players, n: r.looks.total });
    return {
      total: cnt(r.total), byCat: cnts(r.byCat, CATS), byPos: cnts(r.byPos, POSITIONS),
      sessions: arr(r.sessions).filter((s) => s && typeof s === 'object').slice(-MAX_SESSIONS).map(session),
      mistakes: arr(r.mistakes).filter((m) => m && typeof m === 'object').slice(0, MAX_MISTAKES).map(mistake),
      looks: { players: look.ok, total: look.n },
    };
  }

  let st = null, cur = null, curMode = null;
  const load = () => st || (st = clean(U.storage.get(KEY, null)));
  const save = () => U.storage.set(KEY, st);
  const bump = (c, ok) => { c.n++; if (ok) c.ok++; };

  function beginSession(mode = null) {
    const s = load();
    curMode = mode;
    cur = session({ id: U.uid('s'), ts: Date.now(), mode });
    s.sessions = s.sessions.filter((x) => x.n > 0).concat(cur).slice(-MAX_SESSIONS); // drop empty sessions
    save();
  }

  // ok: boolean (a feedback verdict string also works: only 'mistake' is wrong).
  // 'tells' is a habit, not an answer: it has its own category but stays out of total and session accuracy.
  function record(cat, ok, opts) {
    if (!CATS.includes(cat)) return;
    ok = typeof ok === 'string' ? ok !== 'mistake' : !!ok;
    const s = load();
    if (!cur) beginSession(curMode);
    bump(s.byCat[cat], ok);
    bump(cur.byCat[cat], ok);
    if (cat !== 'tells') { bump(s.total, ok); bump(cur, ok); }
    const pos = opts && opts.pos;
    if (cat === 'preflop' && POSITIONS.includes(pos)) bump(s.byPos[pos], ok);
    save();
  }

  function recordLook(looked) {
    const s = load();
    s.looks.total++;
    if (looked) s.looks.players++;
    record('tells', !!looked);
  }

  function addMistake(m) {
    if (!m || typeof m !== 'object') return;
    const s = load();
    s.mistakes = [mistake(m)].concat(s.mistakes).slice(0, MAX_MISTAKES);
    save();
  }

  // { total, byCat, byPos, sessions (oldest → newest, current last), mistakes (newest first), looks }
  const data = () => copy(load());
  function reset() { st = clean(null); cur = null; U.storage.remove(KEY); }
  const reload = () => { st = null; cur = null; return data(); }; // re-read storage (tests)

  return { CATS, CAT_RU, POSITIONS, beginSession, record, recordLook, addMistake, data, reset, reload };
})();

// ===== 80-ui.js =====
// ===== UI: the game screen — header, table, seats, board, action dock, coach panel, hand log =====
// DOM only. Game owns the state: mount(S, handlers) keeps a reference to the session object S and
// render() redraws from it. ask*() functions return Promises resolved by the player's input.
const UI = (() => {
  let S = null, H = {}, root = null, tableEl = null, feed = null, logBody = null, side = null, dock = null;
  let seatEls = [], betEls = [], prevBets = [], shownBoard = 0, boardBase = 0;
  let act = null, nextRes = null, keysBound = false, popSeat = null, tipFor = null;
  const MODE_RU = { learn: 'Обучение', practice: 'Тренировка', tournament: 'Турнир' };
  const STREET_RU = { preflop: 'Префлоп', flop: 'Флоп', turn: 'Тёрн', river: 'Ривер' };
  const QUICK = [['1/3', 1 / 3], ['1/2', 0.5], ['2/3', 2 / 3], ['Банк', 1], ['Олл-ин', 'all']];
  const $ = (sel, el = root) => el.querySelector(sel);
  const $$ = (sel, el = root) => [...el.querySelectorAll(sel)];
  const put = (el, html) => { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } };
  const tog = (el, c, on) => el && el.classList.toggle(c, !!on);
  const fmt = U.fmt, esc = U.esc;
  const mq = (q) => typeof matchMedia === 'function' && matchMedia(q).matches;
  const wide = () => mq('(min-width: 1100px)');
  const anim = () => (S && S.anim !== undefined ? S.anim : 1);

  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const IC = {
    book: svg('M4 5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5'),
    chart: svg('M4 20h16M7 16v-5M12 16V6M17 16v-8'),
    pause: svg('M9 5v14M15 5v14'),
    play: svg('M8 5l11 7-11 7z'),
    exit: svg('M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5'),
    bulb: svg('M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z'),
    grid: svg('M4 4h16v16H4zM4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16'),
    eye: svg('M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'),
    cards: svg('M5 6h9a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM15 5l1-2 5 1.4-3.4 13.3'),
  };
  const navBtn = (cmd, icon, label) => `<button class="btn btn-ghost btn-sm" data-cmd="${cmd}" title="${label}" aria-label="${label}">${icon}<span class="lbl">${label}</span></button>`;

  const skeleton = () => `
<div class="game m-${S.mode}">
  <header class="g-head">
    <div class="titlebox">
      <div class="brand"><span class="logo">♠</span>Тренажёр покера</div>
      <div class="g-meta"><span class="mode-badge">${MODE_RU[S.mode]}</span><span class="hinfo"></span></div>
    </div>
    <nav class="g-nav">${navBtn('cheat', IC.book, 'Шпаргалка')}${navBtn('stats', IC.chart, 'Статистика')}${navBtn('pause', IC.pause, 'Пауза')}${navBtn('menu', IC.exit, 'Меню')}</nav>
  </header>
  <div class="g-body">
    <main class="g-main">
      <div class="tzone"><div class="ptable">
        <div class="rail"><div class="felt"><div class="felt-print">♠ Тренажёр покера ♠</div></div></div>
        <div class="center"><div class="pots"></div><div class="board">${'<div class="slot"></div>'.repeat(5)}</div><div class="caption"></div></div>
        <div class="bets"></div>
        <div class="dealer" title="Дилер (баттон)">D</div>
        <div class="seats"></div>
        <div class="look hidden" role="dialog" aria-label="Куда смотреть">
          <div class="look-t"></div>
          <div class="look-b">
            <button class="btn" data-look="board">${IC.cards}Смотреть на борд</button>
            <button class="btn" data-look="players">${IC.eye}Смотреть на соперников</button>
          </div>
          <div class="look-bar"><i></i></div>
        </div>
        <div class="pop hidden"></div>
        <div class="veil hidden">Пауза</div>
      </div></div>
      <div class="dock idle"><div class="dock-in">
        <div class="d-aux">
          <button class="btn btn-sm d-hint" data-cmd="hint" title="Подсказка">${IC.bulb}<span class="lbl">Подсказка</span></button>
          <button class="btn btn-sm d-range" data-cmd="range" title="Посмотреть диапазон">${IC.grid}<span class="lbl">Посмотреть диапазон</span></button>
          <div class="d-msg"></div>
        </div>
        <div class="quick">${QUICK.map(([l, f]) => `<button class="btn btn-sm" data-q="${f}">${l}</button>`).join('')}</div>
        <div class="slide"><input type="range" class="amt-r" aria-label="Размер ставки"><input type="number" class="amt-n" inputmode="numeric" aria-label="Сумма ставки"></div>
        <div class="d-main">
          <button class="btn act act-fold" data-act="fold">Сброс<kbd>F</kbd></button>
          <button class="btn act act-call" data-act="call"><span>Чек</span><kbd>C</kbd></button>
          <button class="btn btn-primary act act-raise" data-act="raise"><span>Рейз</span><kbd>R</kbd></button>
        </div>
        <div class="d-next"><button class="btn btn-primary act" data-cmd="next">Следующая раздача</button></div>
      </div></div>
    </main>
    <aside class="side" data-tab="coach">
      <div class="side-tabs">
        <button class="tab" data-tab="coach">Тренер<i class="dot"></i></button>
        <button class="tab" data-tab="log">Журнал</button>
        <span class="peek" data-tab="coach"></span>
        <button class="tab-x" data-cmd="sheet" aria-label="Развернуть или свернуть">▴</button>
      </div>
      <section class="coach">
        <div class="sec-h"><h3>Тренер</h3><span class="sec-sub"></span></div>
        <div class="coach-feed" data-empty=""></div>
        <div class="coach-foot"></div>
      </section>
      <section class="log">
        <button class="sec-h log-h" data-cmd="logtoggle"><h3>Журнал раздачи</h3><span class="chev">▾</span></button>
        <div class="log-body"></div>
      </section>
    </aside>
  </div>
  <div class="tip hidden"></div>
</div>`;

  // ---------- mount ----------
  function mount(session, handlers) {
    S = session; H = handlers || {};
    act = null; nextRes = null; popSeat = null; shownBoard = 0; boardBase = 0;
    const app = document.getElementById('app');
    app.innerHTML = skeleton();
    root = app.querySelector('.game');
    tableEl = $('.ptable'); feed = $('.coach-feed'); logBody = $('.log-body'); side = $('.side'); dock = $('.dock');
    $('.coach-feed').dataset.empty = {
      learn: 'Тренер подскажет на каждом ключевом решении: позиция и диапазон до флопа, ауты, эквити и шансы банка после.',
      practice: 'Вопросы появляются выборочно. Объяснения — только если ошибёшься.',
      tournament: 'В турнире подсказок нет. Ошибки разберём после раздачи.',
    }[S.mode];
    if (S.mode === 'tournament' && S.st && S.st.tournamentReview === 'end') $('.coach-feed').dataset.empty = 'В турнире подсказок нет. Все ошибки разберём в конце турнира.';
    $('.sec-sub').textContent = MODE_RU[S.mode];
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('change', onInput);
    root.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t && !mq('(pointer: coarse)')) showTip(t); });
    root.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
    $('.coach-feed').addEventListener('scroll', hideTip, { passive: true });
    if (!keysBound) {
      keysBound = true;
      document.addEventListener('keydown', onKey);
      window.addEventListener('resize', () => { hidePop(); hideTip(); });
    }
    setupSeats();
    render();
  }

  function setupSeats() {
    const n = S.table.players.length;
    put($('.seats'), ''); put($('.bets'), '');
    seatEls = []; betEls = []; prevBets = [];
    S.table.players.forEach((p, i) => {
      const a = (90 + (i * 360) / n) * Math.PI / 180, x = Math.cos(a), y = Math.sin(a);
      const av = p.avatar || { initials: p.name.slice(0, 2), color: '#4b5d55' };
      const side = x < -0.55 ? ' left' : x > 0.55 ? ' right' : '';
      const seat = View.el(`<div class="seat${i === 0 ? ' me' : ''}${y < -0.35 ? ' top' : ''}${side}" data-seat="${i}" style="--x:${x.toFixed(4)};--y:${y.toFixed(4)}">
        <div class="s-cards"></div>
        <div class="plate"><div class="av" style="--avc:${esc(av.color)}">${esc(av.initials)}</div><div class="s-info"></div><span class="posb"></span></div>
        <div class="s-status"></div><div class="bubble"></div></div>`);
      const bet = View.el(`<div class="bet hidden${i === 0 ? ' me' : ''}" style="--x:${x.toFixed(4)};--y:${y.toFixed(4)}"></div>`);
      $('.seats').appendChild(seat); $('.bets').appendChild(bet);
      seatEls.push(seat); betEls.push(bet); prevBets.push(0);
    });
  }

  // ---------- render ----------
  function render() {
    if (!root || !root.isConnected) return;
    renderHead();
    S.table.players.forEach(renderSeat);
    renderCenter();
    renderBets();
    renderDealer();
    renderDock();
    if (popSeat !== null) showPop(popSeat);
  }

  function renderHead() {
    const t = S.table, h = S.hand;
    let html = h ? `<span><i class="k">Раздача </i><b>№${h.no}</b></span>` : '';
    html += `<span><i class="k">Блайнды </i><b>${fmt(t.sb)}/${fmt(t.bb)}</b></span>`;
    const L = S.mode === 'tournament' && S.levelInfo;
    if (L) html += `<span>Уровень <b>${L.level}</b></span>` + (L.left ? `<span><i class="k">До повышения </i><b>${U.nplural(L.left, 'раздача', 'раздачи', 'раздач')}</b></span>` : '');
    put($('.hinfo'), html);
    const pb = $('[data-cmd="pause"]');
    put(pb, (S.paused ? IC.play : IC.pause) + `<span class="lbl">${S.paused ? 'Продолжить' : 'Пауза'}</span>`);
    pb.title = S.paused ? 'Продолжить' : 'Пауза';
    tog(pb, 'on', S.paused);
    tog($('.veil'), 'hidden', !S.paused);
  }

  const SHORT = { rock: 'Камень', station: 'Станция', reg: 'Регуляр', maniac: 'Маньяк', actor: 'Актёр' };
  const styleName = (p) => {
    const st = typeof Bots !== 'undefined' && Bots.STYLES && Bots.STYLES[p.style];
    return st ? st.name : p.style;
  };
  const posTip = (pos) => {
    const info = typeof Ranges !== 'undefined' && Ranges.POS_INFO && Ranges.POS_INFO[pos];
    if (!info) return pos;
    return `${pos} — ${info.group === 'Блайнд' ? 'блайнд' : info.group.toLowerCase() + ' позиция'}\n${info.text}`;
  };

  function seatStatus(p, i) {
    const h = S.hand;
    if (p.busted) return ['out', p.place ? `Выбыл · ${p.place} место` : 'Выбыл'];
    if (!h || !h.dealt[i]) return ['', ''];
    const won = S.payouts && S.payouts[i];
    if (won) return ['won', '+' + fmt(won)];
    if (h.folded[i]) return ['fold', 'Сброс'];
    if (S.turn === i) return i === 0 ? ['myturn', 'Твой ход'] : ['think', 'думает'];
    if (h.allIn[i]) return ['allin', 'Олл-ин'];
    if (S.acts && S.acts[i]) return ['did', S.acts[i]];
    return ['', ''];
  }

  function renderSeat(p, i) {
    const el = seatEls[i], h = S.hand;
    if (!el) return;
    const dealt = !!(h && h.dealt[i]);
    const folded = dealt && h.folded[i];
    tog(el, 'turn', S.turn === i);
    tog(el, 'folded', folded);
    tog(el, 'out', p.busted);
    tog(el, 'away', !p.busted && h && !dealt);
    tog(el, 'win', !!(S.winners && S.winners.includes(i)));
    // cards
    const cardsEl = $('.s-cards', el);
    let cards = '';
    const hole = dealt && h.hole[i];
    if (hole) {
      if (i === 0) cards = hole.map((c) => View.cardHTML(c, { hl: S.hl && S.hl.has(c), dim: folded })).join('');
      else if (!folded && S.reveal && S.reveal.has(i)) cards = hole.map((c) => View.cardHTML(c, { hl: S.hl && S.hl.has(c) })).join('');
      else if (!folded) cards = View.cardHTML(null) + View.cardHTML(null);
    }
    tog(cardsEl, 'show', i !== 0 && !folded && S.reveal && S.reveal.has(i));
    put(cardsEl, cards);
    // name, style badge, stack
    let badge = '';
    if (i !== 0) badge = p.revealed ? `<i class="sty ${esc(p.style)}" title="${esc(styleName(p))}">${SHORT[p.style] || esc(styleName(p))}</i>` : '<i class="sty unk" title="Стиль пока неизвестен">?</i>';
    put($('.s-info', el), `<div class="s-name"><span class="nm">${esc(p.name)}</span>${badge}</div><div class="s-stack">${fmt(p.stack)}</div>${p.revealed && i ? `<div class="s-sty">${badge}</div>` : ''}`);
    // position badge with tooltip
    const pos = dealt ? h.pos[i] : '';
    const pb = $('.posb', el);
    put(pb, pos || '');
    if (pos) pb.dataset.tip = posTip(pos); else delete pb.dataset.tip;
    // status
    const [cls, text] = seatStatus(p, i);
    const st = $('.s-status', el);
    st.className = 's-status ' + cls;
    put(st, esc(text));
  }

  function sidePots(h) {
    // Display-only split of committed chips into main/side pots by all-in levels.
    const seats = h.seats || h.committed.map((_, i) => i);
    const paid = (s) => h.committed[s] - (h.returned ? h.returned[s] : 0);
    const levels = [...new Set(seats.filter((s) => h.allIn[s] && !h.folded[s]).map(paid))].sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    for (const L of levels) {
      const amt = U.sum(seats.map((s) => Math.max(0, Math.min(paid(s), L) - prev)));
      if (amt > 0) pots.push(amt);
      prev = L;
    }
    const rest = U.sum(seats.map((s) => Math.max(0, paid(s) - prev)));
    if (rest > 0) pots.push(rest);
    return pots;
  }

  function renderCenter() {
    const h = S.hand;
    let potHTML = '';
    if (h && !S.paid) {
      const total = typeof Engine !== 'undefined' && Engine.pot ? Engine.pot(h) : U.sum(h.committed || []);
      if (total) {
        potHTML = `<span class="pot"><i class="chip gold"></i>Банк <b>${fmt(total)}</b></span>`;
        const pots = h.result ? h.result.pots.map((p) => p.amount) : sidePots(h);
        if (pots.length > 1) potHTML += pots.map((a, k) => `<span class="pot sp">${k ? 'Побочный' + (pots.length > 2 ? ' ' + k : '') : 'Основной'} <b>${fmt(a)}</b></span>`).join('');
      }
    }
    put($('.pots'), potHTML);
    // board: revealed cards face up (the newest flip in), dealt-but-hidden as backs, the rest empty slots.
    // Slots persist and the highlight is toggled in place, so a flip animation is never replayed or cut short.
    const shown = h ? Math.min(S.boardShown || 0, h.board.length) : 0;
    if (shown !== shownBoard) { boardBase = shown > shownBoard ? shownBoard : shown; shownBoard = shown; }
    $$('.board .slot').forEach((slot, k) => {
      const face = k < shown;
      let html = View.cardHTML(face ? h.board[k] : h && k < h.board.length ? null : -1);
      if (face && k >= boardBase) html = html.replace('class="pcard', `style="--i:${k - boardBase}" class="pcard flip`);
      put(slot, html);
      if (face) tog(slot.firstElementChild, 'hl', S.hl && S.hl.has(h.board[k]));
    });
    const cap = $('.caption');
    put(cap, S.caption ? View.suitText(S.caption) : '');
    tog(cap, 'win', !!S.winners);
  }

  function renderBets() {
    const h = S.hand;
    betEls.forEach((el, i) => {
      const b = h && h.dealt[i] && !S.collecting ? h.bets[i] || 0 : 0;
      tog(el, 'hidden', !b);
      put(el, b ? `<i class="chip"></i><span>${fmt(b)}</span>` : '');
      if (b > prevBets[i]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      prevBets[i] = b;
    });
  }

  function renderDealer() {
    const d = $('.dealer'), h = S.hand, n = S.table.players.length;
    const btn = h ? h.button : S.table.button;
    if (btn === undefined || btn === null) return d.classList.add('hidden');
    d.classList.remove('hidden');
    const a = (90 + (btn * 360) / n) * Math.PI / 180;
    d.style.setProperty('--x', Math.cos(a).toFixed(4));
    d.style.setProperty('--y', Math.sin(a).toFixed(4));
    if (btn === 0) { d.style.setProperty('--f', '0.62'); d.style.setProperty('--toff', '-110px'); }
    else { d.style.removeProperty('--f'); d.style.removeProperty('--toff'); }
  }

  // ---------- action dock ----------
  const raiseLabel = (L, to) => (to >= L.maxTo ? `Олл-ин ${fmt(L.maxTo)}` : `${L.isBet ? 'Ставка' : 'Рейз до'} ${fmt(to)}`);

  function renderDock() {
    if (!dock) return;
    const L = act && act.legal;
    tog(dock, 'idle', !L);
    tog(dock, 'next', !!nextRes);
    const [fold, call, raise] = $$('.d-main .btn', dock);
    fold.disabled = !L; call.disabled = !L;
    raise.disabled = !L || !L.canRaise;
    $$('.quick .btn, .slide input', dock).forEach((b) => { b.disabled = !L || !L.canRaise; });
    put($('span', call), !L ? 'Чек / колл' : L.canCheck ? 'Чек' : L.toCall >= L.stack ? `Олл-ин ${fmt(L.toCall)}` : `Колл ${fmt(L.toCall)}`);
    put($('span', raise), !L ? 'Ставка / рейз' : L.canRaise ? raiseLabel(L, amount()) : 'Рейз');
    $('.d-hint', dock).disabled = !(S.hint && S.mode === 'learn');
    $('.d-range', dock).disabled = !S.rangeKey;
    tog($('.d-next', dock), 'hidden', !nextRes);
    tog($('.d-main', dock), 'hidden', !!nextRes);
    put($('.d-msg', dock), dockMsg());
  }

  function dockMsg() {
    if (nextRes) return 'Раздача окончена.';
    if (act) return 'Твой ход.';
    if (S.asking) return 'Ответь на вопрос тренера.';
    if (S.turn !== null && S.turn !== undefined && S.turn !== 0) return `Ходит <b>${esc(S.table.players[S.turn].name)}</b>…`;
    return '';
  }

  function amount() {
    const L = act && act.legal;
    if (!L) return 0;
    const v = Math.round(parseFloat(String($('.amt-n', dock).value).replace(',', '.')));
    return U.clamp(isFinite(v) ? v : L.minTo, L.minTo, L.maxTo);
  }
  function setAmount(v) {
    const L = act && act.legal;
    if (!L) return;
    v = U.clamp(Math.round(v), L.minTo, L.maxTo);
    const r = $('.amt-r', dock), n = $('.amt-n', dock);
    r.min = n.min = L.minTo; r.max = n.max = L.maxTo; r.step = 1;
    r.value = n.value = v;
    put($('.act-raise span', dock), raiseLabel(L, v));
  }
  function defaultRaise(L) {
    const h = S.hand;
    if (h.street === 'preflop') return Math.max(L.minTo, Math.round(L.currentBet * 3));
    return typeof Engine !== 'undefined' && Engine.sizeTo ? Engine.sizeTo(h, 0.66) : L.minTo;
  }

  function askAction(legal, auto) {
    return new Promise((resolve) => {
      act = { legal, resolve };
      if (legal.canRaise) setAmount(defaultRaise(legal));
      renderDock();
      if (auto) setTimeout(() => {
        if (!act || act.resolve !== resolve) return;
        if (auto.type === 'raise') setAmount(auto.to);
        doAct(auto.type === 'check' ? 'call' : auto.type);
      }, 0);
    });
  }

  function doAct(type) {
    if (!act) return;
    const L = act.legal;
    let a;
    if (type === 'fold') a = { type: 'fold' };
    else if (type === 'call') a = { type: L.canCheck ? 'check' : 'call' };
    else if (type === 'raise' && L.canRaise) a = { type: 'raise', to: amount() };
    else return;
    const r = act.resolve;
    act = null;
    renderDock();
    r(a);
  }

  function quick(f) {
    const L = act && act.legal;
    if (!L || !L.canRaise) return;
    setAmount(f === 'all' ? L.maxTo : Engine.sizeTo(S.hand, +f));
  }

  function waitNext(auto, label = 'Следующая раздача') {
    return new Promise((resolve) => {
      nextRes = resolve;
      put($('.coach-foot'), `<button class="btn btn-primary" data-cmd="next">${esc(label)}</button>`);
      put($('.d-next .btn', dock), esc(label));
      renderDock();
      if (auto) setTimeout(() => { if (nextRes === resolve) $('.d-next .btn', dock).click(); }, 0);
    });
  }
  function resolveNext() {
    if (!nextRes) return;
    const r = nextRes;
    nextRes = null;
    put($('.coach-foot'), '');
    renderDock();
    r();
  }

  // ---------- events ----------
  function onClick(e) {
    const t = e.target;
    const tipEl = t.closest('[data-tip]');
    if (tipEl) { if (tipFor === tipEl) hideTip(); else showTip(tipEl); e.stopPropagation(); return; }
    hideTip();
    const a = t.closest('[data-act]');
    if (a) return doAct(a.dataset.act);
    const qk = t.closest('[data-q]');
    if (qk) return quick(qk.dataset.q);
    const cmd = t.closest('[data-cmd]');
    if (cmd) return command(cmd.dataset.cmd, cmd);
    const tab = t.closest('.side-tabs [data-tab]');
    if (tab) return tabClick(tab.dataset.tab);
    const seat = t.closest('.seat');
    if (seat && seat.dataset.seat !== '0') return popSeat === +seat.dataset.seat ? hidePop() : showPop(+seat.dataset.seat);
    if (!t.closest('.pop')) hidePop();
  }

  function command(cmd, el) {
    if (cmd === 'next') return resolveNext();
    if (cmd === 'sheet') return side.classList.contains('open') ? closeSheet() : openSheet(side.dataset.tab);
    if (cmd === 'logtoggle') return $('.log').classList.toggle('closed');
    if (cmd === 'reveal') { const s = +el.dataset.seat; if (H.reveal) H.reveal(s); return render(); }
    if (H[cmd]) H[cmd]();
  }

  function onInput(e) {
    const t = e.target;
    if (t.classList.contains('amt-r')) setAmount(+t.value);
    else if (t.classList.contains('amt-n') && e.type === 'change') setAmount(amount());
    else if (t.classList.contains('amt-n')) {
      const L = act && act.legal, v = Math.round(+t.value);
      if (L && isFinite(v)) { $('.amt-r', dock).value = v; put($('.act-raise span', dock), raiseLabel(L, U.clamp(v, L.minTo, L.maxTo))); }
    }
  }

  function onKey(e) {
    if (!root || !root.isConnected || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.modal-back')) return;
    if (e.key === 'Escape') { hidePop(); hideTip(); return; }
    const tag = e.target && e.target.tagName;
    const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (e.key === 'Enter') {
      if (e.target.classList && e.target.classList.contains('amt-n')) { e.preventDefault(); setAmount(amount()); doAct('raise'); return; }
      if (inField || (tag === 'BUTTON' && !e.target.disabled)) return; // a focused button handles Enter itself
      if (nextRes) { e.preventDefault(); resolveNext(); }
      return;
    }
    if (inField || !act) return;
    const map = { KeyF: 'fold', KeyC: 'call', KeyR: 'raise' };
    if (map[e.code]) { e.preventDefault(); doAct(map[e.code]); }
  }

  // ---------- coach sheet (mobile) / column (desktop) ----------
  function openSheet(tab) {
    side.dataset.tab = tab || 'coach';
    side.classList.add('open');
    if (side.dataset.tab === 'coach') $('.tab[data-tab="coach"]').classList.remove('new');
    put($('.tab-x'), '▴');
  }
  function closeSheet() { side.classList.remove('open'); }
  function tabClick(tab) {
    if (side.classList.contains('open') && side.dataset.tab === tab) closeSheet();
    else openSheet(tab);
  }
  function flagNew(peek) {
    const open = wide() || (side.classList.contains('open') && side.dataset.tab === 'coach');
    if (!open) $('.tab[data-tab="coach"]').classList.add('new');
    if (peek) put($('.peek'), peek);
  }

  function coachClear() {
    if (!wide()) closeSheet();
    feed.innerHTML = '';
    put($('.coach-foot'), '');
    put($('.peek'), '');
    $('.tab[data-tab="coach"]').classList.remove('new');
  }
  function coachAdd(html, cls = '', peek = '') {
    const el = View.el(`<div class="c-item c-new ${cls}">${html}</div>`);
    feed.appendChild(el);
    requestAnimationFrame(() => { if (el.isConnected) feed.scrollTop = Math.max(0, el.offsetTop - feed.offsetTop - 8); });
    flagNew(peek);
    return el;
  }
  const coachFb = (fb) => coachAdd(View.feedbackHTML(fb), 'c-fb', `<span class="v-${fb.verdict || 'info'}">${View.suitText(fb.title || '')}</span>`);
  function review(items) {
    coachAdd('<div class="c-sep">Разбор раздачи</div>' + items.map(View.feedbackHTML).join(''), 'c-review', 'Разбор раздачи готов');
  }

  // q = { id, type: 'number'|'choice', prompt, unit, options, info, hint }; ctx = { n, of, hole, board, sub }
  function askQuestion(q, ctx, auto) {
    return new Promise((resolve) => {
      const opts = (q.options || []).map((o) => (o && typeof o === 'object' ? o : { v: o, label: String(o) }));
      const info = q.info ? [['Банк со ставкой', q.info.pot], ['Ставка соперника', q.info.bet], ['Тебе доплатить', q.info.toCall]]
        .filter(([, v]) => v !== undefined && v !== null).map(([k, v]) => `<span>${k}: <b>${fmt(v)}</b></span>`).join('') : '';
      const hand = ctx && ctx.hole ? `<div class="c-q-hand"><span>Твои карты ${View.cardsHTML(ctx.hole)}</span>${ctx.board && ctx.board.length ? `<span>Борд ${View.cardsHTML(ctx.board)}</span>` : ''}</div>` : '';
      const body = q.type === 'choice'
        ? `<div class="opts">${opts.map((o, k) => `<button class="btn btn-sm" type="button" data-o="${k}">${View.suitText(o.label)}</button>`).join('')}</div>`
        : `<form autocomplete="off"><input type="text" inputmode="decimal" aria-label="${esc(q.prompt)}"><span class="unit">${esc(q.unit || '')}</span><button class="btn btn-primary btn-sm">Ответить</button></form>`;
      const num = ctx && ctx.of > 1 ? `<div class="c-q-n">Вопрос ${ctx.n} из ${ctx.of}</div>` : ctx && ctx.sub ? `<div class="c-q-n">${esc(ctx.sub)}</div>` : '';
      const el = coachAdd(`${num}<div class="c-q-p">${View.suitText(q.prompt)}</div>${hand}${info ? `<div class="c-q-info">${info}</div>` : ''}${body}` +
        (S.mode === 'learn' && q.hint ? `<button class="btn btn-ghost btn-sm qhint" type="button" data-cmd="hint">${IC.bulb}Подсказка</button>` : ''), 'c-q', View.suitText(q.prompt));
      openSheet('coach');
      const input = $('input', el);
      const done = (value, label) => {
        el.className = 'c-item c-ans';
        el.innerHTML = `${View.suitText(q.prompt)} — <b>${View.suitText(label)}</b>`;
        resolve(value);
      };
      const form = $('form', el);
      if (form) form.addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = input.value.trim().replace(',', '.').replace('%', '');
        const v = parseFloat(raw);
        if (!raw || !isFinite(v)) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); input.focus(); return; }
        const shown = input.value.trim().replace(/\s*%$/, '');
        done(v, shown + (q.unit === '%' ? '%' : q.unit ? ' ' + q.unit : ''));
      });
      $$('[data-o]', el).forEach((b) => b.addEventListener('click', () => { const o = opts[+b.dataset.o]; done(o.v, o.label); }));
      if (input && !mq('(pointer: coarse)')) setTimeout(() => input.focus({ preventScroll: true }), 30);
      if (auto !== undefined && auto !== null) setTimeout(() => {
        if (!el.isConnected || !el.classList.contains('c-q')) return;
        if (form) { input.value = String(auto); form.requestSubmit(); }
        else { const k = opts.findIndex((o) => String(o.v) === String(auto)); ($(`[data-o="${Math.max(0, k)}"]`, el) || {}).click(); }
      }, 0);
    });
  }

  // ---------- log ----------
  function logReset() { logBody.innerHTML = ''; }
  function logStreet(street, cards) {
    logBody.insertAdjacentHTML('beforeend', `<div class="lg-st">${STREET_RU[street] || street}${cards && cards.length ? ' ' + View.suitText('[' + Cards.strList(cards) + ']') : ''}</div>`);
    logBody.scrollTop = logBody.scrollHeight;
  }
  function logLine(text, cls = '') {
    logBody.insertAdjacentHTML('beforeend', `<div class="lg-ln ${cls}">${View.suitText(text)}</div>`);
    logBody.scrollTop = logBody.scrollHeight;
  }

  // ---------- reactions, look overlay ----------
  function bubble(seat, r, ms) {
    const el = seatEls[seat];
    if (!el || !r) return;
    const b = $('.bubble', el);
    clearTimeout(el._bt);
    if (el._anim) el.classList.remove(el._anim);
    b.textContent = r.bubble || r.text || '';
    tog(b, 'acting', r.acting);
    b.classList.add('show');
    if (r.anim) { el._anim = 'a-' + r.anim; void el.offsetWidth; el.classList.add(el._anim); }
    el._bt = setTimeout(() => { b.classList.remove('show'); if (el._anim) el.classList.remove(el._anim); el._anim = null; }, Math.max(300, ms));
  }

  function askLook(street, ms, auto) {
    return new Promise((resolve) => {
      if (!wide()) closeSheet(); // the sheet would cover the overlay on small screens
      const el = $('.look'), bar = $('.look-bar i', el);
      put($('.look-t', el), `${STREET_RU[street] || ''}: куда смотришь?`);
      el.classList.remove('hidden');
      let left = ms, done = false, last = U.now();
      const finish = (v) => {
        if (done) return;
        done = true; clearInterval(timer); el.classList.add('hidden'); el.onclick = null;
        resolve(v);
      };
      el.onclick = (e) => { const b = e.target.closest('[data-look]'); if (b) finish(b.dataset.look); };
      const timer = setInterval(() => {
        const t = U.now();
        if (!S.paused) left -= t - last;
        last = t;
        bar.style.transform = `scaleX(${U.clamp(left / ms, 0, 1)})`;
        if (left <= 0 || !el.isConnected) finish('board');
      }, 40);
      bar.style.transform = 'scaleX(1)';
      if (!mq('(pointer: coarse)')) $('[data-look="players"]', el).focus({ preventScroll: true });
      if (auto) setTimeout(() => { if (!done) $(`[data-look="${auto}"]`, el).click(); }, 0);
    });
  }

  // ---------- popover (bot info) and tooltip ----------
  function showPop(seat) {
    const p = S.table.players[seat], el = seatEls[seat], pop = $('.pop');
    if (!p || !el) return hidePop();
    popSeat = seat;
    const hud = p.hud || { hands: 0, vpip: 0, pfr: 0 };
    const pc = (x) => (hud.hands ? Math.round((x / hud.hands) * 100) + '%' : '—');
    const st = typeof Bots !== 'undefined' && Bots.STYLES ? Bots.STYLES[p.style] : null;
    const base = p.style === 'actor' && p.baseStyle && Bots.STYLES[p.baseStyle] ? ` Играет как ${Bots.STYLES[p.baseStyle].name.toLowerCase()}, но теллы обманные.` : '';
    let styleHTML;
    if (p.revealed && st) styleHTML = `<p>Стиль: <b class="sty ${esc(p.style)}">${esc(st.name)}</b> — ${esc(st.type || '')}.${esc(base)}</p>${st.desc ? `<p>${esc(st.desc)}</p>` : ''}`;
    else styleHTML = `<p>Стиль пока неизвестен — он откроется после 20 раздач${S.mode === 'learn' ? ' или по кнопке ниже' : ''}. Присматривайся к цифрам.</p>`;
    pop.innerHTML = `<div class="pop-h"><div class="av" style="--avc:${esc(p.avatar ? p.avatar.color : '#4b5d55')}">${esc(p.avatar ? p.avatar.initials : '')}</div><b>${esc(p.name)}</b></div>
      <div class="pop-hud"><div><b>${hud.hands}</b><span>${U.plural(hud.hands, 'раздача', 'раздачи', 'раздач')}</span></div><div><b>${pc(hud.vpip)}</b><span>VPIP</span></div><div><b>${pc(hud.pfr)}</b><span>PFR</span></div></div>
      ${styleHTML}
      <p class="faint">VPIP — как часто добровольно вкладывает фишки до флопа. PFR — как часто рейзит до флопа.</p>
      ${S.mode === 'learn' && !p.revealed ? `<button class="btn btn-sm" data-cmd="reveal" data-seat="${seat}">Подсказать стиль</button>` : ''}`;
    pop.classList.remove('hidden');
    const tr = tableEl.getBoundingClientRect(), r = $('.plate', el).getBoundingClientRect();
    const w = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.left + r.width / 2 - tr.left - w / 2;
    x = U.clamp(x, 6, tr.width - w - 6);
    let y = r.bottom - tr.top + 8;
    if (y + ph > tr.height - 6) y = r.top - tr.top - ph - 8;
    pop.style.left = x + 'px';
    pop.style.top = Math.max(6, y) + 'px';
  }
  function hidePop() { popSeat = null; if (root) $('.pop').classList.add('hidden'); }

  function showTip(el) {
    const tip = $('.tip');
    if (!tip || !el.dataset.tip) return;
    tipFor = el;
    const [title, ...rest] = el.dataset.tip.split('\n');
    tip.innerHTML = `<b>${esc(title)}</b>${rest.length ? '<br>' + esc(rest.join(' ')) : ''}`;
    tip.classList.remove('hidden');
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = U.clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8) + 'px';
    tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
  }
  function hideTip() { tipFor = null; if (root) { const t = $('.tip'); if (t) t.classList.add('hidden'); } }

  // ---------- animations ----------
  const reduced = () => mq('(prefers-reduced-motion: reduce)');
  function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

  function fly(fromEl, toEl, html, ms, delay = 0) {
    if (!fromEl || !toEl || reduced() || anim() < 0.1 || !tableEl.isConnected) return;
    const base = tableEl.getBoundingClientRect(), a = centerOf(fromEl), b = centerOf(toEl);
    const el = View.el(`<div class="fly">${html}</div>`);
    el.style.left = a.x - base.left + 'px';
    el.style.top = a.y - base.top + 'px';
    tableEl.appendChild(el);
    const k = el.animate([{ transform: 'translate(-50%, -50%)', opacity: 1 }, { transform: `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px))`, opacity: 0.9 }],
      { duration: ms, delay, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'both' });
    k.onfinish = () => el.remove();
    setTimeout(() => el.remove(), ms + delay + 200);
  }

  // bets slide into the pot
  function collect(ms) {
    const pot = $('.pots .pot') || $('.board');
    betEls.forEach((b) => { if (!b.classList.contains('hidden')) fly($('.chip', b), pot, '<i class="chip"></i>', ms); });
    S.collecting = true;
    renderBets();
    S.collecting = false;
  }
  // pot slides to the winners
  function payout(winners, ms) {
    const from = $('.pots .pot') || $('.board');
    winners.forEach((s, k) => { for (let j = 0; j < 3; j++) fly(from, $('.av', seatEls[s]), '<i class="chip gold"></i>', ms, k * 120 + j * 70); });
  }
  // cards fly from the centre to the seats, clockwise from the small blind
  function deal(order, ms) {
    if (reduced() || anim() < 0.1) return;
    const c = centerOf($('.board'));
    order.forEach((seat, k) => {
      $$('.s-cards .pcard', seatEls[seat]).forEach((card, j) => {
        const p = centerOf(card);
        card.animate([{ transform: `translate(${c.x - p.x}px, ${c.y - p.y}px) scale(.5)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
          { duration: ms, delay: (j * order.length + k) * ms * 0.22, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' });
      });
    });
  }

  return {
    mount, render, askAction, waitNext, askQuestion, askLook, coachClear, coachAdd, coachFb, review,
    logReset, logStreet, logLine, bubble, collect, payout, deal, openSheet, closeSheet, setAmount,
    get acting() { return !!act; }, get waitingNext() { return !!nextRes; },
  };
})();
