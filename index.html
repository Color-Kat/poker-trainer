    const said = (s) => (Number.isFinite(x) ? `ты указал ${s}` : 'ты ничего не указал');
    const xs = Number.isFinite(x) ? numRu(x) : '';
    if (qid === 'outs') {
      const hit = sp.acceptedOuts.find((a) => Math.abs(x - a) <= 1);
      const lines = outsLines(sp);
      if (hit === undefined) return fb('outs', M, `❌ Ауты: ${said(xs)}, правильно ${sp.correctOuts}.`, lines);
      const near = x !== hit ? ` (ты указал ${xs}, допуск ±1)` : '';
      return fb('outs', 'correct', hit === sp.correctOuts ? `✅ Ауты: ${sp.correctOuts} — верно${near}.` : `✅ Ауты: ${hit} — засчитано (с оверкартами; без них ${sp.correctOuts})${near}.`, lines);
    }
    if (qid === 'cards') {
      const w = (k) => (k === 2 ? 'две' : 'одна');
      const why = sp.cardsToSee === 2 ? 'Олл-ин на флопе: после колла ставок больше не будет, и ты увидишь и тёрн, и ривер.'
        : sp.street === 'turn' ? 'Сейчас тёрн — впереди только одна карта, ривер.'
        : 'Ставка не олл-ин: на тёрне соперник может поставить снова, поэтому этот колл покупает только одну карту.';
      return x === sp.cardsToSee ? fb('cards', 'correct', `✅ Карты: ${w(x)} — верно.`, [why])
        : fb('cards', M, `❌ Карты: ${said(`«${x === 2 ? 'две' : x === 1 ? 'одну' : x}»`)}, правильно — ${w(sp.cardsToSee)}.`, [why]);
    }
    if (qid === 'equity') {
      const note = cardsNote(sp), hit = sp.acceptedOuts.find((a) => Math.abs(x - rule(a)) <= 3);
      if (hit !== undefined) {
        return fb('equity', 'correct', hit === sp.correctOuts ? `✅ Эквити: ${formula(sp, hit)} ${note}.`
          : `✅ Эквити: ${formula(sp, hit)} ${note} — засчитано (с оверкартами).`, hit === sp.correctOuts ? [] : [`Без оверкарт: ${formula(sp, sp.correctOuts)}.`]);
      }
      const own = num(answers.outs), ownOk = Number.isFinite(own) && sp.acceptedOuts.some((a) => Math.abs(own - a) <= 1);
      if (Number.isFinite(own) && Math.abs(x - rule(own)) <= 1) { // the formula was applied right to the player's own count
        return fb('equity', 'acceptable', ownOk ? `⚠️ Эквити: по твоим ${outsW(own)} формула верна (${formula(sp, own)}), но точно аутов ${sp.correctOuts}.`
          : `⚠️ Эквити: метод верный (${formula(sp, own)}), но ауты посчитаны неверно.`, [`Правильно: ${formula(sp, sp.correctOuts)} ${note}.`]);
      }
      if (Number.isFinite(own) && sp.cardsToSee === 2 && own > 8 && Math.abs(x - own * 4) <= 1) { // ×4 without the 9+ correction
        return fb('equity', M, `❌ Эквити: ${said(xs + '%')} — это ${numRu(own)} × 4 без поправки.`,
          [`При 9+ аутах вычти (ауты − 8): ${formula(sp, own)}. Правильно: ${formula(sp, sp.correctOuts)} ${note}.`]);
      }
      return fb('equity', M, `❌ Эквити: ${said(xs + '%')}, правильно ${sp.ruleEq}%.`,
        [`${formula(sp, sp.correctOuts)} ${note}.`, 'Правило 2 и 4: одна карта — ауты × 2, две карты (олл-ин на флопе) — ауты × 4, а при 9+ аутах вычти (ауты − 8).']);
    }
    if (qid === 'potodds') {
      const n = Math.round(sp.needed);
      if (!approxOk(x, sp.toCall, sp.pot)) return fb('potodds', M, `❌ Шансы банка: ${said(xs + '%')}, правильно ${n}%.`, potLines(sp));
      return fb('potodds', 'correct', Math.abs(x - n) <= 2 ? `✅ Шансы банка: ${n}% — верно.` : `✅ Шансы банка: ${xs}% — засчитано (точно ${n}%).`, potLines(sp));
    }
    if (qid === 'sizing') {
      const a = sizingAnswer(sp);
      return Math.abs(x - a) <= 0.15 * a ? fb('sizing', 'correct', `✅ Ставка 2/3 банка: ${U.fmt(a)} — верно.`, sizingLines(sp))
        : fb('sizing', M, `❌ Ставка 2/3 банка: ${said(xs)}, правильно ${U.fmt(a)}.`, sizingLines(sp));
    }
    if (qid === 'bluff') {
      const b = sp.bluffQ;
      if (!b) return null;
      const n = Math.round(b.be * 100), ok = approxOk(x, b.bet, sp.pot);
      const lines = [`Быстро: ставка ÷ (банк + ставка) = ${quickWay(b.bet, sp.pot + b.bet)}.`,
        `${bluffNumbers(sp, b)} — ${b.fp >= b.be ? 'блеф окупается' : sp.kind === 'draw' && sp.ruleEq ? `как чистый блеф не окупается, выручает дро (~${sp.ruleEq}%)` : 'блеф не окупается'}.`];
      return ok ? fb('bluff', 'correct', `✅ Блеф: нужно ${n}% сбросов — верно.`, lines)
        : fb('bluff', M, `❌ Блеф: ${said(xs + '%')}, нужно ${n}% сбросов.`, lines);
    }
    return null;
  }

  // ---------- action ----------
  const FE_RU = {
    high: ['сбрасывает часто', 'часто сбрасывает на агрессию'], medium: ['сбрасывает иногда', 'иногда сбрасывает на агрессию'],
    low: ['сбрасывает редко', 'редко сбрасывает на агрессию'], none: ['почти никогда не сбрасывает', 'почти никогда не сбрасывает'],
  };
  const fem = (name) => /[ая]$/.test(String(name).split(' ')[0]);
  const him = (sp) => (sp.multiway && !sp.facing && fem(sp.villain.name) ? 'неё' : 'него'); // who() names the player only there
  const who = (sp) => {
    const v = sp.villain, fe = FE_RU[sp.villainFE];
    if (sp.multiway && !sp.facing) return `Самый цепкий из соперников, ${v.name}${v.revealed ? ` («${v.styleName}»), ${fe[0]}` : `, ${fe[1]}`}`; // no bettor to point at
    return v.revealed ? `Соперник «${v.styleName}» (${fe[0]})` : `Этот соперник ${fe[1]}`;
  };
  const isDrawSpot = (sp) => sp.kind === 'draw' || (sp.kind === 'nodraw' && sp.street !== 'river');
  const nounOf = (sp, a) => (a === 'raise' ? (sp.kind === 'draw' ? (sp.facing ? 'рейз-полублеф' : 'ставка-полублеф')
    : sp.kind === 'nodraw' && sp.bluff ? (sp.facing ? 'блеф-рейз' : 'блеф-ставка') : sp.facing ? 'рейз' : 'ставка')
    : { fold: 'сброс', check: 'чек', call: 'колл' }[a]);
  const pastOf = (sp, a) => (a === 'raise' ? (sp.facing ? 'сделал рейз' : 'поставил') : { fold: 'сбросил', check: 'чекнул', call: 'заколлировал' }[a]);
  // '33%' or '33,3%' when rounding would hide which side of the comparison we are on
  const showNeed = (sp) => (Math.round(sp.needed) === sp.ruleEq && sp.ruleEq !== sp.needed ? U.pctNum(sp.needed, 1) : pctR(sp.needed));

  const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
  const rangeOf = (sp) => (sp.multiway ? 'соперники так играют' : 'этот соперник так ставит');
  const FRAC_RU = (f) => (f < 0.58 ? '1/2' : f < 0.83 ? '2/3' : 'весь');
  function bluffLine(sp, b) {
    const what = sp.facing ? `Блеф-рейз до ${U.fmt(b.to)}` : `Блеф ${U.fmt(b.bet)}`;
    return `${what} ${b.margin >= 0.1 ? 'выгоден' : b.margin >= 0 ? 'на грани' : 'не окупится'}: ${foldSubj(sp)} ~${pctR(b.fp * 100)}, нужно ${pctR(b.be * 100)}.`;
  }
  const BLUFF_RULE = 'Блеф окупается, когда соперник сбрасывает чаще, чем ставка ÷ (банк + ставка).';
  // Nobody bet: value bet or check with a made hand, bluff or check with air.
  function freeLines(sp, t, b) {
    const L = [], m = sp.made, v = sp.verdicts;
    if (t === 'fold') L.push('Никогда не сбрасывай, когда можно бесплатно чекнуть.');
    if (sp.kind === 'made') {
      const what = cap(m.label);
      if (v.raise === B) L.push(`${what}${m.strength === 'strong' ? ' — сильная рука' : ' хедз-ап'}: ставь за ценностью — заплатят руки хуже.`);
      else L.push(`${what}: ${sp.multiway ? 'соперников несколько' : 'на ривере'} на ставку заплатят в основном руки сильнее — чек.`);
      if (v.check === OK) L.push('Чек тоже допустим: соперник может поставить сам.');
      else if (v.raise === OK) L.push('Ставка тоже допустима, но заплатят чаще руки лучше.');
      L.push(`Твоя рука: ${m.ru}.`);
      return L;
    }
    if (b) L.push(bluffLine(sp, b));
    if (v.raise === B) L.push(`Лучший размер блефа — ${U.fmt(sp.bluff.bet)} (${FRAC_RU(sp.bluff.frac)} банка). Чек тоже допустим.`);
    else L.push(sp.street === 'river' ? 'Чек: со слабой рукой без ставки ты больше ничего не теряешь.' : 'Чек бесплатный: следующую карту увидишь даром.');
    L.push(`Твоя рука: ${m.ru}.`, BLUFF_RULE);
    return L;
  }
  function actionLines(sp, t, b) {
    const L = [], o = sp.correctOuts, E = sp.ruleEq, N = sp.needed, v = sp.verdicts;
    if (!sp.facing && sp.kind !== 'draw') return freeLines(sp, t, b);
    if (sp.facing && b && t === 'raise') L.push(bluffLine(sp, b));
    if (isDrawSpot(sp)) {
      if (!sp.facing) {
        L.push('Чек бесплатный: следующую карту ты увидишь, ничего не доплачивая.');
        if (v.raise === B) L.push(`${who(sp)}, а у тебя ${outsW(o)} — ставка-полублеф тоже хороша: можешь забрать банк сразу, а если заплатят, у тебя остаётся дро.`);
        else if (v.raise === OK) {
          L.push(o < 8 ? `У тебя всего ${outsW(o)} — ставка-полублеф допустима, но проще взять бесплатную карту.`
            : sp.foldEq === 'none' ? `${who(sp)}, так что блефовать бессмысленно. Но у тебя ${outsW(o)}: ставка допустима — такое дро часто выигрывает и само. Бесплатная карта тоже хороша.`
            : `${who(sp)} — ставка-полублеф допустима, но бесплатная карта надёжнее.`);
        } else if (v.raise === M) {
          L.push(`${who(sp)} — полублеф против ${him(sp)} не сработает. У тебя ${outsW(o)} — около ${E}% попасть на следующей карте: ` +
            (o < 8 ? 'слишком мало, чтобы ставить без шанса, что соперник сбросит.' : 'без сбросов соперника ставка только раздувает банк, а промахиваешься ты чаще.') + ' Бери бесплатную карту.');
        }
        if (t === 'fold') L.push('Никогда не сбрасывай, когда можно бесплатно чекнуть.');
        return L;
      }
      if (showdownCall(sp)) {
        L.push(`По аутам ${E}% < ${showNeed(sp)} — как дро колл невыгоден.`);
        L.push(`Но с готовой рукой (${sp.made.label}) эквити ~${pctR(sp.estEq * 100)} — колл окупается.`);
        L.push(`Но у тебя уже есть готовая рука (${sp.made.ru}): против рук, с которыми ${rangeOf(sp)}, у тебя примерно ${pctR(sp.estEq * 100)} эквити — колл окупается.`);
      } else L.push(`${E}% ${E >= N ? '≥' : '<'} ${showNeed(sp)} — колл ${E >= N ? 'окупается в долгую' : 'в долгую невыгоден'}.`);
      if (overCall(sp)) {
        const all = o + sp.outs.over;
        L.push(`С оверкартами (${outsW(all)}) — ${ruleOf(sp)(all)}% ≥ ${showNeed(sp)}: колл тоже допустим, но пара из оверкарты может и не выиграть, а без них у тебя только ${E}%.`);
      }
      if (!o && sp.kind === 'nodraw') L.push('У тебя нет ни готовой руки, ни дро — платить не за что.');
      if (o >= 12 && v.raise === B) {
        const eqTo = sp.street === 'flop' ? `около ${o * 4 - (o - 8)}% до ривера` : `около ${o * 2}% на ривере`;
        L.push(`${outsW(o)} — очень сильное дро (${eqTo}): рейз-полублеф выигрывает сразу, если соперник сбросит, а если заплатит — у тебя всё равно много шансов.`);
      } else if (o >= 8 && sp.canRaise) {
        const fe = sp.foldEq;
        if (fe === 'high' || fe === 'medium') L.push(`${who(sp)}, поэтому рейз как полублеф ${E < N ? 'тоже был бы разумным вариантом' : 'тоже допустим'}.`);
        else if (fe === 'low') L.push(`${who(sp)} — рейз-полублеф ${E < N ? 'допустим, но сбросить надёжнее' : 'здесь не лучший вариант'}.`);
        else L.push(`${who(sp)} — полублеф против ${him(sp)} не сработает.`);
        if (sp.multiway) L.push('Соперников несколько — шанс, что сбросят все, ниже.');
      } else if (t === 'raise' && o < 8 && !b) {
        L.push(`Рейз как полублеф имеет смысл только с сильным дро (8+ аутов) против соперника, который умеет сбрасывать${o ? `, а у тебя ${outsW(o)}` : ''}.`);
      }
      if (b && t !== 'raise' && v.raise !== M) L.push(bluffLine(sp, b));
      return L;
    }
    const m = sp.made, tag = !/общая/.test(m.ru) && ['сет', 'трипс', 'оверпара', 'топ-пара', 'слабая пара', 'играет борд'].includes(m.label) ? ` (${m.label})` : '';
    if (sp.bigLate && m.strength !== 'strong') L.push(`Крупный рейз на поздней улице от такого соперника — почти всегда натс: сброс.`);
    else if (sp.estEq != null && m.strength === 'none') L.push(`Без своей пары колл — ловля блефа (эквити ~${pctR(sp.estEq * 100)}, нужно ${pctR(N)}): сброс надёжнее.`);
    else if (sp.estEq != null) {
      const e = sp.estEq * 100, cl = isClose(sp), q = (x) => (cl ? U.pctNum(x, 1) : pctR(x));
      L.push(`Эквити ~${q(e)} против нужных ${q(N)} — ${cl ? 'на грани' : e >= N ? 'колл окупается' : 'колл невыгоден'}.`);
    }
    L.push(`Твоя рука: ${m.ru}${tag}.`);
    if (sp.bigLate && m.strength !== 'strong') {
      const end = m.strength === 'none' ? 'Твои карты не дали даже пары — сброс.' : 'С одной парой — сброс.';
      L.push(sp.villain.revealed ? `Соперник «${sp.villain.styleName}»: крупный рейз на поздней улице от такого соперника — почти всегда натс. ${end}`
        : `Этот соперник редко ставит крупно: крупный рейз на поздней улице от такого соперника — почти всегда натс. ${end}`);
      return L;
    }
    const eq = sp.estEq * 100, ok = eq >= N, close = isClose(sp);
    const p = (x) => (close ? U.pctNum(x, 1) : pctR(x));
    if (m.strength === 'none') {
      L.push(`Против рук, с которыми ${rangeOf(sp)}, у тебя примерно ${pctR(eq)} эквити — нужно ${pctR(N)}.`);
      L.push(v.call === OK ? `Без своей пары колл — это ловля блефа: ${sp.villain.revealed ? `соперник «${sp.villain.styleName}» часто блефует` : 'ставка небольшая'}, поэтому колл допустим, но сброс надёжнее.`
        : 'Без своей пары колл — это ловля блефа: против крупной ставки сброс надёжнее, ошибкой он не будет никогда.');
    } else {
      L.push(`Против рук, с которыми ${rangeOf(sp)}, у тебя примерно ${p(eq)} эквити — нужно ${p(N)}. ` +
        (close ? `Это почти на грани: ${ok ? 'колл чуть выгоднее, сброс тоже допустим' : 'сброс чуть выгоднее, колл тоже допустим'}.` : ok ? 'Колл окупается.' : 'Колл невыгоден — сбрасывай.'));
      if (ok && !close && v.fold === OK) L.push('Сброс тоже допустим: со слабой парой против крупной ставки соперника, о котором ты мало знаешь, легко оказаться позади.');
    }
    if (sp.drawToo) L.push(`По правилу 2 и 4 одни улучшения (${outsW(o)}) дают ${E}%, но ты и так часто впереди: оценка вместе с готовой рукой — ${pctR(eq)}. Решение принимаем по ней.`);
    if (v.raise === B || v.raise === OK) L.push('Рука сильная — повысить за ценностью тоже хорошо.');
    else if (t === 'raise' && ok) {
      const bar = raiseBar(sp), fair = 100 / (sp.nOpp + 1);
      L.push(`Рейз за ценностью нужен, когда ты заметно впереди: ${sp.multiway ? `против ${U.nplural(sp.nOpp, 'соперника', 'соперников', 'соперников')} честная доля — ${pctR(fair)}, ` : ''}` +
        `рейз окупается примерно от ${pctR(bar.ok * 100)}, а у тебя ${pctR(eq)}. На рейз заплатят в основном руки сильнее твоей, а слабые сбросят — колл выгоднее.`);
    } else if (t === 'raise' && !b) L.push('Рейз с рукой, которой не хватает даже на колл, только теряет фишки.');
    if (b && t !== 'raise' && v.raise !== M) L.push(bluffLine(sp, b));
    return L;
  }

  function evaluateAction(spot, action) {
    if (!spot) return null;
    const sp = spot;
    let t = typeof action === 'string' ? action : action && action.type;
    if (t === 'bet' || t === 'allin') t = 'raise';
    if (t === 'call' && !sp.facing) t = 'check';
    if (t === 'check' && sp.facing) t = 'call';
    let vd = sp.verdicts[t] || M, b = sp.bluff;
    // a bluff is judged at the size actually chosen
    const raw = action && typeof action === 'object' ? (action.type === 'allin' ? Infinity : +action.to) : NaN;
    if (t === 'raise' && b && vd !== M && raw > 0) {
      const to = Math.min(Math.max(raw, sp.facing ? sp.minTo : 0), sp.myBet + sp.stack);
      if (to !== b.to) { b = bluffAt(sp, to); vd = bluffVd(b.margin); }
    } else if (t === 'raise' && b && raw > 0) {
      const to = Math.min(Math.max(raw, sp.facing ? sp.minTo : 0), sp.myBet + sp.stack);
      if (to !== b.to) b = bluffAt(sp, to);
    }
    const verdict = vd === B ? 'correct' : vd === OK ? 'acceptable' : 'mistake';
    const alts = Object.keys(sp.verdicts).filter((a) => a !== sp.best && sp.verdicts[a] === B);
    const name = (a) => nounOf(sp, a) + (a === 'raise' && sp.bluff && sp.kind === 'nodraw' ? ` ${sp.facing ? 'до ' : ''}${U.fmt(sp.facing ? sp.bluff.to : sp.bluff.bet)}` : '');
    const right = name(sp.best) + (alts.length ? ` (или ${alts.map(name).join(', ')})` : '');
    const title = verdict === 'correct' ? `✅ Действие: ${nounOf(sp, t)} — верно.`
      : verdict === 'acceptable' ? `⚠️ Действие: ${nounOf(sp, t)} — допустимо, но лучше ${t === sp.best ? name(t) : right}.`
      : `❌ Действие: ты ${pastOf(sp, t)}, правильно — ${right}.`;
    return fb('action', verdict, title, actionLines(sp, t, sp.kind === 'nodraw' ? b : null));
  }

  // ---------- after the hand: real equity vs the actual cards ----------
  function realEquity(spot, hand) {
    if (!spot || !hand || !(spot.questions || []).includes('outs')) return null;
    if (!spot.opps.every((o) => hand.hole[o.seat])) return null;
    const opp = spot.opps.map((o) => hand.hole[o.seat]), hands = [spot.hole, ...opp];
    const real = Equity.calc(hands, spot.board, { toCome: spot.cardsToSee }).eq[0] * 100, rule = spot.ruleEq;
    const vs = joinRu(spot.opps.map((o, i) => `${cardsTight(opp[i])} (${o.name})`)), many = opp.length > 1;
    const d = real - rule;
    let why, detail = null;
    const sc = (h, c = []) => HandEval.score([...h, ...spot.board, ...c]);
    if (Math.abs(d) < 3) why = `Правило 2 и 4 работает: разница всего ${U.dec(Math.abs(d), 1)} п.п.`;
    else if (d > 0 && opp.every((h) => sc(spot.hole) > sc(h))) why = 'Реально больше: ты выигрываешь и без попадания — сейчас твоя рука сильнее.';
    else if (d > 0) { // behind now: uncounted cards (dirty outs, overcards …) win as well
      const counted = new Set(spot.multiway ? spot.outs.cleanList : spot.outs.list), seen = new Set([...spot.hole, ...spot.board, ...opp.flat()]);
      const extra = spot.cardsToSee === 1 ? Cards.deck().filter((c) => !seen.has(c) && !counted.has(c) && opp.every((h) => sc(spot.hole, [c]) > sc(h, [c]))) : [];
      why = 'Реально больше: против этих рук выигрывают и карты, которые не вошли в подсчёт.';
      if (extra.length) detail = `Эти карты: ${extra.map(Cards.str).join(', ')}.`;
    } else {
      const parts = [], rival = many ? 'соперников' : 'соперника', strs = (cs) => cs.map(Cards.str).join(', ');
      if (spot.cardsToSee === 1) {
        const held = new Set(opp.flat()), mine = spot.multiway ? spot.outs.cleanList : spot.outs.list;
        const nowBest = Math.max(...opp.map((h) => sc(h))), bestWith = (c) => Math.max(...opp.map((h) => sc(h, [c])));
        const blocked = [], ahead = [], split = [], lost = [];
        for (const c of mine) {
          if (held.has(c)) { blocked.push(c); continue; }
          const me = sc(spot.hole, [c]), them = bestWith(c);
          if (me > them) continue;
          (me === them ? split : nowBest >= me ? ahead : lost).push(c);
        }
        if (blocked.length) parts.push(`${strs(blocked)} — у ${rival} на руках`);
        if (ahead.length || split.length) {
          const made = lowerFirst(HandEval.describe(nowBest));
          parts.push(`у ${many ? 'одного из соперников' : 'соперника'} уже ${made}` +
            (ahead.length ? ` — с ${strs(ahead)} ты всё равно проигрываешь` : '') + (split.length ? `${ahead.length ? ', а' : ' —'} с ${strs(split)} только делишь банк` : ''));
        }
        if (lost.length) parts.push(`${strs(lost)} не ${lost.length > 1 ? 'спасают' : 'спасает'}: с ${lost.length > 1 ? 'ними' : 'ней'} у ${many ? 'кого-то из соперников' : 'соперника'} рука становится сильнее твоей`);
      }
      if (parts.length) detail = cap(`${parts.join('; ')}.`);
      why = parts.length ? 'Реально меньше: часть аутов не работает.'
        : many ? 'Реально меньше: кто-то из соперников уже впереди, и часть твоих аутов не помогает против их рук.'
        : 'Реально меньше: соперник уже впереди, и часть твоих аутов не помогает против его руки.';
    }
    return { kind: 'realEquity', verdict: 'info', ok: true, title: `ℹ️ ${cap(STREET_RU[spot.street] || 'флоп')}: по правилу ${rule}%. Реально против ${vs}: ${U.pctNum(real, 1)}.`,
      ...pack([why, detail]) };
  }

  // ---------- reading the opponent (SPEC 9.3) ----------
  const READ_OPTIONS = [{ v: 'strong', label: 'Очень сильная рука' }, { v: 'medium', label: 'Средняя рука' }, { v: 'draw', label: 'Дро' }, { v: 'bluff', label: 'Блеф' }];
  const TRUTH_RU = { strong: 'очень сильная рука', medium: 'средняя рука', draw: 'дро', bluff: 'блеф' };
  const DRAW_RU = { flush: 'флеш-дро', oesd: 'открытое стрит-дро', double: 'двойной гатшот', gutshot: 'гатшот', straight: 'стрит-дро' };

  function readQuestion(hand, seat, table) {
    if (!hand || hand.street === 'preflop' || hand.phase !== 'betting') return null;
    if (hand.currentBet - (hand.bets[seat] || 0) <= 0) return null;
    const e = lastWager(hand, seat), p = e && table.players[e.seat];
    if (!p || p.isHuman || !hand.hole[e.seat]) return null;
    const sizeFrac = e.potBefore > 0 ? e.add / e.potBefore : 1;
    if (sizeFrac < 0.66) return null;
    const { truth, alt } = readTruth(hand.hole[e.seat], hand.board);
    return { bettor: e.seat, truth, alt, sizeFrac, street: hand.street,
      board: hand.board.slice(), allIn: !!e.allIn, entry: e.i, options: READ_OPTIONS };
  }
  // The read is graded in the coach's own vocabulary (madeInfo / computeOuts), not by the bots' betting classes:
  // set, two pair with hole cards, straight+ = strong; top pair / overpair = medium; any draw = draw; else bluff.
  // `alt` is the neighbouring answer that is accepted as ⚠️.
  function readTruth(hole, board) {
    const m = madeInfo(hole, board);
    const draw = board.length < 5 && computeOuts(hole, board).draws.some((d) => DRAW_RU[d.type]);
    if (m.strength === 'strong' || m.strength === 'medium') return { truth: m.strength, alt: m.strength === 'medium' && draw ? 'draw' : null };
    if (draw) return { truth: 'draw', alt: null };
    return { truth: 'bluff', alt: m.strength === 'weak' ? 'medium' : null };
  }
  const ALT_RU = {
    bluff: 'Слабая пара против крупной ставки — по сути блеф. «Средняя» — близко.',
    draw: 'Здесь и пара, и дро — главное пара, но «дро» — близко.',
  };

  function holdingRu(hole, board) {
    const m = madeInfo(hole, board), r = R(hole[0]);
    let s = m.label === 'сет' ? 'сет ' + GP(r) : m.strength === 'none' && m.cat > CAT.HIGH ? `ничего, ${lowerFirst(m.name)} только на борде` : m.ru;
    if (board.length < 5) {
      const d = computeOuts(hole, board).draws.find((x) => DRAW_RU[x.type]);
      if (d) s += ' + ' + DRAW_RU[d.type];
    }
    return s;
  }

  function preflopRu(hand, seat) {
    let raises = 0, strong = false;
    const acts = [];
    for (const e of hand.log) {
      if (e.street !== 'preflop') break;
      if (e.seat === seat && e.type !== 'sb' && e.type !== 'bb' && e.type !== 'fold') {
        if (e.type === 'raise') strong = true;
        acts.push(e.type === 'raise' ? (raises === 0 ? 'открытие рейзом' : raises === 1 ? '3-бет' : 'ререйз')
          : e.type === 'call' ? (raises === 0 ? (hand.pos[seat] === 'SB' ? 'доплата с малого блайнда' : 'лимп') : 'колл рейза')
          : 'чек на большом блайнде');
      }
      if (e.type === 'raise' || e.type === 'bet') raises++;
    }
    if (!acts.length) return null;
    const why = strong ? 'это говорит о сильном диапазоне' : acts.length === 1 && acts[0] === 'чек на большом блайнде' ? 'рука может быть любой: флоп был бесплатным'
      : 'обычно так играют средние и спекулятивные руки';
    return `Префлоп: ${acts.join(', затем ')} — ${why}.`;
  }

  function playerTypeRu(p) {
    if (p.revealed) {
      // «Такой игрок …» keeps the description's «его ставка» grammatical for female bots too
      const B = bots(), st = B && B.STYLES && B.STYLES[p.style];
      return `${p.name} — «${styleName(p)}»${st && st.type ? ` (${st.type})` : ''}.${st && st.desc ? ' Такой игрок ' + lowerFirst(st.desc.split('. ')[0].replace(/\.$/, '')) + '.' : ''}`;
    }
    const h = p.hud || { hands: 0, vpip: 0, pfr: 0 };
    if (h.hands < 12) return `Статистики у ${gen(p.name)} пока мало (${U.nplural(h.hands, 'раздача', 'раздачи', 'раздач')}) — опирайся на остальные признаки.`;
    // absolute PFR bars from the SPEC style table (rock 8, reg 15–18, station 5, maniac 30): a ratio cannot tell a rock from a reg
    const vpip = h.vpip / h.hands, pfr = h.pfr / h.hands, loose = vpip >= 0.3, aggr = pfr >= (loose ? 0.18 : 0.12);
    const desc = loose ? (aggr ? 'лузовый агрессивный игрок: часто ставит крупно с чем угодно' : 'лузовый пассивный игрок: играет много рук, но крупно ставит в основном с силой')
      : aggr ? 'тайтовый агрессивный игрок: ставит и с сильными руками, и с дро, иногда блефует' : 'тайтовый пассивный игрок: крупно ставит почти только с сильной рукой';
    return `${p.name} играет ${pctR(vpip * 100)} раздач и повышает префлоп в ${pctR(pfr * 100)} раздач — по первым ${h.hands} раздачам похоже, это ${desc}.`;
  }

  function readReview(read, answer, hand, table, extras = {}) {
    if (!read || !hand || !table) return null;
    const p = table.players[read.bettor], hole = hand.hole[read.bettor];
    if (!p || !hole) return null;
    const ok = answer === read.truth, near = !ok && !!read.alt && answer === read.alt, lab = (READ_OPTIONS.find((o) => o.v === answer) || {}).label;
    const lines = ['Признаки:', playerTypeRu(p)];
    const pos = hand.pos[read.bettor];
    if (pos) {
      lines.push(`Позиция: ${pos}${['CO', 'BTN'].includes(pos) ? ' — из поздней позиции чаще ставят широким диапазоном, в том числе блефуют.'
        : ['UTG', 'UTG+1'].includes(pos) ? ' — из ранней позиции обычно играют сильные руки.'
        : ['MP', 'LJ', 'HJ'].includes(pos) ? ' — из средней позиции играют чуть шире, чем из ранней, но всё ещё довольно сильные руки.'
        : ['SB', 'BB'].includes(pos) ? ' — с блайнда в игру входят очень разными руками, позиция здесь мало что подсказывает.' : '.'}`);
    }
    const pre = preflopRu(hand, read.bettor);
    if (pre) lines.push(pre);
    const k = read.sizeFrac < 10 ? Math.round(read.sizeFrac * 10) / 10 : Math.round(read.sizeFrac);
    const size = read.sizeFrac >= 2 ? `в ${U.dec(k, 1)} ${k % 1 ? 'раза' : U.plural(k, 'раз', 'раза', 'раз')} больше банка` : `${pctR(read.sizeFrac * 100)} банка`;
    lines.push(`Размер ставки: ${size}${read.allIn ? ' (олл-ин)' : ''} — крупно: так ставят с очень сильной рукой или с блефом, средние руки обычно ставят меньше.`);
    const ms = extras.thinkMs;
    if (Number.isFinite(ms)) {
      const s = U.dec(ms / 1000, 1);
      lines.push(ms < 1200 ? `Тайминг: быстрая ставка (${s} с) — часто это заранее решённое действие: сильная рука или блеф.`
        : ms > 3000 ? `Тайминг: долгое раздумье (${s} с) — сомнение чаще бывает со средней рукой или дро, но это может быть и спектакль.`
        : `Тайминг: обычная пауза (${s} с) — ничего особенного не подсказывает.`);
    }
    if (Array.isArray(extras.tellsSeen)) {
      const seen = extras.tellsSeen.filter((r) => r && r.seat === read.bettor);
      if (!seen.length) lines.push(`Теллов у ${gen(p.name)} ты не видел.`);
      for (const r of seen) {
        lines.push(`Телл: ${p.name} ${r.text}${r.meaning ? ` — ${r.meaning}` : ''}${r.acting ? ' (на деле это был спектакль: показанное было обратным)'
          : r.random ? ' (на деле эта реакция была случайной — теллы надёжны не на 100%)' : ''}.`);
      }
      if (seen.length && seen.every((r) => r.random)) lines.push(`Реакции ${gen(p.name)} не совпадали с картами — на теллы этого игрока лучше не опираться.`);
    }
    const truth = `На самом деле у ${gen(p.name)}: ${cardsTight(hole)} — ${holdingRu(hole, read.board || hand.board)} (${TRUTH_RU[read.truth]}).`;
    const top = [truth, near ? ALT_RU[read.truth] : null].filter(Boolean), out = (v, title) => ({ ...fb('read', v, title, top), more: [...(pack(top).more || []), ...lines] });
    if (near) return out('acceptable', `⚠️ Чтение соперника: «${lab}» — близко, точнее — ${TRUTH_RU[read.truth]}.`);
    return out(ok ? 'correct' : M, ok ? `✅ Чтение соперника: верно — ${TRUTH_RU[read.truth]}.`
      : lab ? `❌ Чтение соперника: ты выбрал «${lab}», а на самом деле — ${TRUTH_RU[read.truth]}.` : `❌ Чтение соперника: на самом деле — ${TRUTH_RU[read.truth]}.`);
  }

  // ---------- tells: the reaction the player missed while looking at the board ----------
  function lookHint(missed, table, street) {
    const honest = (missed || []).filter((r) => r && !r.acting && !r.random && r.truth !== 'neutral' && table.players[r.seat]);
    const r = honest.find((x) => x.shown === 'strength') || honest[0];
    if (!r) return null;
    const st = STREET_RU[street] || 'флоп';
    const meaning = String(r.meaning || '').replace(/флоп/g, st);
    return fb('tells', M, `❌ Теллы: ты смотрел на борд, когда открывался ${st}.`,
      [`Ты пропустил: ${table.players[r.seat].name} ${r.text}.`, `${meaning ? cap(meaning) + '. ' : ''}Смотри на соперников — борд никуда не денется.`]);
  }

  // ---------- tells quiz: what does this reaction mean? ----------
  const HONEST = 'Надёжно у Камня (едва заметно) и Коллинг-станции (явно); у Маньяка — шум.';
  const ACTED = 'Так играет Актёр (иногда Регуляр): читай наоборот.';
  const TELLS_GUIDE = [
    { anim: 'glance', sign: 'Быстрый взгляд на свои фишки', meaning: 'Сила: карта попала, думает о ставке', reliability: HONEST },
    { anim: 'freeze', sign: 'Замирает, задерживает дыхание', meaning: 'Сила: боится спугнуть', reliability: HONEST },
    { anim: 'quiet', sign: 'Резко замолкает', meaning: 'Сила: сосредоточился на сильной руке', reliability: HONEST },
    { anim: 'tremble', sign: 'Руки дрожат при ставке', meaning: 'Очень сильная рука: так волнуются, а не блефуют', reliability: HONEST },
    { anim: 'lookaway', sign: 'Безразлично смотрит в сторону', meaning: 'Слабость: карта не помогла', reliability: HONEST },
    { anim: 'chatter', sign: 'Начинает болтать', meaning: 'Слабость: рука не интересна', reliability: HONEST },
    { anim: 'shrug', sign: 'Пожимает плечами', meaning: 'Слабость: промах', reliability: HONEST },
    { anim: 'sigh', sign: 'Демонстративно вздыхает: «ну и флоп…»', meaning: 'Актёрство: показная слабость — обычно сила', reliability: ACTED },
    { anim: 'smile', sign: 'Показно улыбается, уверенно смотрит', meaning: 'Актёрство: показная сила — часто блеф', reliability: ACTED },
    { anim: 'toss', sign: 'С вызовом бросает фишки', meaning: 'Актёрство: показная уверенность — часто блеф', reliability: ACTED },
  ];
  const TELL_OPTIONS = [{ v: 'strength', label: 'Сила (рука попала)' }, { v: 'weakness', label: 'Слабость (не попал)' },
    { v: 'acting', label: 'Актёрство (показуха — наоборот)' }, { v: 'nothing', label: 'Ничего не значит' }];
  const TELL_RU = { strength: 'сила', weakness: 'слабость', acting: 'актёрство', nothing: 'ничего не значит' };
  const STYLE_TELLS = { rock: 'теллы честные, но едва заметные', station: 'теллы честные и явные', reg: 'теллов почти нет, иногда актёрство',
    maniac: 'реакции хаотичные — не опирайся на них', actor: 'реакции обратные: слабость = сила' };
  function tellQuestion(reaction, table) {
    const p = reaction && table && table.players[reaction.seat];
    if (!p || !reaction.text) return null;
    return { id: 'tell', type: 'choice', prompt: `Что значит: ${p.name} ${reaction.text}?`, options: TELL_OPTIONS, reaction,
      hint: 'Сила: взгляд на фишки, замер, молчание. Слабость: взгляд в сторону, болтовня, пожимание плечами. Показуха (вздох, улыбка, бросок фишек) — наоборот.' };
  }
  // honest → its face value; acting → «актёрство»; random noise → «ничего» or the face value.
  function tellReview(reaction, answer, hand, table) {
    const r = reaction, p = r && table && table.players[r.seat];
    if (!p) return null;
    const face = r.shown === 'strength' ? 'strength' : 'weakness', want = r.acting ? 'acting' : r.random ? 'nothing' : face;
    const ok = answer === want || (r.random && answer === face);
    const hole = hand && hand.hole && hand.hole[r.seat];
    const had = r.truth === 'strong' ? 'сильная рука — карта помогла' : r.truth === 'weak' ? 'слабая рука — карта не помогла' : 'карта ничего не изменила';
    const nature = r.acting ? `Это актёрство: ${r.shown === 'strength' ? 'показная сила прикрывала слабость' : 'показная слабость прикрывала силу'}.`
      : r.random ? 'Реакция случайная — шум: теллы надёжны не на 100%.' : `Реакция честная: ${face === 'strength' ? 'сила' : 'слабость'} настоящая.`;
    const guide = TELLS_GUIDE.find((g) => g.anim === r.anim), base = baseOf(p);
    const style = p.revealed ? `${p.name} («${styleName(p)}»): ${STYLE_TELLS[p.style] || STYLE_TELLS[base] || ''}.`
      : `Стиль ${gen(p.name)} пока скрыт — проверяй, совпадают ли его реакции с картами.`;
    const title = ok ? `✅ Телл: верно — ${TELL_RU[answer]}.` : `❌ Телл: ${answer ? `«${TELL_RU[answer] || answer}»` : 'нет ответа'} → на деле ${TELL_RU[want]}.`;
    return { ...fb('tells', ok ? 'correct' : M, title, [nature, `У ${gen(p.name)}${hole ? ` ${cardsTight(hole)}` : ''}: ${had}.`]),
      more: [guide ? `${guide.sign} — ${lowerFirst(guide.meaning)}. ${guide.reliability}` : null, style].filter(Boolean) };
  }

  // ---------- teacher: the best action before the hero acts ----------
  const BEATS = { 'топ-пара': 'две пары, сеты и топ-пара с кикером старше', 'оверпара': 'сеты и две пары', 'слабая пара': 'любая пара старше', 'ничего': 'любая пара' };
  const beatsOf = (m) => (m.strength === 'strong' ? 'только более сильные комбинации — это редкость' : BEATS[m.label] || 'любая пара');
  function advise(spot) {
    if (!spot) return null;
    const sp = spot, best = sp.best, act = best === 'raise' ? (sp.facing ? 'raise' : 'bet') : best;
    let size;
    if (best === 'raise') {
      size = sp.bluff && sp.kind === 'nodraw' ? sp.bluff.to
        : Math.min(sp.myBet + sp.stack, sp.facing ? Math.max(sp.minTo, nice(3 * sp.betTo, sp.bb)) : sp.myBet + nice((sp.pot * 2) / 3, sp.bb));
    }
    const ev = evaluateAction(sp, { type: act, to: size });
    const all = [...ev.lines, ...(ev.more || [])];
    const risk = size ? size - sp.myBet : act === 'call' ? sp.toCall : 0, share = `${pctR((100 * risk) / Math.max(1, sp.stack + sp.myBet))} стека`;
    const bluff = sp.kind === 'nodraw' && sp.bluff;
    const riskLine = act === 'fold' ? 'Сброс: больше ничего не теряешь.' : act === 'check' ? 'Чек бесплатный — ничем не рискуешь.'
      : act === 'call' ? `Риск: ${U.fmt(risk)} (${share}). Бьют тебя: ${beatsOf(sp.made)}.`
      : bluff ? `Риск: ${U.fmt(risk)} (${share}) — заплатят в ~${pctR((1 - sp.bluff.fp) * 100)} случаев.`
      : sp.kind === 'draw' ? `Риск: ${U.fmt(risk)} (${share}); заплатят — у тебя ещё ~${sp.ruleEq}% на дро.`
      : `Риск: ${U.fmt(risk)} (${share}). Бьют тебя: ${beatsOf(sp.made)}.`;
    const NOUN = { fold: 'сброс', check: 'чек', call: 'колл', bet: 'ставка', raise: 'рейз' };
    const alt = Object.keys(sp.verdicts).filter((a) => a !== best && sp.verdicts[a] !== M);
    const altLine = alt.length ? `${cap(alt.map((a) => nounOf(sp, a)).join(' или '))} тоже нормально.` : null;
    return { best: act, size, title: `👨‍🏫 Лучше: ${NOUN[act]}${size ? (act === 'raise' ? ' до ' : ' ') + U.fmt(size) : ''}`,
      lines: [all.find((l) => l.length <= MAXLEN && !/^Никогда не сбрасывай/.test(l)) || all[0], riskLine, altLine].filter(Boolean), more: all.slice(1) };
  }

  // ---------- the player's own timing (SPEC 9.4) ----------
  const timing = (() => {
    let log = [];
    const avg = (a) => U.sum(a.map((x) => x.ms)) / a.length;
    return {
      add(ms, strong) { log.push({ ms: +ms || 0, strong: !!strong }); if (log.length > 20) log.shift(); },
      warning() {
        const s = log.filter((x) => x.strong), w = log.filter((x) => !x.strong);
        if (s.length < 3 || w.length < 3 || avg(s) - avg(w) <= 2000) return null;
        return 'Твой тайминг выдаёт силу руки. Держи одинаковую паузу перед каждым действием.';
      },
      reset() { log = []; },
    };
  })();
  function heroStrong(hole, board) {
    if (!hole) return false;
    if (!board || board.length < 3) return Equity.holeTopPct(hole) <= 0.12;
    const k = classify(hole, board);
    return k === 'strong' || k === 'medium';
  }

  return { analyze, questions, afterActionQuestions, check, evaluateAction, advise, foldProb, realEquity, readQuestion, readReview, lookHint,
    tellQuestion, tellReview, TELLS_GUIDE, timing, heroStrong, computeOuts, madeInfo };
})();

// ===== 70-view.js =====
// ===== View: tiny shared DOM helpers (cards, suit-coloured text, modal, toast) =====
// Used by UI (table) and Screens. Pure string builders are DOM-free; DOM functions touch
// `document` only when called.
const View = (() => {
  // '<div class="pcard red"><span class="pc-r">A</span><span class="pc-s">♥</span></div>'
  // opts: {size:'sm'|'xs', hl:bool, dim:bool, corner:bool (adds corner index)}
  function cardHTML(c, opts = {}) {
    const cls = ['pcard'];
    if (opts.size) cls.push(opts.size);
    if (opts.hl) cls.push('hl');
    if (opts.dim) cls.push('dim');
    if (c === null || c === undefined) return `<div class="${cls.join(' ')} back" aria-label="карта рубашкой"></div>`;
    if (c === -1) return `<div class="${cls.join(' ')} empty"></div>`;
    if (Cards.isRed(c)) cls.push('red');
    const r = Cards.rankLabel(Cards.rank(c)), s = Cards.SUIT_SYMBOLS[Cards.suit(c)];
    return `<div class="${cls.join(' ')}" data-c="${c}" aria-label="${r}${s}"><span class="pc-r">${r}</span><span class="pc-s">${s}</span></div>`;
  }
  const cardsHTML = (cards, opts = {}) => `<span class="cards-row">${cards.map((c) => cardHTML(c, opts)).join('')}</span>`;

  // Escape plain text and colour suit symbols: 'A♥ K♥' → 'A<span class="s-red">♥</span> …'
  const suitText = (text) => U.esc(text).replace(/[♥♦]/g, '<span class="s-red">$&</span>');

  // 13×13 range grid from Ranges.grid(key, ctx); hl = the hero's hand code, outlined.
  const RG_LEGEND = { raise: 'Рейз', in: 'Играть', call: 'Колл', border: 'Граница', out: 'Сброс' };
  function gridCells(key, ctx) {
    const g = Ranges.grid(key, ctx).flat();
    // ponytail: Ranges.grid knows no 'limped:POS' yet — fall back to the position's open range (= raise over limpers)
    if (String(key).startsWith('limped:') && g.every((c) => c.cls === 'out')) {
      return Ranges.grid(key.slice(7), ctx).flat().map((c) => ({ code: c.code, cls: c.cls === 'in' ? 'raise' : c.cls }));
    }
    return g;
  }
  function rangeGridHTML(key, hl, ctx) {
    let cells;
    try { cells = gridCells(key, ctx); } catch (e) { return ''; }
    const used = Object.keys(RG_LEGEND).filter((k) => cells.some((c) => c.cls === k));
    return `<div class="rg"><div class="rg-g" role="img" aria-label="Сетка рук${hl ? ', твоя рука ' + U.esc(hl) : ''}">${cells.map((c) =>
      `<span class="rg-${U.esc(c.cls)}${c.code === hl ? ' rg-hl' : ''}">${U.esc(c.code)}</span>`).join('')}</div>
      <div class="rg-leg">${used.map((k) => `<span><i class="rg-${k}"></i>${RG_LEGEND[k]}</span>`).join('')}${hl ? '<span><i class="rg-hl"></i>Твоя рука</span>' : ''}</div></div>`;
  }

  // Feedback block: fb = {verdict:'correct'|'acceptable'|'mistake'|'info'|'teach', title, lines:[...], more?:[...], grid?:{key, hl}}
  // lines are always shown; the grid under them; `more` collapsed under «Подробнее».
  function feedbackHTML(fb) {
    const v = fb.verdict || 'info', row = (l) => `<div class="fb-line">${suitText(l)}</div>`;
    const grid = fb.grid && fb.grid.key ? rangeGridHTML(fb.grid.key, fb.grid.hl) : '';
    const more = fb.more && fb.more.length ? `<details class="fb-more"><summary>Подробнее</summary>${fb.more.map(row).join('')}</details>` : '';
    return `<div class="fb ${v}"><div class="fb-title v-${v}">${suitText(fb.title || '')}</div>${(fb.lines || []).map(row).join('')}${grid}${more}</div>`;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  // modal(title, bodyHTML, {buttons:[{label, value, cls}], wide:bool, onOpen(root)}) → Promise<value|null>
  function modal(title, bodyHTML, opts = {}) {
    return new Promise((resolve) => {
      const buttons = opts.buttons || [{ label: 'Закрыть', value: null, cls: 'btn-primary' }];
      const back = el(`<div class="modal-back" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
        <div class="modal"${opts.wide ? ' style="width:min(980px,100%)"' : ''}>
          <div class="modal-head"><h2>${U.esc(title)}</h2><button class="btn btn-ghost btn-sm" data-x aria-label="Закрыть">✕</button></div>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-foot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${U.esc(b.label)}</button>`).join('')}</div>
        </div></div>`);
      const close = (v) => { document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      back.addEventListener('click', (e) => {
        if (e.target === back || e.target.closest('[data-x]')) return close(null);
        const b = e.target.closest('[data-i]');
        if (b && b.parentElement.classList.contains('modal-foot')) close(buttons[+b.dataset.i].value);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(back);
      if (opts.onOpen) opts.onOpen(back.querySelector('.modal-body'));
      const first = back.querySelector('.modal-foot .btn');
      if (first) first.focus({ preventScroll: true });
    });
  }

  function toast(text, ms = 3000) {
    let wrap = document.querySelector('.toast-wrap');
    if (!wrap) { wrap = el('<div class="toast-wrap" aria-live="polite"></div>'); document.body.appendChild(wrap); }
    const t = el(`<div class="toast">${suitText(text)}</div>`);
    wrap.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }

  function clearToasts() {
    if (typeof document !== 'undefined') document.querySelectorAll('.toast-wrap .toast').forEach((t) => t.remove());
  }

  return { cardHTML, cardsHTML, suitText, feedbackHTML, rangeGridHTML, el, modal, toast, clearToasts };
})();

// ===== 72-settings.js =====
// ===== Settings: user preferences, validated and persisted via U.storage ('settings') =====
const Settings = (() => {
  const KEY = 'settings';
  const STYLE_IDS = ['rock', 'station', 'reg', 'maniac', 'actor'];
  const SPEED = { slow: 1.6, normal: 1, fast: 0.45 };
  const DEFAULTS = {
    players: 9, startBB: 100, levelHands: 10, speed: 'normal',
    botsMode: 'random', botStyles: ['rock', 'station', 'reg', 'maniac', 'actor', 'reg', 'rock', 'station'],
    questions: { preflop: true, outs: true, equity: true, potodds: true, read: true, tells: true },
    practiceFreq: 75, tournamentReview: 'hand',
    dealAssist: 'normal', // learn/practice: rig some deals toward teachable spots ('off'|'normal'|'strong'); never in tournament
    heroPos: 'any', // learn/practice: lock the hero to one position label
    autoSkipFolded: false, // finish the hand instantly once the hero folded
    teacher: true, // learn mode: the teacher suggests the best action on every turn
  };
  const LIMITS = { players: [2, 9], startBB: [20, 300], levelHands: [5, 30] };
  const ENUMS = { speed: Object.keys(SPEED), botsMode: ['random', 'manual'], practiceFreq: [25, 50, 75, 100], tournamentReview: ['hand', 'end'],
    dealAssist: ['off', 'normal', 'strong'], heroPos: ['any', 'UTG', 'UTG+1', 'MP', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'] };
  const BOOLS = ['autoSkipFolded', 'teacher'];

  const copy = (o) => JSON.parse(JSON.stringify(o));

  // `base` with every field of `raw` that has a valid type/range applied; garbage is ignored.
  function clean(raw, base) {
    const r = raw && typeof raw === 'object' ? raw : {};
    const out = copy(base);
    for (const [k, [lo, hi]] of Object.entries(LIMITS)) if (Number.isInteger(r[k]) && r[k] >= lo && r[k] <= hi) out[k] = r[k];
    for (const [k, list] of Object.entries(ENUMS)) if (list.includes(r[k])) out[k] = r[k];
    for (const k of BOOLS) if (typeof r[k] === 'boolean') out[k] = r[k];
    if (Array.isArray(r.botStyles)) out.botStyles = out.botStyles.map((d, i) => (STYLE_IDS.includes(r.botStyles[i]) ? r.botStyles[i] : d));
    const q = r.questions && typeof r.questions === 'object' ? r.questions : {};
    for (const k in out.questions) if (typeof q[k] === 'boolean') out.questions[k] = q[k];
    return out;
  }

  let cur = null; // loaded once; stays in memory when storage is unavailable
  const load = () => cur || (cur = clean(U.storage.get(KEY, null), DEFAULTS));
  const get = () => copy(load());
  // Shallow merge (questions merged per key), validated, persisted. set(DEFAULTS) = reset.
  function set(patch) {
    cur = clean(patch, load());
    U.storage.set(KEY, cur);
    return get();
  }
  const speedFactor = () => SPEED[load().speed];
  const reload = () => { cur = null; return get(); }; // re-read storage (tests)

  return { DEFAULTS, LIMITS, STYLE_IDS, get, set, speedFactor, reload };
})();

// ===== 75-stats.js =====
// ===== Stats: answer accuracy (total / category / preflop position / session), last mistakes =====
// Persisted via U.storage ('stats'); works in memory when storage is unavailable.
const Stats = (() => {
  const KEY = 'stats';
  const CATS = ['preflop', 'outs', 'equity', 'potodds', 'action', 'read', 'tells'];
  const CAT_RU = { preflop: 'Префлоп', outs: 'Ауты', equity: 'Эквити', potodds: 'Шансы банка', action: 'Действие', read: 'Чтение соперника', tells: 'Теллы' };
  const POSITIONS = ['UTG', 'UTG+1', 'MP', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  const MAX_SESSIONS = 30, MAX_MISTAKES = 20;

  const copy = (o) => JSON.parse(JSON.stringify(o));
  const arr = (a) => (Array.isArray(a) ? a : []);
  const cnt = (c) => {
    const n = c && Number.isInteger(c.n) && c.n > 0 ? c.n : 0;
    return { ok: c && Number.isInteger(c.ok) && c.ok > 0 ? Math.min(c.ok, n) : 0, n };
  };
  const cnts = (m, keys) => Object.fromEntries(keys.map((k) => [k, cnt(m && m[k])]));
  const cards = (a) => arr(a).filter((c) => Number.isInteger(c) && c >= 0 && c < 52);
  const mistake = (m) => ({
    ts: Number.isFinite(m.ts) ? m.ts : Date.now(), cat: String(m.cat || ''), title: String(m.title || ''),
    lines: arr(m.lines).map(String), handNo: Number.isInteger(m.handNo) ? m.handNo : null,
    mode: m.mode ? String(m.mode) : null, pos: m.pos ? String(m.pos) : null, hole: cards(m.hole), board: cards(m.board),
  });
  const session = (s) => ({ id: String(s.id || U.uid('s')), ts: Number.isFinite(s.ts) ? s.ts : 0, mode: s.mode || null, ...cnt(s), byCat: cnts(s.byCat, CATS) });

  // Validated copy of stored data (garbage → empty).
  function clean(raw) {
    const r = raw && typeof raw === 'object' ? raw : {};
    const look = cnt(r.looks && { ok: r.looks.players, n: r.looks.total });
    return {
      total: cnt(r.total), byCat: cnts(r.byCat, CATS), byPos: cnts(r.byPos, POSITIONS),
      sessions: arr(r.sessions).filter((s) => s && typeof s === 'object').slice(-MAX_SESSIONS).map(session),
      mistakes: arr(r.mistakes).filter((m) => m && typeof m === 'object').slice(0, MAX_MISTAKES).map(mistake),
      looks: { players: look.ok, total: look.n },
    };
  }

  let st = null, cur = null, curMode = null;
  const load = () => st || (st = clean(U.storage.get(KEY, null)));
  const save = () => U.storage.set(KEY, st);
  const bump = (c, ok) => { c.n++; if (ok) c.ok++; };

  function beginSession(mode = null) {
    const s = load();
    curMode = mode;
    cur = session({ id: U.uid('s'), ts: Date.now(), mode });
    s.sessions = s.sessions.filter((x) => x.n > 0).concat(cur).slice(-MAX_SESSIONS); // drop empty sessions
    save();
  }

  // ok: boolean (a feedback verdict string also works: only 'mistake' is wrong).
  // 'tells' is a habit, not an answer: it has its own category but stays out of total and session accuracy.
  function record(cat, ok, opts) {
    if (!CATS.includes(cat)) return;
    ok = typeof ok === 'string' ? ok !== 'mistake' : !!ok;
    const s = load();
    if (!cur) beginSession(curMode);
    bump(s.byCat[cat], ok);
    bump(cur.byCat[cat], ok);
    if (cat !== 'tells') { bump(s.total, ok); bump(cur, ok); }
    const pos = opts && opts.pos;
    if (cat === 'preflop' && POSITIONS.includes(pos)) bump(s.byPos[pos], ok);
    save();
  }

  function recordLook(looked) {
    const s = load();
    s.looks.total++;
    if (looked) s.looks.players++;
    record('tells', !!looked);
  }

  function addMistake(m) {
    if (!m || typeof m !== 'object') return;
    const s = load();
    s.mistakes = [mistake(m)].concat(s.mistakes).slice(0, MAX_MISTAKES);
    save();
  }

  // { total, byCat, byPos, sessions (oldest → newest, current last), mistakes (newest first), looks }
  const data = () => copy(load());
  function reset() { st = clean(null); cur = null; U.storage.remove(KEY); }
  const reload = () => { st = null; cur = null; return data(); }; // re-read storage (tests)

  return { CATS, CAT_RU, POSITIONS, beginSession, record, recordLook, addMistake, data, reset, reload };
})();

      const bet = View.el(`<div class="bet hidden${i === 0 ? ' me' : ''}${side}" style="--x:${x.toFixed(4)};--y:${y.toFixed(4)}"></div>`);
      $('.seats').appendChild(seat); $('.bets').appendChild(bet);
      seatEls.push(seat); betEls.push(bet); prevBets.push(0);
    });
  }

  // ---------- render ----------
  function render() {
    if (!root || !root.isConnected) return;
    renderHead();
    S.table.players.forEach(renderSeat);
    renderCenter();
    renderBets();
    renderDealer();
    renderDock();
    if (popSeat !== null) showPop(popSeat);
  }

  function renderHead() {
    const t = S.table, h = S.hand;
    const no = h ? `<span class="hno"><i class="k">Раздача </i><b>№${h.no}</b></span>` : '';
    let html = `<span><i class="k">Блайнды </i><b>${fmt(t.sb)}/${fmt(t.bb)}</b></span>`;
    const L = S.mode === 'tournament' && S.levelInfo;
    // Tournament: level and the countdown come before the hand number, so a narrow header cuts the number first.
    if (L) html += `<span><i class="k">Уровень </i><i class="ks">Ур. </i><b>${L.level}</b></span>` +
      (L.left ? `<span title="Блайнды вырастут через ${U.nplural(L.left, 'раздачу', 'раздачи', 'раздач')}">↑ через <b>${L.left}</b><i class="k"> ${U.plural(L.left, 'раздачу', 'раздачи', 'раздач')}</i></span>` : '');
    put($('.hinfo'), L ? html + no : no + html);
    tog(root, 'paused', S.paused);
    const pb = $('[data-cmd="pause"]');
    put(pb, (S.paused ? IC.play : IC.pause) + `<span class="lbl">${S.paused ? 'Продолжить' : 'Пауза'}</span>`);
    pb.title = S.paused ? 'Продолжить' : 'Пауза';
    tog(pb, 'on', S.paused);
    tog($('.veil'), 'hidden', !S.paused);
    const pin = S.mode !== 'tournament' && S.st && S.st.heroPos && S.st.heroPos !== 'any' ? S.st.heroPos : '';
    tog($('.pin-chip'), 'hidden', !pin);
    put($('.pin-chip'), pin ? `📌 ${esc(pin)} <i>✕</i>` : '');
    const tb = $('[data-cmd="teacher"]');
    tog(tb, 'on', !!S.teacher);
    tb.title = S.teacher ? 'Учитель включён — нажми, чтобы выключить' : 'Учитель выключен — нажми, чтобы включить';
    tb.setAttribute('aria-pressed', String(!!S.teacher));
  }

  const SHORT = { rock: 'Камень', station: 'Станция', reg: 'Регуляр', maniac: 'Маньяк', actor: 'Актёр' };
  const styleName = (p) => {
    const st = typeof Bots !== 'undefined' && Bots.STYLES && Bots.STYLES[p.style];
    return st ? st.name : p.style;
  };
  const posTip = (pos) => {
    const info = typeof Ranges !== 'undefined' && Ranges.POS_INFO && Ranges.POS_INFO[pos];
    if (!info) return pos;
    return `${pos} — ${info.group === 'Блайнд' ? 'блайнд' : info.group.toLowerCase() + ' позиция'}\n${info.text}`;
  };

  function seatStatus(p, i) {
    const h = S.hand;
    if (p.busted) return ['out', p.place ? `Выбыл · ${p.place} место` : 'Выбыл'];
    if (!h || !h.dealt[i]) return ['', ''];
    const won = S.payouts && S.payouts[i];
    if (won) return ['won', '+' + fmt(won)];
    if (h.folded[i]) return ['fold', 'Сброс'];
    if (S.turn === i) return i === 0 ? ['myturn', 'Твой ход'] : ['think', 'думает'];
    if (h.allIn[i]) return ['allin', 'Олл-ин'];
    if (S.acts && S.acts[i]) return ['did', S.acts[i]];
    return ['', ''];
  }

  function renderSeat(p, i) {
    const el = seatEls[i], h = S.hand;
    if (!el) return;
    const dealt = !!(h && h.dealt[i]);
    const folded = dealt && h.folded[i];
    tog(el, 'turn', S.turn === i);
    tog(el, 'folded', folded);
    tog(el, 'out', p.busted);
    tog(el, 'away', !p.busted && h && !dealt);
    tog(el, 'win', !!(S.winners && S.winners.includes(i)));
    // cards
    const cardsEl = $('.s-cards', el);
    let cards = '';
    const hole = dealt && h.hole[i];
    if (hole) {
      if (i === 0) cards = hole.map((c) => View.cardHTML(c, { hl: S.hl && S.hl.has(c), dim: folded })).join('');
      else if (!folded && S.reveal && S.reveal.has(i)) cards = hole.map((c) => View.cardHTML(c, { hl: S.hl && S.hl.has(c) })).join('');
      else if (!folded) cards = View.cardHTML(null) + View.cardHTML(null);
    }
    tog(cardsEl, 'show', i !== 0 && !folded && S.reveal && S.reveal.has(i));
    put(cardsEl, cards);
    // name, style badge, stack
    let badge = '';
    if (i !== 0) badge = p.revealed ? `<i class="sty ${esc(p.style)}" title="${esc(styleName(p))}">${SHORT[p.style] || esc(styleName(p))}</i>` : '<i class="sty unk" title="Стиль пока неизвестен">?</i>';
    put($('.s-info', el), `<div class="s-name"><span class="nm">${esc(p.name)}</span>${badge}</div><div class="s-stack">${fmt(p.stack)}</div>${p.revealed && i ? `<div class="s-sty">${badge}</div>` : ''}`);
    // position badge with tooltip
    const pos = dealt ? h.pos[i] : '';
    const pb = $('.posb', el);
    put(pb, pos || '');
    if (pos) pb.dataset.tip = posTip(pos); else delete pb.dataset.tip;
    // status
    const [cls, text] = seatStatus(p, i);
    const st = $('.s-status', el);
    st.className = 's-status ' + cls;
    put(st, esc(text));
  }

  function sidePots(h) {
    // Display-only split of committed chips into main/side pots by all-in levels.
    const seats = h.seats || h.committed.map((_, i) => i);
    const raw = (s) => h.committed[s] - (h.returned ? h.returned[s] : 0);
    // Chips above the second-largest contribution are uncalled (Engine returns them): never a «Побочный».
    const cap = h.committed.map((_, s) => raw(s)).sort((a, b) => b - a)[1] || 0;
    const paid = (s) => Math.min(raw(s), cap);
    const levels = [...new Set(seats.filter((s) => h.allIn[s] && !h.folded[s]).map(paid))].sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    for (const L of levels) {
      const amt = U.sum(seats.map((s) => Math.max(0, Math.min(paid(s), L) - prev)));
      if (amt > 0) pots.push(amt);
      prev = L;
    }
    const rest = U.sum(seats.map((s) => Math.max(0, paid(s) - prev)));
    if (rest > 0) pots.push(rest);
    return pots;
  }

  function renderCenter() {
    const h = S.hand;
    let potHTML = '';
    if (h && !S.paid) {
      const total = typeof Engine !== 'undefined' && Engine.pot ? Engine.pot(h) : U.sum(h.committed || []);
      if (total) {
        potHTML = `<span class="pot"><i class="chip gold"></i>Банк <b>${fmt(total)}</b></span>`;
        const pots = h.result ? h.result.pots.map((p) => p.amount) : sidePots(h);
        if (pots.length > 1) potHTML += pots.map((a, k) => `<span class="pot sp">${k ? 'Побочный' + (pots.length > 2 ? ' ' + k : '') : 'Основной'} <b>${fmt(a)}</b></span>`).join('');
      }
    }
    put($('.pots'), potHTML);
    // board: revealed cards face up (the newest flip in), dealt-but-hidden as backs, the rest empty slots.
    // Slots persist and the highlight is toggled in place, so a flip animation is never replayed or cut short.
    const shown = h ? Math.min(S.boardShown || 0, h.board.length) : 0;
    if (shown !== shownBoard) { boardBase = shown > shownBoard ? shownBoard : shown; shownBoard = shown; }
    $$('.board .slot').forEach((slot, k) => {
      const face = k < shown;
      let html = View.cardHTML(face ? h.board[k] : h && k < h.board.length ? null : -1);
      if (face && k >= boardBase) html = html.replace('class="pcard', `style="--i:${k - boardBase}" class="pcard flip`);
      put(slot, html);
      if (face) tog(slot.firstElementChild, 'hl', S.hl && S.hl.has(h.board[k]));
    });
    const cap = $('.caption');
    put(cap, S.caption ? View.suitText(S.caption) : '');
    tog(cap, 'win', !!S.winners);
  }

  function renderBets() {
    const h = S.hand;
    betEls.forEach((el, i) => {
      const b = h && h.dealt[i] && !S.collecting ? h.bets[i] || 0 : 0;
      tog(el, 'hidden', !b);
      put(el, b ? `<i class="chip"></i><span>${fmt(b)}</span>` : '');
      if (b > prevBets[i]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      prevBets[i] = b;
    });
  }

  function renderDealer() {
    const d = $('.dealer'), h = S.hand, n = S.table.players.length;
    const btn = h ? h.button : S.table.button;
    if (btn === undefined || btn === null) return d.classList.add('hidden');
    d.classList.remove('hidden');
    const a = (90 + (btn * 360) / n) * Math.PI / 180;
    d.style.setProperty('--x', Math.cos(a).toFixed(4));
    d.style.setProperty('--y', Math.sin(a).toFixed(4));
    // The hero's seat is pinned to the bottom edge, off the oval: put the disc just left of the hero's plate.
    const plate = btn === 0 && seatEls[0] && $('.plate', seatEls[0]);
    if (plate && plate.offsetWidth) {
      const pr = plate.getBoundingClientRect(), tr = tableEl.getBoundingClientRect();
      d.style.left = (pr.left - tr.left - d.offsetWidth / 2 - 6).toFixed(1) + 'px';
      d.style.top = (pr.top - tr.top + pr.height / 2).toFixed(1) + 'px';
    } else { d.style.left = ''; d.style.top = ''; }
  }

  // ---------- action dock ----------
  const raiseLabel = (L, to) => (to >= L.maxTo ? `Олл-ин ${fmt(L.maxTo)}` : `${L.isBet ? 'Ставка' : 'Рейз до'} ${fmt(to)}`);

  function renderDock() {
    if (!dock) return;
    const L = act && act.legal, off = !L || S.paused; // paused: the dock is inert
    tog(dock, 'idle', !L);
    tog(dock, 'next', !!nextRes);
    const [fold, call, raise] = $$('.d-main .btn', dock);
    fold.disabled = off; call.disabled = off;
    raise.disabled = off || !L.canRaise;
    $$('.quick .btn, .slide input', dock).forEach((b) => { b.disabled = off || !L.canRaise; });
    $('.d-next .btn', dock).disabled = !!S.paused;
    put($('span', fold), act && act.foldArmed ? 'Точно сбросить?' : 'Сброс');
    put($('span', call), !L ? 'Колл' : L.canCheck ? 'Чек' : L.toCall >= L.stack ? `Олл-ин ${fmt(L.toCall)}` : `Колл ${fmt(L.toCall)}`);
    put($('span', raise), !L ? 'Рейз' : L.canRaise ? raiseLabel(L, amount()) : 'Рейз');
    $('.d-hint', dock).disabled = !(S.hint && S.mode === 'learn');
    $('.d-range', dock).disabled = false; // ranges are reference material: always available
    const skip = !L && !nextRes && typeof Game !== 'undefined' && Game.state && !!(Game.state() || {}).canSkip;
    const g = !!(L && S.teacher && adv);
    tog(fold, 'adv', g && adv === 'fold');
    tog(call, 'adv', g && (adv === 'check' || adv === 'call'));
    tog(raise, 'adv', g && (adv === 'bet' || adv === 'raise'));
    tog($('.d-next', dock), 'hidden', !nextRes);
    tog($('.d-skip', dock), 'hidden', !skip);
    tog($('.d-main', dock), 'hidden', !!nextRes || skip);
    put($('.d-msg', dock), dockMsg());
  }

  function dockMsg() {
    if (S.paused) return 'Пауза — нажми «Продолжить».';
    if (act && act.foldArmed) return 'Чек бесплатный. Нажми «Сброс» ещё раз, если всё же хочешь сбросить.';
    if (nextRes) return 'Раздача окончена.';
    if (act) return 'Твой ход.';
    if (S.asking) return 'Ответь на вопрос тренера.';
    if (S.turn !== null && S.turn !== undefined && S.turn !== 0) return `Ходит <b>${esc(S.table.players[S.turn].name)}</b>…`;
    return '';
  }

  function amount() {
    const L = act && act.legal;
    if (!L) return 0;
    const v = Math.round(parseFloat(String($('.amt-n', dock).value).replace(',', '.')));
    return U.clamp(isFinite(v) ? v : L.minTo, L.minTo, L.maxTo);
  }
  function setAmount(v) {
    const L = act && act.legal;
    if (!L) return;
    v = U.clamp(Math.round(v), L.minTo, L.maxTo);
    const r = $('.amt-r', dock), n = $('.amt-n', dock);
    r.min = n.min = L.minTo; r.max = n.max = L.maxTo; r.step = 1; // the slider snaps through nice() in onInput
    r.value = n.value = v;
    put($('.act-raise span', dock), raiseLabel(L, v));
    const on = act.sizes ? act.sizes.map((s) => s[1]).lastIndexOf(v) : -1; // sizes that collapse to one amount light one button
    $$('.quick .btn', dock).forEach((b, k) => b.setAttribute('aria-pressed', String(k === on)));
  }

  // ---------- bet sizing: chip-friendly amounts, beginner-standard preflop sizes ----------
  // Snap to ½ BB below 10 BB, 1 BB below 50 BB, 2½ BB above; within [minTo, maxTo]; near all-in → exact all-in.
  function nice(v, L, bb) {
    const st = v < 10 * bb ? bb / 2 : v < 50 * bb ? bb : 2.5 * bb;
    let r = Math.round(v / st) * st;
    if (L.maxTo - r < st) r = L.maxTo;
    return U.clamp(r, L.minTo, L.maxTo);
  }
  // Players who just called the big blind preflop (the hero excluded).
  const limpers = (h) => h.seats.filter((s) => s !== 0 && s !== h.bbSeat && !h.folded[s] && h.bets[s] >= h.bb).length;
  // [[label, raise-to] × 5]: preflop in big blinds (+1 BB per limper) or multiples of the raise; postflop pot fractions.
  function quickSizes(h, L) {
    const bb = h.bb, potTo = (f) => nice(Engine.sizeTo(h, f), L, bb), tail = [['Банк', potTo(1)], ['Олл-ин', L.maxTo]];
    if (h.street !== 'preflop') return [['1/3', potTo(1 / 3)], ['1/2', potTo(0.5)], ['2/3', potTo(2 / 3)], ...tail];
    const lim = limpers(h);
    return [2.5, 3, 4].map((k) => (h.raises ? [`×${U.dec(k)}`, nice(k * L.currentBet, L, bb)] : [`${U.dec(k)} BB`, nice((k + lim) * bb, L, bb)])).concat(tail);
  }
  // Default raise-to: open 3 BB + 1 BB per limper; ×3 against a raise or a postflop bet; ⅔ pot as a postflop bet.
  function defaultRaise(h, L) {
    if (h.street === 'preflop') return h.raises ? nice(3 * L.currentBet, L, h.bb) : nice((3 + limpers(h)) * h.bb, L, h.bb);
    return L.currentBet ? nice(3 * L.currentBet, L, h.bb) : nice(Engine.sizeTo(h, 2 / 3), L, h.bb);
  }

  // Runs fn once the game is not paused (autoplay must not act through the Pause veil either).
  const whenRunning = (fn) => (S && S.paused ? setTimeout(() => whenRunning(fn), 100) : fn());

  function askAction(legal, auto) {
    return new Promise((resolve) => {
      // phones: the player decides looking at the table, not at the coach sheet; the dot says the last verdict waits there
      if (!wide() && side.classList.contains('open')) { closeSheet(); $('.tab[data-tab="coach"]').classList.add('new'); }
      act = { legal, resolve, sizes: legal.canRaise ? quickSizes(S.hand, legal) : null };
      if (act.sizes) {
        $$('.quick .btn', dock).forEach((b, k) => put(b, esc(act.sizes[k][0])));
        setAmount(defaultRaise(S.hand, legal));
      } else $$('.quick .btn', dock).forEach((b) => b.setAttribute('aria-pressed', 'false'));
      renderDock();
      if (auto) setTimeout(() => whenRunning(() => {
        if (!act || act.resolve !== resolve) return;
        if (auto.type === 'raise') setAmount(auto.to);
        doAct(auto.type === 'check' ? 'call' : auto.type);
      }), 0);
    });
  }

  function doAct(type) {
    if (!act || S.paused) return;
    const L = act.legal;
    let a;
    // A free check is never folded by a single slip (learn and practice): the first press asks to confirm.
    if (type === 'fold' && L.canCheck && S.mode !== 'tournament' && !act.foldArmed) {
      const cur = act;
      cur.foldArmed = true;
      setTimeout(() => { if (act === cur) { cur.foldArmed = false; renderDock(); } }, 2500);
      return renderDock();
    }
    if (type === 'fold') a = { type: 'fold' };
    else if (type === 'call') a = { type: L.canCheck ? 'check' : 'call' };
    else if (type === 'raise' && L.canRaise) a = { type: 'raise', to: amount() };
    else return;
    const r = act.resolve;
    act = null; adv = null;
    renderDock();
    r(a);
  }

  function quick(k) {
    if (!act || !act.sizes || S.paused) return;
    setAmount(act.sizes[+k][1]);
  }

  // One «next» control: the dock button (the coach column no longer repeats it).
  function waitNext(auto, label = 'Следующая раздача') {
    return new Promise((resolve) => {
      nextRes = resolve;
      put($('.d-next .btn', dock), esc(label));
      renderDock();
      if (auto) setTimeout(() => whenRunning(() => { if (nextRes === resolve) resolveNext(); }), 0);
    });
  }
  function resolveNext() {
    if (!nextRes || S.paused) return;
    const r = nextRes;
    nextRes = null;
    renderDock();
    r();
  }

  // ---------- events ----------
  function onClick(e) {
    const t = e.target;
    const tipEl = t.closest('[data-tip]');
    if (tipEl && tipEl.closest('.seat.me')) { stickyTip(tipEl); e.stopPropagation(); return; }
    if (tipEl) { if (tipFor === tipEl) hideTip(); else showTip(tipEl); e.stopPropagation(); return; }
    hideTip();
    const a = t.closest('[data-act]');
    if (a) return doAct(a.dataset.act);
    const qk = t.closest('[data-q]');
    if (qk) return quick(qk.dataset.q);
    const cmd = t.closest('[data-cmd]');
    if (cmd) return command(cmd.dataset.cmd, cmd);
    const tab = t.closest('.side-tabs [data-tab]');
    if (tab) return tabClick(tab.dataset.tab);
    const seat = t.closest('.seat');
    if (seat && seat.dataset.seat === '0' && t.closest('.plate')) { const pb = $('.posb', seat); if (pb.dataset.tip) stickyTip(pb); return; }
    if (seat && seat.dataset.seat !== '0') return popSeat === +seat.dataset.seat ? hidePop() : showPop(+seat.dataset.seat);
    if (!t.closest('.pop')) hidePop();
  }

  function command(cmd, el) {
    if (cmd === 'next') return resolveNext();
    if (cmd === 'sheet') return side.classList.contains('open') ? closeSheet() : openSheet(side.dataset.tab);
    if (cmd === 'logtoggle') return $('.log').classList.toggle('closed');
    if (cmd === 'reveal') { const s = +el.dataset.seat; if (H.reveal) H.reveal(s); return render(); }
    const G = typeof Game !== 'undefined' ? Game : {};
    if (cmd === 'teacher') return G.setTeacher && G.setTeacher(!S.teacher);
    if (cmd === 'unpin') return G.lockPos && G.lockPos(null);
    if (cmd === 'lockpos') return G.lockPos && G.lockPos(el.dataset.pos);
    if (cmd === 'skip' && !H.skip) return G.skipHand && G.skipHand();
    if (cmd === 'range' && !H.range) return G.openRanges && G.openRanges();
    if (H[cmd]) H[cmd]();
  }

  function onInput(e) {
    const t = e.target;
    if (t.classList.contains('amt-r')) { if (act) setAmount(nice(+t.value, act.legal, S.hand.bb)); }
    else if (t.classList.contains('amt-n') && e.type === 'change') setAmount(amount());
    else if (t.classList.contains('amt-n')) {
      const L = act && act.legal, v = Math.round(+t.value);
      if (L && isFinite(v)) { $('.amt-r', dock).value = v; put($('.act-raise span', dock), raiseLabel(L, U.clamp(v, L.minTo, L.maxTo))); }
    }
  }

  function onKey(e) {
    if (!root || !root.isConnected || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.modal-back')) return;
    if (e.key === 'Escape') { hidePop(); hideTip(); return; }
    const tag = e.target && e.target.tagName;
    const inField = (tag === 'INPUT' && e.target.type !== 'range') || tag === 'TEXTAREA' || tag === 'SELECT'; // the bet slider keeps F/C/R
    if (e.key === 'Enter') {
      if (e.target.classList && e.target.classList.contains('amt-n')) { e.preventDefault(); setAmount(amount()); doAct('raise'); return; }
      if (e.target.classList && e.target.classList.contains('amt-r')) { e.preventDefault(); doAct('raise'); return; }
      if (inField || (tag === 'BUTTON' && !e.target.disabled)) return; // a focused button handles Enter itself
      if (nextRes) { e.preventDefault(); resolveNext(); }
      return;
    }
    if (inField || !act) return;
    const map = { KeyF: 'fold', KeyC: 'call', KeyR: 'raise' };
    if (map[e.code]) { e.preventDefault(); doAct(map[e.code]); }
  }

  // ---------- coach sheet (mobile) / column (desktop) ----------
  function openSheet(tab) {
    side.dataset.tab = tab || 'coach';
    side.classList.add('open');
    if (side.dataset.tab === 'coach') $('.tab[data-tab="coach"]').classList.remove('new');
    put($('.tab-x'), '▴');
  }
  // Phones: a pending question keeps the sheet open (the answer box must stay in view).
  function closeSheet() { if (!wide() && feed.querySelector('.c-q')) return; side.classList.remove('open'); }
  function tabClick(tab) {
    if (side.classList.contains('open') && side.dataset.tab === tab) closeSheet();
    else openSheet(tab);
  }
  function flagNew(peek) {
    const open = wide() || (side.classList.contains('open') && side.dataset.tab === 'coach');
    if (!open) $('.tab[data-tab="coach"]').classList.add('new');
    if (peek) put($('.peek'), peek);
  }

  function coachClear() {
    feed.innerHTML = '';
    adv = null;
    if (!wide()) closeSheet();
    put($('.coach-foot'), '');
    put($('.peek'), '');
    $('.tab[data-tab="coach"]').classList.remove('new');
  }
  function coachAdd(html, cls = '', peek = '') {
    const el = View.el(`<div class="c-item c-new ${cls}">${html}</div>`);
    feed.appendChild(el);
    requestAnimationFrame(() => {
      if (!el.isConnected) return;
      const top = el.offsetTop - feed.offsetTop - 8, prev = el.previousElementSibling;
      let y = top;
      // a question right after a correction: keep the correction in view above it when both fit
      if (el.classList.contains('c-q') && prev && prev.classList.contains('c-fb')) {
        y = Math.min(top, Math.max(prev.offsetTop - feed.offsetTop - 8, top + el.offsetHeight + 16 - feed.clientHeight));
      }
      feed.scrollTop = Math.max(0, y);
    });
    flagNew(peek);
    return el;
  }
  // Narrow screens: a learn-mode mistake opens the sheet (the game waits while it is open — see held), so it is read, not missed.
  function coachFb(fb) {
    const el = coachAdd(View.feedbackHTML(fb), 'c-fb', `<span class="v-${fb.verdict || 'info'}">${View.suitText(fb.title || '')}</span>`);
    if (S.mode === 'learn' && fb.verdict === 'mistake' && !wide()) openSheet('coach');
    return el;
  }
  // Teacher card (advice = { best, size?, title, lines, more? }): brass card + the best action glows in the dock.
  function showAdvice(a) {
    if (!a) return null;
    adv = a.best;
    const el = coachAdd(View.feedbackHTML({ ...a, verdict: 'teach' }), 'c-fb c-adv', `<span class="v-teach">${View.suitText(a.title || '')}</span>`);
    renderDock();
    return el;
  }
  function review(items) {
    coachAdd('<div class="c-sep">Разбор раздачи</div>' + items.map(View.feedbackHTML).join(''), 'c-review', 'Разбор раздачи готов');
    if (!wide()) openSheet('coach');
  }
  // The coach sheet covers the table on narrow screens: while it is open the game holds (Game.wait), like Pause.
  const held = () => !!side && side.classList.contains('open') && !wide();
  function holding(on) { tog(side, 'hold', on); }

  // q = { id, type: 'number'|'choice', prompt, unit, options, info, hint }; ctx = { n, of, hole, board, sub }
  function askQuestion(q, ctx, auto) {
    return new Promise((resolve) => {
      const opts = (q.options || []).map((o) => (o && typeof o === 'object' ? o : { v: o, label: String(o) }));
      const short = (ctx && ctx.short) || (q.info && q.info.short); // short all-in call: only part of the pot can be won
      const info = q.info ? [[short ? 'Банк, который ты можешь выиграть' : 'Банк со ставкой', q.info.pot], ['Ставка соперника', q.info.bet], ['Тебе доплатить', q.info.toCall]]
        .filter(([, v]) => v !== undefined && v !== null).map(([k, v]) => `<span>${k}: <b>${fmt(v)}</b></span>`).join('') : '';
      const hand = ctx && ctx.hole ? `<div class="c-q-hand"><span>Твои карты ${View.cardsHTML(ctx.hole)}</span>${ctx.board && ctx.board.length ? `<span>Борд ${View.cardsHTML(ctx.board)}</span>` : ''}</div>` : '';
      const body = q.type === 'choice'
        ? `<div class="opts">${opts.map((o, k) => `<button class="btn btn-sm" type="button" data-o="${k}">${View.suitText(o.label)}</button>`).join('')}</div>`
        : `<form autocomplete="off"><input type="text" inputmode="decimal" aria-label="${esc(q.prompt)}"><span class="unit">${esc(q.unit || '')}</span><button class="btn btn-primary btn-sm">Ответить</button></form>`;
      const num = ctx && ctx.of > 1 ? `<div class="c-q-n">Вопрос ${ctx.n} из ${ctx.of}</div>` : ctx && ctx.sub ? `<div class="c-q-n">${esc(ctx.sub)}</div>` : '';
      const el = coachAdd(`${num}<div class="c-q-p">${View.suitText(q.prompt)}</div>${hand}${info ? `<div class="c-q-info">${info}</div>` : ''}${body}` +
        (S.mode === 'learn' && q.hint ? `<button class="btn btn-ghost btn-sm qhint" type="button" data-cmd="hint">${IC.bulb}Подсказка</button>` : ''), 'c-q', View.suitText(q.prompt));
      openSheet('coach');
      const input = $('input', el);
      const done = (value, label) => {
        if (S.paused) return; // Pause means paused: answers wait too
        el.className = 'c-item c-ans';
        el.innerHTML = `${View.suitText(q.prompt)} — <b>${View.suitText(label)}</b>`;
        resolve(value);
      };
      const form = $('form', el);
      if (form) form.addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = input.value.trim().replace(',', '.').replace('%', '');
        const v = parseFloat(raw);
        if (S.paused) return;
        if (!raw || !isFinite(v)) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); input.focus(); return; }
        const shown = input.value.trim().replace(/\s*%$/, '');
        done(v, shown + (q.unit === '%' ? '%' : q.unit ? ' ' + q.unit : ''));
      });
      $$('[data-o]', el).forEach((b) => b.addEventListener('click', () => { const o = opts[+b.dataset.o]; done(o.v, o.label); }));
      if (input && !mq('(pointer: coarse)')) setTimeout(() => input.focus({ preventScroll: true }), 30);
      // the on-screen keyboard shrinks the sheet: keep the field in view
      if (input) input.addEventListener('focus', () => setTimeout(() => { if (input.isConnected) input.scrollIntoView({ block: 'nearest' }); }, 300));
      if (auto !== undefined && auto !== null) setTimeout(() => whenRunning(() => {
        if (!el.isConnected || !el.classList.contains('c-q')) return;
        if (form) { input.value = String(auto); form.requestSubmit(); }
        else { const k = opts.findIndex((o) => String(o.v) === String(auto)); ($(`[data-o="${Math.max(0, k)}"]`, el) || {}).click(); }
      }), 0);
    });
  }

  // ---------- log ----------
  function logReset() { logBody.innerHTML = ''; }
  function logStreet(street, cards) {
    logBody.insertAdjacentHTML('beforeend', `<div class="lg-st">${STREET_RU[street] || street}${cards && cards.length ? ' ' + View.suitText('[' + Cards.strList(cards) + ']') : ''}</div>`);

  function logLine(text, cls = '') {
    logBody.insertAdjacentHTML('beforeend', `<div class="lg-ln ${cls}">${View.suitText(text)}</div>`);
    logBody.scrollTop = logBody.scrollHeight;

  // ---------- reactions, look overlay ----------
  function bubble(seat, r, ms) {
    const el = seatEls[seat];
    if (!el || !r) return;
    const b = $('.bubble', el);
    clearTimeout(el._bt);
    if (el._anim) el.classList.remove(el._anim);
    b.textContent = r.bubble || r.text || ''; // no styling from r.acting: noise copies must look the same
    b.classList.add('show');
    if (r.anim) { el._anim = 'a-' + r.anim; void el.offsetWidth; el.classList.add(el._anim); }
    el._bt = setTimeout(() => { b.classList.remove('show'); if (el._anim) el.classList.remove(el._anim); el._anim = null; }, Math.max(300, ms));
  }

  function askLook(street, ms, auto) {
    return new Promise((resolve) => {
      if (!wide()) closeSheet(); // the sheet would cover the overlay on small screens
      const el = $('.look'), bar = $('.look-bar i', el);
      put($('.look-t', el), `${STREET_RU[street] || ''}: куда смотришь?`);
      el.classList.remove('hidden');
      let left = ms, done = false, last = U.now();
      const finish = (v) => {
        if (done) return;
        done = true; clearInterval(timer); el.classList.add('hidden'); el.onclick = null;
        resolve(v);
      };
      el.onclick = (e) => { const b = e.target.closest('[data-look]'); if (b && !S.paused) finish(b.dataset.look); };
      const timer = setInterval(() => {
        const t = U.now();
        if (!S.paused) left -= t - last;
        last = t;
        bar.style.transform = `scaleX(${U.clamp(left / ms, 0, 1)})`;
        if (left <= 0 || !el.isConnected) finish('board');
      }, 40);
      bar.style.transform = 'scaleX(1)';

      if (auto) setTimeout(() => whenRunning(() => { if (!done) $(`[data-look="${auto}"]`, el).click(); }), 0);

  // ---------- popover (bot info) and tooltip ----------
  function showPop(seat) {
