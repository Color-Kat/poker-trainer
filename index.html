<body>
<div id="app"></div>
<noscript><p style="padding:24px;color:#eee">Для игры нужен включённый JavaScript.</p></noscript>
<script>
'use strict';
// ===== 00-util.js =====
// ===== U: shared helpers (RNG, formatting, storage) =====
// No module may touch DOM / window / localStorage at load time (tests load all files in Node).
const U = (() => {
  // Seedable RNG: U.seed(n) → deterministic mulberry32 (tests), U.seed(null) → Math.random.
  let state = null;
  function mulberry32() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rng = () => (state === null ? Math.random() : mulberry32());
  const seed = (n) => { state = n === null || n === undefined ? null : n >>> 0; };
  const randInt = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const chance = (p) => rng() < p;
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];

  // Fisher–Yates, in place.
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const sum = (arr) => arr.reduce((s, x) => s + x, 0);

  // 12500 → '12 500' (narrow no-break space).
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  // fraction → '19,6%'; pctNum takes a value already in percent.
  const pctNum = (p, digits = 0) => Number(p).toFixed(digits).replace('.', ',') + '%';
  const pct = (x, digits = 0) => pctNum(x * 100, digits);
  // 2.5 → '2,5'
  const dec = (x, digits = 1) => Number(x).toFixed(digits).replace('.', ',').replace(/,0+$/, '');

  // Russian plural: plural(5, 'аут', 'аута', 'аутов') → 'аутов'
  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b === 1) return one;
    if (b >= 2 && b <= 4) return few;
    return many;
  }
  const nplural = (n, one, few, many) => n + ' ' + plural(n, one, few, many);

  const sleep = (ms) => new Promise((r) => setTimeout(r, Math.max(0, ms)));
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

  // localStorage wrapper: every access in try/catch; game works without storage.
  const PREFIX = 'pokerTrainer.';
  const storage = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
    },
    remove(key) {
      try { localStorage.removeItem(PREFIX + key); } catch (e) { /* storage unavailable */ }
    },
  };

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);

  let uidN = 0;
  const uid = (p = 'id') => p + (++uidN) + '_' + Math.floor(Math.random() * 1e6).toString(36);

  return { rng, seed, randInt, chance, pick, shuffle, clamp, sum, fmt, pct, pctNum, dec, plural, nplural, sleep, now, storage, esc, uid };
})();

// ===== 10-cards.js =====
// ===== Cards: card ints, parsing/formatting, 169 hand codes, range notation =====
// card = (rank - 2) * 4 + suit; rank 2..14 (14 = A); suit 0..3 = s h d c (♠ ♥ ♦ ♣)
const Cards = (() => {
  const RANKS = '23456789TJQKA';
  const SUITS = 'shdc';
  const SUIT_SYMBOLS = ['♠', '♥', '♦', '♣'];
  const RED = [false, true, true, false];

  const rank = (c) => (c >> 2) + 2;
  const suit = (c) => c & 3;
  const make = (r, s) => ((r - 2) << 2) | s;
  const rankChar = (r) => RANKS[r - 2];
  const rankLabel = (r) => (r === 10 ? '10' : RANKS[r - 2]); // for card faces / text
  const rankOf = (ch) => (ch === '10' ? 10 : RANKS.indexOf(String(ch).toUpperCase()) + 2);
  const isRed = (c) => RED[suit(c)];

  const TOKEN = /(10|[2-9TJQKA])([shdc♠♥♦♣])/gi;
  function parse(str) {
    const m = /^\s*(10|[2-9TJQKA])([shdc♠♥♦♣])\s*$/i.exec(str);
    if (!m) throw new Error('Bad card: ' + str);
    let s = SUITS.indexOf(m[2].toLowerCase());
    if (s < 0) s = SUIT_SYMBOLS.indexOf(m[2]);
    return make(rankOf(m[1]), s);
  }
  // 'As Kd 7h' or 'AsKd7h' → [c, c, c]
  const parseList = (str) => (String(str).match(TOKEN) || []).map(parse);

  const str = (c) => rankLabel(rank(c)) + SUIT_SYMBOLS[suit(c)];
  const strList = (cards) => cards.map(str).join(' ');
  const deck = () => Array.from({ length: 52 }, (_, i) => i);

  // [c1, c2] → 'AKs' | 'AKo' | '77' (higher rank first)
  function handCode(c1, c2) {
    let r1 = rank(c1), r2 = rank(c2);
    if (r1 < r2) { const t = r1; r1 = r2; r2 = t; }
    if (r1 === r2) return rankChar(r1) + rankChar(r2);
    return rankChar(r1) + rankChar(r2) + (suit(c1) === suit(c2) ? 's' : 'o');
  }

  // 13×13 grid, index 0 = A … 12 = 2. Diagonal: pairs; above diagonal (i<j): suited; below: offsuit.
  function gridCode(i, j) {
    const ri = 14 - i, rj = 14 - j;
    if (i === j) return rankChar(ri) + rankChar(rj);
    if (i < j) return rankChar(ri) + rankChar(rj) + 's';
    return rankChar(rj) + rankChar(ri) + 'o';
  }
  const HAND_CODES = [];
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) HAND_CODES.push(gridCode(i, j));

  const codeCombos = (code) => (code.length === 2 ? 6 : code[2] === 's' ? 4 : 12);
  // 'AKs' → {hi:14, lo:13, type:'s'}; '77' → {hi:7, lo:7, type:'p'}
  function codeInfo(code) {
    const hi = rankOf(code[0]), lo = rankOf(code[1]);
    return { hi, lo, type: code.length === 2 ? 'p' : code[2] };
  }
  // All concrete [c1, c2] combos of a code.
  function codeToCombos(code) {
    const { hi, lo, type } = codeInfo(code);
    const out = [];
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
      if (type === 'p' && s2 <= s1) continue;
      if (type === 's' && s1 !== s2) continue;
      if (type === 'o' && s1 === s2) continue;
      out.push([make(hi, s1), make(lo, s2)]);
    }
    return out;
  }

  // Range notation: '77+', 'JJ-22', 'AJs+', 'KQs', 'A5s-A2s', 'AK' (= AKs + AKo), 'K9o+'.
  // 'XYs+' raises the lower card up to one below the higher card (T8s+ = T8s, T9s).
  function parseRange(text) {
    const set = new Set();
    const R = '([2-9TJQKA])';
    for (const raw of String(text).split(',')) {
      const t = raw.trim().toUpperCase().replace(/S\b/g, 's').replace(/O\b/g, 'o');
      if (!t) continue;
      let m;
      if ((m = new RegExp('^' + R + '\\1(\\+)?$').exec(t))) {
        const r = rankOf(m[1]);
        for (let x = r; x <= (m[2] ? 14 : r); x++) set.add(rankChar(x) + rankChar(x));
      } else if ((m = new RegExp('^' + R + '\\1-' + R + '\\2$').exec(t))) {
        const a = rankOf(m[1]), b = rankOf(m[2]);
        for (let x = Math.min(a, b); x <= Math.max(a, b); x++) set.add(rankChar(x) + rankChar(x));
      } else if ((m = new RegExp('^' + R + R + '([so])?(\\+)?$').exec(t))) {
        const hi = rankOf(m[1]), lo = rankOf(m[2]);
        if (hi <= lo) throw new Error('Bad range token: ' + raw);
        const types = m[3] ? [m[3]] : ['s', 'o'];
        for (let x = lo; x <= (m[4] ? hi - 1 : lo); x++) for (const ty of types) set.add(rankChar(hi) + rankChar(x) + ty);
      } else if ((m = new RegExp('^' + R + R + '([so])-' + R + R + '\\3$').exec(t))) {
        const hi = rankOf(m[1]);
        if (rankOf(m[4]) !== hi) throw new Error('Bad range token: ' + raw);
        const a = rankOf(m[2]), b = rankOf(m[5]);
        for (let x = Math.min(a, b); x <= Math.max(a, b); x++) set.add(rankChar(hi) + rankChar(x) + m[3]);
      } else {
        throw new Error('Bad range token: ' + raw);
      }
    }
    return set;
  }

  // Russian rank names: [nom sg, gen sg, nom pl, gen pl] — 'туз', 'туза', 'тузы', 'тузов'
  const RANK_RU = {
    14: ['туз', 'туза', 'тузы', 'тузов'],
    13: ['король', 'короля', 'короли', 'королей'],
    12: ['дама', 'дамы', 'дамы', 'дам'],
    11: ['валет', 'валета', 'валеты', 'валетов'],
    10: ['десятка', 'десятки', 'десятки', 'десяток'],
    9: ['девятка', 'девятки', 'девятки', 'девяток'],
    8: ['восьмёрка', 'восьмёрки', 'восьмёрки', 'восьмёрок'],
    7: ['семёрка', 'семёрки', 'семёрки', 'семёрок'],
    6: ['шестёрка', 'шестёрки', 'шестёрки', 'шестёрок'],
    5: ['пятёрка', 'пятёрки', 'пятёрки', 'пятёрок'],
    4: ['четвёрка', 'четвёрки', 'четвёрки', 'четвёрок'],
    3: ['тройка', 'тройки', 'тройки', 'троек'],
    2: ['двойка', 'двойки', 'двойки', 'двоек'],
  };
  const NOM = 0, GEN = 1, NOM_PL = 2, GEN_PL = 3;
  const rankRu = (r, form = NOM) => RANK_RU[r][form];
  // Suit words for counting: [1 card, 2–4 cards, 5+ cards] — 'черва', 'червы', 'черв'
  const SUIT_RU = [['пика', 'пики', 'пик'], ['черва', 'червы', 'черв'], ['бубна', 'бубны', 'бубен'], ['трефа', 'трефы', 'треф']];
  const suitRu = (s, n) => {
    const f = SUIT_RU[s];
    const a = Math.abs(n) % 100, b = a % 10;
    return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2];
  };

  return {
    RANKS, SUITS, SUIT_SYMBOLS, rank, suit, make, rankChar, rankLabel, rankOf, isRed,
    parse, parseList, str, strList, deck, handCode, gridCode, HAND_CODES, codeCombos, codeInfo, codeToCombos,
    parseRange, RANK_RU, rankRu, NOM, GEN, NOM_PL, GEN_PL, suitRu,
  };
})();

// ===== 20-handeval.js =====
// ===== HandEval: best-5 evaluator for 1..7 cards =====
// score = cat << 20 | k1 << 16 | k2 << 12 | k3 << 8 | k4 << 4 | k5   (higher = better, k = rank 2..14)
// Fewer than 5 cards → only pair-type categories (no straight/flush), missing kickers = 0.
const HandEval = (() => {
  const CAT = { HIGH: 0, PAIR: 1, TWO_PAIR: 2, TRIPS: 3, STRAIGHT: 4, FLUSH: 5, FULL_HOUSE: 6, QUADS: 7, STRAIGHT_FLUSH: 8 };
  const CAT_RU = ['Старшая карта', 'Пара', 'Две пары', 'Тройка', 'Стрит', 'Флеш', 'Фулл-хаус', 'Каре', 'Стрит-флеш'];

  // Highest straight top rank in a rank bitmask (bit r = rank r), ace also plays low. 0 if none.
  function straightTop(mask) {
    if (mask & (1 << 14)) mask |= 1 << 1;
    for (let top = 14; top >= 5; top--) {
      const need = 31 << (top - 4);
      if ((mask & need) === need) return top;
    }
    return 0;
  }

  const pack = (cat, k1 = 0, k2 = 0, k3 = 0, k4 = 0, k5 = 0) => (cat << 20) | (k1 << 16) | (k2 << 12) | (k3 << 8) | (k4 << 4) | k5;
  const cat = (score) => score >> 20;

  const counts = new Int8Array(15);
  const suitCount = new Int8Array(4);
  const suitMask = new Int32Array(4);

  function score(cards) {
    counts.fill(0); suitCount.fill(0); suitMask.fill(0);
    let rankMask = 0;
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i], r = (c >> 2) + 2, s = c & 3;
      counts[r]++; suitCount[s]++; suitMask[s] |= 1 << r; rankMask |= 1 << r;
    }
    let flush = -1;
    for (let s = 0; s < 4; s++) if (suitCount[s] >= 5) flush = s;
    if (flush >= 0) {
      const sf = straightTop(suitMask[flush]);
      if (sf) return pack(8, sf);
    }
    let quad = 0, t1 = 0, t2 = 0, p1 = 0, p2 = 0, p3 = 0;
    for (let r = 14; r >= 2; r--) {
      const k = counts[r];
      if (k === 4) { if (!quad) quad = r; }
      else if (k === 3) { if (!t1) t1 = r; else if (!t2) t2 = r; }
      else if (k === 2) { if (!p1) p1 = r; else if (!p2) p2 = r; else if (!p3) p3 = r; }
    }
    // kickers: highest present ranks excluding up to two ranks
    const kick = (n, ex1, ex2) => {
      const out = [0, 0, 0, 0, 0];
      let j = 0;
      for (let r = 14; r >= 2 && j < n; r--) if (counts[r] && r !== ex1 && r !== ex2) out[j++] = r;
      return out;
    };
    if (quad) return pack(7, quad, kick(1, quad)[0]);
    if (t1 && (t2 || p1)) return pack(6, t1, Math.max(t2, p1));
    if (flush >= 0) {
      const k = [];
      for (let r = 14; r >= 2 && k.length < 5; r--) if (suitMask[flush] & (1 << r)) k.push(r);
      return pack(5, k[0], k[1], k[2], k[3], k[4]);
    }
    const st = straightTop(rankMask);
    if (st) return pack(4, st);
    if (t1) { const k = kick(2, t1); return pack(3, t1, k[0], k[1]); }
    if (p1 && p2) return pack(2, p1, p2, kick(1, p1, p2)[0]);
    if (p1) { const k = kick(3, p1); return pack(1, p1, k[0], k[1], k[2]); }
    const k = kick(5);
    return pack(0, k[0], k[1], k[2], k[3], k[4]);
  }

  const kickers = (s) => [(s >> 16) & 15, (s >> 12) & 15, (s >> 8) & 15, (s >> 4) & 15, s & 15];

  // Russian name from a score: 'Две пары: тузы и семёрки', 'Стрит до пятёрки', 'Роял-флеш'
  function describe(s) {
    const c = cat(s), k = kickers(s), R = Cards.rankRu;
    switch (c) {
      case 8: return k[0] === 14 ? 'Роял-флеш' : 'Стрит-флеш до ' + R(k[0], 1);
      case 7: return 'Каре ' + R(k[0], 3);
      case 6: return 'Фулл-хаус: тройка ' + R(k[0], 3) + ' и пара ' + R(k[1], 3);
      case 5: return 'Флеш до ' + R(k[0], 1);
      case 4: return 'Стрит до ' + R(k[0], 1);
      case 3: return 'Тройка ' + R(k[0], 3);
      case 2: return 'Две пары: ' + R(k[0], 2) + ' и ' + R(k[1], 2);
      case 1: return 'Пара ' + R(k[0], 3);
      default: return 'Старшая карта: ' + R(k[0], 0);
    }
  }

  // Full info incl. the best five cards (for highlighting). Brute force over 5-card subsets.
  function evaluate(cards) {
    const s = score(cards);
    let best = cards.slice(0, 5);
    if (cards.length > 5) {
      const n = cards.length;
      outer:
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let c = b + 1; c < n; c++)
        for (let d = c + 1; d < n; d++) for (let e = d + 1; e < n; e++) {
          const five = [cards[a], cards[b], cards[c], cards[d], cards[e]];
          if (score(five) === s) { best = five; break outer; }
        }
    }
    return { score: s, cat: cat(s), best, name: describe(s), catName: CAT_RU[cat(s)] };
  }

  const compare = (a, b) => Math.sign(score(a) - score(b));

  return { CAT, CAT_RU, score, cat, kickers, describe, evaluate, compare, straightTop };
})();

// ===== 30-equity.js =====
// ===== Equity: exact enumeration / Monte Carlo, preflop hand order =====
const Equity = (() => {
  const choose = (n, k) => {
    if (k < 0 || k > n) return 0;
    let r = 1;
    for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
    return Math.round(r);
  };

  // Equity of known hands. hands: [[c1,c2], ...]; board: 0..5 cards.
  // opts.toCome: board cards still to deal (default 5 - board.length; e.g. 1 = "only the next card")
  // opts.dead: extra removed cards; opts.exactLimit (default 30000 runouts); opts.iters (MC, default 10000)
  // → { eq: [share 0..1], win: [], tie: [], samples, exact }
  function calc(hands, board, opts = {}) {
    const toCome = opts.toCome ?? 5 - board.length;
    const used = new Set([...hands.flat(), ...board, ...(opts.dead || [])]);
    const deck = Cards.deck().filter((c) => !used.has(c));
    const n = hands.length;
    const eq = new Array(n).fill(0), win = new Array(n).fill(0), tie = new Array(n).fill(0);
    const sc = new Array(n);
    const cardsBuf = hands.map((h) => h.concat(board, new Array(toCome).fill(0)));
    const base = 2 + board.length;
    let samples = 0;

    const run = (extra) => {
      let best = -1, nb = 0;
      for (let i = 0; i < n; i++) {
        const buf = cardsBuf[i];
        for (let j = 0; j < toCome; j++) buf[base + j] = extra[j];
        const s = (sc[i] = HandEval.score(buf));
        if (s > best) { best = s; nb = 1; } else if (s === best) nb++;
      }
      for (let i = 0; i < n; i++) if (sc[i] === best) {
        eq[i] += 1 / nb;
        if (nb === 1) win[i]++; else tie[i]++;
      }
      samples++;
    };

    const total = choose(deck.length, toCome);
    const exact = total <= (opts.exactLimit ?? 30000);
    const extra = new Array(toCome);
    if (exact) {
      const rec = (start, depth) => {
        if (depth === toCome) { run(extra); return; }
        for (let i = start; i <= deck.length - (toCome - depth); i++) { extra[depth] = deck[i]; rec(i + 1, depth + 1); }
      };
      rec(0, 0);
    } else {
      const iters = opts.iters ?? 10000;
      const w = deck.slice();
      for (let it = 0; it < iters; it++) {
        for (let j = 0; j < toCome; j++) {
          const k = j + Math.floor(U.rng() * (w.length - j));
          const t = w[j]; w[j] = w[k]; w[k] = t;
          extra[j] = w[j];
        }
        run(extra);
      }
    }
    const d = samples || 1;
    return { eq: eq.map((x) => x / d), win: win.map((x) => x / d), tie: tie.map((x) => x / d), samples, exact };
  }

  // Hero equity vs nOpp unknown hands (Monte Carlo to the river).
  // opts.iters (default 1000), opts.dead, opts.oppFilter(hole, board) → boolean | weight 0..1
  // (rejection sampling, up to 40 tries per opponent; models "hands this opponent would play this way").
  function vsRandom(hole, board, nOpp, opts = {}) {
    if (nOpp <= 0) return 1;
    const iters = opts.iters ?? 1000;
    const filter = opts.oppFilter || null;
    const used = new Set([...hole, ...board, ...(opts.dead || [])]);
    const w = Cards.deck().filter((c) => !used.has(c));
    const toCome = 5 - board.length;
    const heroBuf = hole.concat(board, new Array(toCome).fill(0));
    const oppBuf = new Array(nOpp).fill(0).map(() => [0, 0].concat(board, new Array(toCome).fill(0)));
    const base = 2 + board.length;
    let total = 0;
    const draw = (pos) => {
      const k = pos + Math.floor(U.rng() * (w.length - pos));
      const t = w[pos]; w[pos] = w[k]; w[k] = t;
      return w[pos];
    };
    for (let it = 0; it < iters; it++) {
      let pos = 0;
      for (let o = 0; o < nOpp; o++) {
        let a, b;
        for (let tries = 0; ; tries++) {
          a = draw(pos); b = draw(pos + 1);
          if (!filter || tries >= 40) break;
          const v = filter([a, b], board);
          const wgt = v === true ? 1 : v === false ? 0 : +v || 0;
          if (wgt >= 1 || (wgt > 0 && U.rng() < wgt)) break;
        }
        oppBuf[o][0] = a; oppBuf[o][1] = b;
        pos += 2;
      }
      for (let j = 0; j < toCome; j++) {
        const c = draw(pos++);
        heroBuf[base + j] = c;
        for (let o = 0; o < nOpp; o++) oppBuf[o][base + j] = c;
      }
      const hs = HandEval.score(heroBuf);
      let best = 0, ties = 0;
      for (let o = 0; o < nOpp; o++) {
        const s = HandEval.score(oppBuf[o]);
        if (s > best) { best = s; ties = s === hs ? 1 : 0; } else if (s === best && s === hs) ties++;
      }
      if (hs > best) total += 1;
      else if (hs === best) total += 1 / (ties + 1);
    }
    return total / iters;
  }

  // 169 starting hands, strongest → weakest. Generated by tools/gen-preflop-order.js
  // (average of rank by equity vs 1 and vs 2 random hands).
  const PREFLOP_ORDER = 'AA KK QQ JJ TT 99 88 AKs AQs AJs AKo 77 AQo ATs KQs AJo KJs A9s 66 KQo KTs ATo A8s QJs A7s KJo K9s A9o QTs A6s A5s KTo 55 A8o A4s JTs Q9s QJo A7o K8s A3s QTo K9o A2s K7s A5o A6o J9s Q8s JTo A4o K6s 44 K8o T9s K5s Q9o A3o J8s K4s A2o Q7s K7o J9o Q8o K6o T8s K3s Q6s J7s K5o T9o 33 K2s Q5s Q4s 98s K4o J8o T7s Q7o Q3s J6s T8o K3o 97s J5s Q2s 87s Q6o K2o T6s Q5o 98o J7o J4s J3s 96s 22 Q4o 76s T7o T4s T5s 86s 97o J2s Q3o J6o 95s 85s Q2o J5o T6o 87o T3s 75s J4o T2s 65s 96o J3o 93s 86o 54s 94s J2o T5o 76o 74s 64s 84s T4o 92s 95o T3o 85o 65o 63s 53s 73s T2o 83s 82s 75o 43s 94o 93o 54o 74o 52s 62s 84o 64o 72s 92o 42s 53o 83o 32s 73o 82o 63o 43o 52o 62o 72o 42o 32o'.split(' ');
  const idx = new Map(PREFLOP_ORDER.map((c, i) => [c, i]));
  const cum = [];
  { let acc = 0; for (const c of PREFLOP_ORDER) { acc += Cards.codeCombos(c); cum.push(acc / 1326); } }
  const preflopRank = (code) => idx.get(code);                 // 0 = AA … 168 = worst
  const preflopTopPct = (code) => cum[idx.get(code)];          // share of all 1326 combos at least this strong
  const holeTopPct = (hole) => preflopTopPct(Cards.handCode(hole[0], hole[1]));

  return { choose, calc, vsRandom, PREFLOP_ORDER, preflopRank, preflopTopPct, holeTopPct };
})();

// ===== 40-engine.js =====
// ===== Engine: No-Limit Hold'em hand state machine (pure, synchronous, no DOM) =====
// Chips move between table.players[seat].stack and the hand immediately. Dealing uses deck.pop():
// two hole cards per seat in hand.seats order, then flop (3), turn, river; no burn cards.
const Engine = (() => {
  const POSITIONS = ['UTG', 'UTG+1', 'MP', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  const STREETS = ['preflop', 'flop', 'turn', 'river'];
  const positionNames = (n) => (n === 2 ? ['BTN', 'BB'] : POSITIONS.slice(POSITIONS.length - n));
  const eligible = (p) => !p.busted && p.stack > 0;

  function createTable({ players, sb = 10, bb = 20, button = 0 }) {
    return {
      players: players.map((p, seat) => {
        const name = p.name || 'Игрок ' + (seat + 1);
        return {
          isHuman: false, style: null, baseStyle: null, stack: bb * 100, busted: false, revealed: false,
          avatar: { initials: name.slice(0, 1).toUpperCase(), color: '#64748b' }, hud: { hands: 0, vpip: 0, pfr: 0 },
          ...p, name, seat,
        };
      }),
      button, sb, bb, handNo: 0,
    };
  }

  // Next seat clockwise after `seat` (wrapping; `seat` itself last) where pred(player, seat) holds, else null.
  // Accepts a table or a hand (both carry .players).
  function nextSeat(table, seat, pred = () => true) {
    const P = table.players, n = P.length;
    for (let k = 1; k <= n; k++) {
      const s = (((seat + k) % n) + n) % n;
      if (pred(P[s], s)) return s;
    }
    return null;
  }

  const pot = (hand) => U.sum(hand.committed) - U.sum(hand.returned || []);
  const inHand = (hand, seat) => !!hand.dealt[seat] && !hand.folded[seat];
  const live = (hand) => hand.seats.filter((s) => !hand.folded[s]);
  const canAct = (hand, s) => inHand(hand, s) && !hand.allIn[s];
  // Owes an action: hasn't acted since the last full raise, or hasn't matched the current bet.
  const pending = (hand, s) => canAct(hand, s) && (!hand.acted[s] || hand.bets[s] < hand.currentBet);

  function roundDone(hand) {
    const L = live(hand), actors = L.filter((s) => !hand.allIn[s]);
    if (L.length < 2 || !actors.length) return true;
    // A lone actor who already covers every live bet has nobody left to bet against. Compared with the real bets,
    // not the nominal currentBet: a SB of 10 facing a BB all-in for 5 has nothing to decide.
    if (actors.length === 1 && hand.bets[actors[0]] >= Math.max(...L.map((s) => hand.bets[s]))) return true;
    return !actors.some((s) => pending(hand, s));
  }

  function nextTurn(hand, from) {
    hand.toAct = roundDone(hand) ? null : nextSeat(hand, from, (p, s) => pending(hand, s));
    hand.phase = hand.toAct === null ? 'roundEnd' : 'betting';
  }

  function move(hand, s, add) {
    const p = hand.players[s];
    p.stack -= add; hand.bets[s] += add; hand.committed[s] += add;
    hand.allIn[s] = p.stack === 0;
  }

  function record(hand, s, type, add, facing, potBefore, incomplete = false) {
    const e = { i: hand.log.length, street: hand.street, seat: s, type, add, to: hand.bets[s], allIn: hand.allIn[s],
      incomplete, facing, potBefore, potAfter: pot(hand) };
    hand.log.push(e);
    return e;
  }

  function post(hand, s, type, amount) {
    const before = pot(hand), add = Math.min(amount, hand.players[s].stack);
    move(hand, s, add);
    record(hand, s, type, add, 0, before);
  }

  function startHand(table, opts = {}) {
    const P = table.players, N = P.length;
    const nEligible = P.filter(eligible).length;
    if (nEligible < 2) throw new Error('Engine.startHand: need at least 2 players with chips');
    if (table.handNo > 0 || !P[table.button] || !eligible(P[table.button])) table.button = nextSeat(table, table.button, eligible);
    // Heads-up the button posts the SB, so last hand's BB takes the button: nobody posts the BB twice in a row (TDA).
    // In steady heads-up play this is the normal rotation; it only matters when play becomes heads-up.
    if (nEligible === 2 && P[table.lastBB] && eligible(P[table.lastBB])) table.button = table.lastBB;
    table.handNo++;
    const btn = table.button, seats = [];
    for (let k = 1; k <= N; k++) if (eligible(P[(btn + k) % N])) seats.push((btn + k) % N);
    const hu = seats.length === 2, arr = (v) => new Array(N).fill(v);
    const deck = opts.deck ? opts.deck.slice() : U.shuffle(Cards.deck());
    const hand = {
      no: table.handNo, sb: table.sb, bb: table.bb, button: btn,
      sbSeat: hu ? btn : seats[0], bbSeat: hu ? seats[0] : seats[1],
      dealt: arr(false), seats, order: hu ? [btn, seats[0]] : [...seats.slice(2), ...seats.slice(0, 2)],
      pos: arr(null), hole: arr(null), board: [], deck,
      street: 'preflop', phase: 'betting', toAct: null,
      bets: arr(0), committed: arr(0), returned: arr(0), startStacks: P.map((p) => p.stack),
      folded: arr(false), allIn: arr(false), acted: arr(false),
      currentBet: 0, minRaise: table.bb, lastRaiser: null, raises: 0, potAtStreetStart: 0,
      log: [], result: null, players: P,
    };
    const names = positionNames(seats.length);
    hand.order.forEach((s, i) => { hand.dealt[s] = true; hand.pos[s] = names[i]; });
    for (const s of seats) hand.hole[s] = [deck.pop(), deck.pop()];
    post(hand, hand.sbSeat, 'sb', table.sb);
    post(hand, hand.bbSeat, 'bb', table.bb);
    table.lastBB = hand.bbSeat;
    hand.currentBet = table.bb; // nominal even when the big blind is short: callers owe the full BB
    nextTurn(hand, hand.bbSeat);
    return hand;
  }

  function legal(hand) {
    if (hand.phase !== 'betting' || hand.toAct === null) return null;
    const s = hand.toAct, stack = hand.players[s].stack, myBet = hand.bets[s], maxTo = myBet + stack;
    const owe = Math.max(0, hand.currentBet - myBet);
    const others = hand.seats.some((x) => x !== s && canAct(hand, x));
    // Short all-in raises don't reopen betting for someone who already acted, unless together they add up to a full raise (TDA).
    const canRaise = stack > owe && others && (!hand.acted[s] || owe >= hand.minRaise);
    return {
      seat: s, toCall: Math.min(owe, stack), canFold: true, canCheck: owe === 0, canCall: owe > 0, canRaise,
      minTo: Math.min(hand.currentBet + hand.minRaise, maxTo), maxTo, isBet: hand.currentBet === 0,
      pot: pot(hand), stack, currentBet: hand.currentBet, myBet,
    };
  }

  function act(hand, action = {}) {
    if (hand.phase !== 'betting') throw new Error(`Engine.act: hand phase is '${hand.phase}', nobody can act`);
    const L = legal(hand), s = L.seat, owe = hand.currentBet - L.myBet, before = pot(hand);
    let type = action.type === 'bet' ? 'raise' : action.type, add = 0, incomplete = false;
    if (type === 'raise' && !L.canRaise) type = 'call'; // all-in for no more than the call, or betting not reopened
    if (type === 'call' && !L.canCall) type = 'check';
    if (type === 'fold') hand.folded[s] = true;
    else if (type === 'check') {
      if (!L.canCheck) throw new Error(`Engine.act: seat ${s} cannot check facing a bet of ${owe}`);
    } else if (type === 'call') add = L.toCall;
    else if (type === 'raise') {
      const want = Math.round(+action.to);
      const to = want >= L.maxTo ? L.maxTo : want >= L.minTo ? want : L.minTo; // NaN → min raise
      add = to - L.myBet;
      incomplete = to - hand.currentBet < hand.minRaise;
      if (!incomplete) { hand.minRaise = to - hand.currentBet; hand.acted.fill(false); }
      type = hand.currentBet === 0 ? 'bet' : 'raise';
      hand.currentBet = to; hand.lastRaiser = s; hand.raises++;
    } else throw new Error('Engine.act: unknown action type ' + type);
    if (add) move(hand, s, add);
    hand.acted[s] = true;
    const e = record(hand, s, type, add, owe, before, incomplete);
    nextTurn(hand, s);
    return e;
  }

  // The largest contribution (folded players included) is only called up to the second largest; the rest goes back.
  function returnUncalled(hand) {
    const c = hand.seats.map((s) => [hand.committed[s] - hand.returned[s], s]).sort((a, b) => b[0] - a[0]);
    const amount = c[0][0] - c[1][0], s = c[0][1];
    if (amount <= 0) return null;
    hand.returned[s] += amount; hand.bets[s] -= amount; hand.players[s].stack += amount; hand.allIn[s] = false;
    return { seat: s, amount };
  }

  // Pots split at each all-in level of a live player; folded chips fill the pots they reached.
  function sidePots(hand, L) {
    const paid = (s) => hand.committed[s] - hand.returned[s];
    const levels = [...new Set([...L.filter((s) => hand.allIn[s]).map(paid), Math.max(...L.map(paid))])].sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    levels.forEach((lvl, i) => {
      const cap = i === levels.length - 1 ? Infinity : lvl; // the top pot also takes any dead chips above it
      const amount = U.sum(hand.seats.map((s) => Math.max(0, Math.min(paid(s), cap) - prev)));
      const eligible = L.filter((s) => paid(s) >= lvl);
      const last = pots[pots.length - 1];
      if (last && last.eligible.join() === eligible.join()) last.amount += amount;
      else if (amount > 0) pots.push({ amount, eligible });
      prev = lvl;
    });
    return pots;
  }

  function finish(hand, pots, uncontested) {
    const arr = (v) => new Array(hand.players.length).fill(v);
    const payouts = arr(0), scores = arr(null), names = arr(null), best = arr(null);
    const shown = uncontested ? [] : live(hand);
    for (const s of shown) {
      const ev = HandEval.evaluate(hand.hole[s].concat(hand.board));
      scores[s] = ev.score; names[s] = ev.name; best[s] = ev.best;
    }
    pots.forEach((p, i) => {
      p.name = i === 0 ? 'Основной банк' : 'Побочный банк ' + i;
      const top = Math.max(...p.eligible.map((s) => scores[s]));
      // eligible follows hand.seats (clockwise from the button's left), so odd chips go to the first winners
      p.winners = uncontested ? p.eligible : p.eligible.filter((s) => scores[s] === top);
      const share = Math.floor(p.amount / p.winners.length), odd = p.amount - share * p.winners.length;
      p.winners.forEach((w, k) => { payouts[w] += share + (k < odd ? 1 : 0); });
    });
    hand.players.forEach((p, s) => { p.stack += payouts[s]; });
    hand.bets.fill(0);
    hand.phase = 'done'; hand.toAct = null;
    return (hand.result = {
      uncontested, pots, payouts, returned: hand.returned.slice(),
      net: hand.players.map((p, s) => p.stack - hand.startStacks[s]),
      winners: [...new Set(pots.flatMap((p) => p.winners))], shown, names, best, scores,
    });
  }

  function advance(hand) {
    if (hand.phase !== 'roundEnd') throw new Error(`Engine.advance: hand phase is '${hand.phase}', expected 'roundEnd'`);
    const returned = returnUncalled(hand), L = live(hand);
    if (L.length === 1) return { type: 'uncontested', result: finish(hand, [{ amount: pot(hand), eligible: L }], true), returned };
    if (hand.street === 'river') return { type: 'showdown', result: finish(hand, sidePots(hand, L), false), returned };
    const cards = [];
    for (let k = hand.street === 'preflop' ? 3 : 1; k > 0; k--) cards.push(hand.deck.pop());
    hand.board.push(...cards);
    hand.street = STREETS[STREETS.indexOf(hand.street) + 1];
    hand.bets.fill(0); hand.acted.fill(false);
    Object.assign(hand, { currentBet: 0, minRaise: hand.bb, lastRaiser: null, raises: 0, potAtStreetStart: pot(hand) });
    nextTurn(hand, hand.button); // stays 'roundEnd' when fewer than 2 players can bet (all-in run-out)
    return { type: 'street', street: hand.street, cards, returned };
  }

  function sizeTo(hand, frac) {
    const L = legal(hand);
    return L && U.clamp(Math.round(L.myBet + L.toCall + frac * (L.pot + L.toCall)), L.minTo, L.maxTo);
  }

  return { POSITIONS, positionNames, createTable, startHand, legal, act, advance, pot, sizeTo, inHand, nextSeat };
})();

// ===== 50-bots.js =====
// ===== Bots: styles, names/avatars, decisions (preflop tables + postflop policies), tells =====
const Bots = (() => {
  const STYLE_IDS = ['rock', 'station', 'reg', 'maniac', 'actor'];
  const BASE_STYLES = ['rock', 'station', 'reg', 'maniac'];
  const STYLES = {
    rock: {
      id: 'rock', name: 'Камень', type: 'тайтовый пассивный', vpip: '12–15%', pfr: '8%', postflop: 'Низкая',
      foldToBet: 'Высокий', bluff: 'Почти нет', tells: 'Честные, слабые', foldEquity: 'high',
      desc: 'Играет мало рук и почти не блефует: его ставка или рейз обычно означают сильную руку. Отбирай у него блайнды, а на его крупные ставки сбрасывай всё, кроме очень сильных рук.',
    },
    station: {
      id: 'station', name: 'Коллинг-станция', type: 'лузовый пассивный', vpip: '45–55%', pfr: '5%', postflop: 'Очень низкая',
      foldToBet: 'Очень низкий', bluff: 'Нет', tells: 'Честные, явные', foldEquity: 'none',
      desc: 'Входит в банк с чем попало и платит почти до вскрытия, но сам ставит редко. Не блефуй против него — просто ставь с хорошими руками, он заплатит; его крупный рейз на тёрне или ривере — почти всегда натс.',
    },
    reg: {
      id: 'reg', name: 'Регуляр', type: 'тайтовый агрессивный', vpip: '18–22%', pfr: '15–18%', postflop: 'Высокая',
      foldToBet: 'Средний', bluff: 'Умеренный', tells: 'Почти нет, иногда актёрство', foldEquity: 'medium',
      desc: 'Играет по таблицам: входит в игру рейзом, на флопе продолжает ставкой в 1/2–3/4 банка и иногда блефует. Не плати его крупные ставки средними руками и не пытайся перехитрить его без сильной руки.',
    },
    maniac: {
      id: 'maniac', name: 'Маньяк', type: 'лузовый агрессивный', vpip: '40–50%', pfr: '30%', postflop: 'Очень высокая',
      foldToBet: 'Низкий', bluff: 'Частый', tells: 'Хаотичные', foldEquity: 'low',
      desc: 'Ставит и рейзит почти постоянно, часто идёт олл-ин и много блефует. Не блефуй против него: дай ему ставить самому и плати с хорошими руками.',
    },
    actor: {
      id: 'actor', name: 'Актёр', type: 'любой базовый стиль + актёрство', vpip: 'как базовый', pfr: 'как базовый',
      postflop: 'как базовый', foldToBet: 'как базовый', bluff: 'как базовый', tells: 'Обратные: слабость = сила',
      foldEquity: 'как базовый стиль',
      desc: 'Играет как один из четырёх стилей, но разыгрывает спектакль: вздыхает с сильной рукой и изображает уверенность при блефе. Читай его теллы наоборот.',
    },
  };

  // ---------- names, avatars, lineups ----------
  const NAMES = ['Игорь', 'Олег', 'Марина', 'Светлана', 'Дмитрий', 'Анна', 'Сергей', 'Наталья', 'Артём', 'Ольга', 'Павел', 'Екатерина',
    'Виктор', 'Татьяна', 'Михаил', 'Ирина', 'Алексей', 'Елена', 'Николай', 'Юлия', 'Борис', 'Вера', 'Роман', 'Ксения'];
  // Distinct non-green hues; white initials (the UI's .av) keep ≥ 3.8:1 contrast on each.
  const COLORS = ['#d64545', '#c96a1c', '#a37812', '#a5714f', '#cc2f66', '#c2509d', '#9257d6', '#5765d6', '#2a7fd0', '#14869a', '#667c8e', '#a066ba'];
  const nameIdx = (name) => NAMES.indexOf(String(name).split(' ')[0]);
  const colorOf = (name) => COLORS[Math.max(0, nameIdx(name)) % COLORS.length];

  // Unused name, preferring a colour and initials nobody at the table has yet.
  function pickName(used = []) {
    const taken = new Set(used), ini = new Set(used.map((n) => String(n).slice(0, 2)));
    const cols = new Set(used.filter((n) => nameIdx(n) >= 0).map(colorOf));
    const free = NAMES.filter((n) => !taken.has(n));
    const pool = [free.filter((n) => !cols.has(colorOf(n)) && !ini.has(n.slice(0, 2))), free.filter((n) => !cols.has(colorOf(n))), free]
      .find((a) => a.length);
    if (pool) return U.pick(pool);
    const b = U.pick(NAMES);
    for (let k = 2; ; k++) if (!taken.has(`${b} ${k}`)) return `${b} ${k}`;
  }

  function createBot({ style, baseStyle, usedNames = [] } = {}) {
    if (!STYLE_IDS.includes(style)) style = U.pick(BASE_STYLES);
    const b = style !== 'actor' ? style : BASE_STYLES.includes(baseStyle) ? baseStyle : U.pick(BASE_STYLES);
    const name = pickName(usedNames);
    return { name, isHuman: false, style, baseStyle: b, avatar: { initials: name.slice(0, 2), color: colorOf(name) } };
  }

  // The first five seats get five different styles; extra seats lean to the common live-table types.
  const EXTRA = ['rock', 'station', 'reg', 'rock', 'station', 'reg', 'maniac', 'actor'];
  function randomLineup(n) {
    const out = U.shuffle(STYLE_IDS.slice()).slice(0, n);
    while (out.length < n) {
      const s = U.pick(EXTRA);
      if (s !== 'actor' || out.filter((x) => x === 'actor').length < 2) out.push(s);
    }
    return U.shuffle(out);
  }

  const base = (p) => (p && BASE_STYLES.includes(p.baseStyle) ? p.baseStyle : p && BASE_STYLES.includes(p.style) ? p.style : 'reg');
  const foldEquity = (p) => STYLES[base(p)].foldEquity;

  // ---------- hand analysis ----------
  // Number of score nibbles that define each category (the rest are kickers): pair → 1, two pair → 2, flush → 5 …
  const PRIMARY = [5, 1, 2, 1, 1, 5, 2, 1, 1];
  const key = (s) => s >> (4 * (5 - PRIMARY[s >> 20]));
  const maskOf = (cards) => cards.reduce((m, c) => m | (1 << Cards.rank(c)), 0);
  const suitMax = (cards) => Math.max(0, ...[0, 1, 2, 3].map((s) => cards.filter((c) => Cards.suit(c) === s).length));
  function runMax(cards) { // most distinct ranks inside one 5-rank window (straight potential)
    let m = maskOf(cards), best = 0;
    if (m & (1 << 14)) m |= 2;
    for (let lo = 1; lo <= 10; lo++) {
      let k = 0;
      for (let r = lo; r < lo + 5; r++) if (m & (1 << r)) k++;
      best = Math.max(best, k);
    }
    return best;
  }
  // New board cards bring an overcard (> over), a third/fourth card of a suit or a more connected board.
  const scaryBoard = (prev, board, over) => board.slice(prev.length).some((c) => Cards.rank(c) > over)
    || (suitMax(board) >= 3 && suitMax(board) > suitMax(prev)) || (runMax(board) >= 3 && runMax(board) > runMax(prev));

  // → { cls, made, cat, fd, sOuts (ranks completing a straight), outs, pair, pairRank, topPair (top pair or overpair),
  //     aceHigh, over (two overcards) }
  function analyze(hole, board) {
    const s = HandEval.score(hole.concat(board)), cat = s >> 20;
    const [h1, h2] = hole.map(Cards.rank);
    const br = [...new Set(board.map(Cards.rank))].sort((a, b) => b - a);
    let made = 'none', pairRank = 0;
    if (cat > 0 && key(s) !== key(HandEval.score(board))) { // the hole cards change the made hand, not just kickers
      const p1 = (s >> 16) & 15, p2 = (s >> 12) & 15, mine = (r) => r === h1 || r === h2;
      if (cat >= 3 || (cat === 2 && h1 !== h2 && mine(p1) && mine(p2))) made = 'strong';
      else if (h1 === h2) { // an underpair ranks like a board pair: under the second board card = weak
        pairRank = h1;
        made = h1 > br[0] ? (h1 >= 12 ? 'strong' : 'medium') : h1 > (br[1] || 0) ? 'medium' : 'weak';
      } else {
        pairRank = Math.max(...[h1, h2].filter((r) => br.includes(r)));
        const kicker = pairRank === h1 ? h2 : h1;
        made = pairRank === br[0] ? (kicker >= 13 ? 'strong' : 'medium') : pairRank === br[1] ? 'medium' : 'weak';
      }
    }
    let fd = false, sOuts = 0;
    if (board.length < 5) {
      const all = hole.concat(board);
      for (let su = 0; su < 4; su++) {
        if (all.filter((c) => Cards.suit(c) === su).length === 4 && hole.some((c) => Cards.suit(c) === su)) fd = true;
      }
      const mAll = maskOf(all), mB = maskOf(board), cur = HandEval.straightTop(mAll);
      for (let x = 2; x <= 14; x++) {
        if (mAll & (1 << x)) continue;
        const t = HandEval.straightTop(mAll | (1 << x));
        if (t > cur && t > HandEval.straightTop(mB | (1 << x))) sOuts++;
      }
    }
    const outs = (fd ? 9 : 0) + 4 * sOuts - (fd ? sOuts : 0);
    const cls = made === 'strong' || made === 'medium' ? made : board.length < 5 && (fd || sOuts >= 2) ? 'draw' : 'bluff';
    return { cls, made, cat, fd, sOuts, outs, pair: made !== 'none', pairRank, topPair: pairRank > 0 && pairRank >= br[0],
      aceHigh: made === 'none' && (h1 === 14 || h2 === 14), over: made === 'none' && Math.min(h1, h2) > br[0] };
  }

  function classifyHolding(hole, board) {
    if (board.length >= 3) return analyze(hole, board).cls;
    const t = Equity.holeTopPct(hole); // preflop fallback
    return t <= 0.025 ? 'strong' : t <= 0.1 || Cards.rank(hole[0]) === Cards.rank(hole[1]) ? 'medium' : 'bluff';
  }

  // Share of opponent holdings the current hand beats right now (exact, ties = ½).
  function handStrength(hole, board) {
    const me = HandEval.score(hole.concat(board)), used = new Set(hole.concat(board));
    const rest = Cards.deck().filter((c) => !used.has(c)), buf = [0, 0, ...board];
    let w = 0, n = 0;
    for (let i = 0; i < rest.length; i++) for (let j = i + 1; j < rest.length; j++) {
      buf[0] = rest[i]; buf[1] = rest[j];
      const o = HandEval.score(buf);
      w += o < me ? 1 : o === me ? 0.5 : 0; n++;
    }
    return w / n;
  }

  // ---------- actions ----------
  const FOLD = { type: 'fold' }, CHECK = { type: 'check' }, CALL = { type: 'call' }, ALLIN = { type: 'raise', to: Infinity };
  const to = (x) => ({ type: 'raise', to: x });
  const potBet = (L, frac) => to(L.myBet + L.toCall + frac * (L.pot + L.toCall));
  const rnd = (a, b) => a + U.rng() * (b - a);

  // Intent → legal engine action: live-like round bets (multiples of 5, of 25 over 1000), never below minTo, no crumbs
  // left behind, no free folds.
  function legalize(a, L) {
    if (a.type === 'raise') {
      if (!L.canRaise) return L.toCall > 0 ? CALL : CHECK;
      const step = Math.max(a.to, L.minTo) > 1000 ? 25 : 5;
      let t = Math.round(a.to / step) * step;
      if (t < L.minTo) t = Math.ceil(L.minTo / step) * step;
      if (t >= L.maxTo || L.maxTo - t < 0.3 * (L.pot + 2 * t - L.myBet - L.currentBet)) t = L.maxTo;
      return { type: 'raise', to: t };
    }
    if (a.type === 'call') return L.toCall > 0 ? CALL : CHECK;
    return L.canCheck ? CHECK : FOLD;
  }

  // ---------- preflop ----------
  const RG = (s) => Cards.parseRange(s);
  const OPEN = { // ТЗ 6.1 (the reg plays these exactly); SB and BB use the CO range
    UTG: RG('77+, AJs+, AQo+, KQs'),
    MP: RG('55+, ATs+, AJo+, KJs+, QJs, JTs, KQo'),
    HJ: RG('22+, A9s+, ATo+, KTs+, QTs+, JTs, T9s, KJo+'),
    CO: RG('22+, A2s+, A9o+, K9s+, Q9s+, J9s+, T9s, 98s, 87s, KTo+, QTo+, JTo'),
    BTN: RG('22+, A2s+, A7o+, K7s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, K9o+, Q9o+, J9o+, T9o'),
  };
  OPEN['UTG+1'] = OPEN.UTG; OPEN.LJ = OPEN.MP; OPEN.SB = OPEN.BB = OPEN.CO;
  // One step below each range component (66 for 77+, ATs for AJs+): ТЗ 6.3 counts these as "acceptable".
  const BORDER = {};
  for (const pos in OPEN) {
    BORDER[pos] = new Set(Cards.HAND_CODES.filter((c) => {
      if (OPEN[pos].has(c)) return false;
      const { hi, lo, type } = Cards.codeInfo(c), up = Cards.rankChar(lo + 1);
      return type === 'p' ? OPEN[pos].has(up + up) : lo + 1 < hi && OPEN[pos].has(c[0] + up + type);
    }));
  }
  const PREMIUM = RG('QQ+, AK');
  const REG_CALL = RG('JJ-22, AQs, AJs, KQs');
  const SMALL_PAIRS = RG('66-22');
  const CONNECTORS = RG('76s, 87s, 98s, T9s, JTs, QJs');
  const LIGHT_3B = RG('A5s-A2s, 65s, 76s, 87s, 98s, T9s');
  const ROCK_CALL = RG('JJ-99, AQ, AJs, ATs, KQ, KJs, QJs, JTs');
  const ROCK_4B = RG('KK+, AK');
  const PAIRS = RG('22+');
  // ponytail: per-position "top X% of hands" thresholds (Equity.holeTopPct), calibrated with tools/sim-bots.js on
  // random all-bot lineups; re-run it after changing any number here.
  // The rock opens the ТЗ 6.1 table cut to its top X% (always a subset: "Камень — уже").
  const ROCK_OPEN = { UTG: 0.08, 'UTG+1': 0.08, MP: 0.08, LJ: 0.08, HJ: 0.12, CO: 0.15, BTN: 0.2, SB: 0.14 };
  const REG_ISO = { 'UTG+1': 0.14, MP: 0.2, LJ: 0.22, HJ: 0.26, CO: 0.33, BTN: 0.4, SB: 0.3 }; // tight early, wide late
  const SPECULATIVE = RG('22+, A2s+, 54s, 65s, 76s, 87s, 98s, T9s, JTs, QJs, KQs'); // over-limp material
  const STATION_LIMP = { UTG: 0.5, 'UTG+1': 0.5, MP: 0.55, LJ: 0.55, HJ: 0.6, CO: 0.65, BTN: 0.7, SB: 0.75 };
  const MANIAC_OPEN = { UTG: 0.45, 'UTG+1': 0.45, MP: 0.45, LJ: 0.36, HJ: 0.38, CO: 0.43, BTN: 0.52, SB: 0.5, BB: 0.3 };
  const PUSH = { UTG: 0.1, 'UTG+1': 0.11, MP: 0.13, LJ: 0.15, HJ: 0.18, CO: 0.22, BTN: 0.3, SB: 0.35, BB: 0.3 };
  const WIDE_3B = RG('77+, A9+, A8s-A7s, KJ+, KTs, QJ, QTs, JTs, T9s');                // vs loose / steal raisers
  const WIDE_CALL = RG('66-22, A6s-A2s, K8s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 76s, 65s, 54s, KTo+, QTo+, JTo');

  function preInfo(table, hand, seat, L) {
    const hole = hand.hole[seat], bb = hand.bb, pos = hand.pos[seat];
    const log = hand.log.filter((e) => e.street === 'preflop');
    const raises = log.filter((e) => e.type === 'raise' || e.type === 'bet');
    const last = raises[raises.length - 1];
    const firstI = raises.length ? log.indexOf(raises[0]) : log.length;
    const others = hand.seats.filter((s) => s !== seat && !hand.folded[s]);
    return {
      L, bb, pos, code: Cards.handCode(hole[0], hole[1]), top: Equity.holeTopPct(hole),
      nRaises: raises.length,
      limpers: log.slice(0, firstI).filter((e) => e.type === 'call').length,
      callers: last ? log.slice(log.indexOf(last) + 1).filter((e) => e.type === 'call').length : 0,
      raiseBB: hand.currentBet / bb,
      // a maniac or a steal from late position: worth 3-betting/calling lighter
      wide: !!last && (base(table.players[last.seat]) === 'maniac' || ['CO', 'BTN', 'SB'].includes(hand.pos[last.seat])),
      eff: Math.min(hand.startStacks[seat], Math.max(0, ...others.map((s) => hand.startStacks[s]))) / bb,
      shove: !!last && hand.allIn[last.seat],
      ip: last ? hand.seats.indexOf(seat) > hand.seats.indexOf(last.seat) : pos !== 'SB' && pos !== 'BB',
      late: pos === 'CO' || pos === 'BTN',
      allin: L.toCall >= 0.4 * L.stack || !L.canRaise, // calling is (nearly) a stack decision
    };
  }
  const reraise = (f, mult) => to(f.L.currentBet * (mult + f.callers));
  const odds = (L) => L.toCall / (L.pot + L.toCall);
  // Calling (nearly) all-in: the style's range `t`, a little wider when the price is good.
  const commit = (f, t) => (f.top <= t || f.top <= 2 * (0.4 - odds(f.L)) ? CALL : FOLD);
  // A short stack's shove: against such a wide range almost any hand calls at odds ≤ 0.25 and almost none
  // at ≥ 0.45 (k = how loosely the style calls).
  const cheapShove = (f, k) => f.shove && f.top <= k * 4 * (0.45 - odds(f.L));

  // Short stack (or only short opponents left): push or fold. k widens/narrows the position push ranges,
  // ck is the style's looseness when calling a cheap shove.
  function shortStack(f, k, ck) {
    const t = PUSH[f.pos] * k;
    if (f.nRaises === 0) return f.top <= t ? ALLIN : f.L.canCheck ? CHECK : FOLD;
    return f.top <= t / 3 || cheapShove(f, ck) ? ALLIN : FOLD;
  }

  const PRE = {
    reg(f) {
      const { L, code, pos, nRaises, bb, top } = f;
      if (f.eff <= 12) return shortStack(f, 1, 1);
      if (f.allin) return PREMIUM.has(code) ? CALL : commit(f, f.wide ? 0.05 : 0);
      if (nRaises === 0) {
        // ТЗ 6.1: BB raises a lone SB limp with the CO range; otherwise the position table exactly, behind limpers
        // too (raise to isolate), where speculative hands may over-limp in late position — as the coach teaches.
        if (L.canCheck) return (f.limpers <= 1 ? OPEN.BB.has(code) : top <= 0.12) ? to(bb * (3 + f.limpers)) : CHECK;
        const iso = f.limpers && top <= REG_ISO[pos]; // limpers are usually weak: isolate a bit wider than the table
        if (OPEN[pos].has(code) || (BORDER[pos].has(code) && U.chance(f.late || pos === 'SB' ? 1 : 0.5)) || iso) return to(bb * (2.5 + f.limpers));
        return f.limpers && (f.late || pos === 'SB') && SPECULATIVE.has(code) ? CALL : FOLD;
      }
      if (nRaises === 1) {
        // 3-bet: premiums; vs a loose raiser or with callers in between (squeeze) a wider value range; some light ones
        if (PREMIUM.has(code) || ((f.wide || f.callers) && WIDE_3B.has(code)) || (f.ip && LIGHT_3B.has(code) && U.chance(0.5))) return reraise(f, f.ip ? 3 : 3.5);
        if ((REG_CALL.has(code) && (!SMALL_PAIRS.has(code) || f.eff >= 20 * f.raiseBB)) || (f.late && CONNECTORS.has(code))) return CALL;
        if ((f.wide && WIDE_CALL.has(code)) || (pos === 'BB' && f.raiseBB <= 4 && top <= 0.3)) return CALL; // defend the BB
        return FOLD;
      }
      if (!PREMIUM.has(code)) return FOLD;
      if (code === 'AA' || code === 'KK') return nRaises === 2 ? reraise(f, 2.3) : ALLIN;
      return nRaises === 2 && U.chance(0.4) ? reraise(f, 2.3) : CALL;
    },
    rock(f) {
      const { L, code, pos, nRaises, top, bb } = f;
      if (f.eff <= 12) return shortStack(f, 0.6, 0.6);
      if (f.allin) return ROCK_4B.has(code) ? CALL : commit(f, 0);
      if (nRaises === 0) {
        if (L.canCheck) return top <= 0.05 ? to(bb * (3 + f.limpers)) : CHECK;
        if (OPEN[pos].has(code) && top <= ROCK_OPEN[pos]) return to(bb * (3 + f.limpers));
        // passive: over-limps hoping to hit, limps pairs for a cheap set
        if (f.limpers && top <= 0.2) return CALL;
        return PAIRS.has(code) || ((f.late || pos === 'SB') && top <= 0.22) ? CALL : FOLD;
      }
      if (nRaises === 1) {
        if (PREMIUM.has(code)) return reraise(f, 3);
        if (ROCK_CALL.has(code)) return CALL;
        if (PAIRS.has(code) && f.raiseBB <= 5 && f.eff >= 20 * f.raiseBB) return CALL; // set-mining
        if (pos === 'BB' && f.raiseBB <= 3 && top <= 0.2) return CALL; // defends the big blind passively
        return FOLD;
      }
      if (!ROCK_4B.has(code)) return FOLD;
      if (code === 'AA' || code === 'KK') return nRaises === 2 ? reraise(f, 2.3) : ALLIN;
      return CALL;
    },
    station(f) {
      const { L, code, pos, nRaises, top, bb } = f;
      // No push/fold when short: a station stays loose and passive at any depth (it just shoves its few raises).
      if (nRaises === 0) {
        if (top <= 0.08) return f.eff <= 10 ? ALLIN : to(bb * (3 + f.limpers));
        if (L.canCheck) return CHECK;
        return top <= STATION_LIMP[pos] ? CALL : FOLD;
      }
      if ((code === 'AA' || code === 'KK') && U.chance(0.6)) return f.allin ? ALLIN : reraise(f, 3);
      const t = (nRaises === 1 ? 0.5 : 0.12) * (f.raiseBB <= 5 ? 1 : f.raiseBB <= 10 ? 0.5 : f.raiseBB <= 25 ? 0.25 : 0.15);
      return top <= t || cheapShove(f, 1.6) ? CALL : FOLD;
    },
    maniac(f) {
      const { L, nRaises, top, bb, pos } = f;
      if (f.eff <= 15) return shortStack(f, 1.6, 1.3);
      if (f.allin) return commit(f, 0.12);
      const size = () => to(bb * (U.pick([3, 3.5, 4, 5]) + f.limpers));
      if (nRaises === 0) {
        if (L.canCheck) return top <= MANIAC_OPEN.BB && U.chance(0.7) ? size() : CHECK;
        if (top <= MANIAC_OPEN[pos]) return top <= 0.03 && U.chance(0.2) ? ALLIN : size();
        if (top <= MANIAC_OPEN[pos] + 0.12 || (pos === 'SB' && U.chance(0.5))) return CALL;
        return FOLD;
      }
      if (nRaises === 1) {
        if (top <= 0.18) return top <= 0.03 && U.chance(0.25) ? ALLIN : reraise(f, rnd(3, 4));
        return top <= 0.4 * (f.raiseBB <= 6 ? 1 : 0.5) ? CALL : FOLD;
      }
      if (top <= 0.05) return ALLIN;
      return top <= (nRaises === 2 ? 0.2 : 0.1) ? CALL : FOLD;
    },
  };

  // ---------- postflop ----------
  const memo = new WeakMap(); // hand → { 'seat:boardLen': { eq, hs } } (a bot may act several times per street)

  function postInfo(hand, seat, L, human) {
    const hole = hand.hole[seat], board = hand.board, a = analyze(hole, board);
    const opps = hand.seats.filter((s) => s !== seat && !hand.folded[s]);
    let m = memo.get(hand);
    if (!m) memo.set(hand, (m = {}));
    const k = seat + ':' + board.length;
    const e = m[k] || (m[k] = { eq: Equity.vsRandom(hole, board, opps.length, { iters: 300 }), hs: handStrength(hole, board) });
    const aggr = hand.log.filter((x) => x.street === hand.street && (x.type === 'bet' || x.type === 'raise'));
    const pre = hand.log.filter((x) => x.street === 'preflop' && x.type === 'raise');
    const live = hand.seats.filter((s) => !hand.folded[s] && !hand.allIn[s]);
    const prev = board.slice(0, board.length - 1);
    const bettor = aggr.length ? aggr[aggr.length - 1].seat : null;
    const la = human && human.lastAction;
    return {
      L, a, cls: a.cls, eq: e.eq, hs: e.hs, nuts: a.cls === 'strong' && e.hs >= 0.97,
      nOpp: opps.length, street: hand.street, river: board.length === 5,
      bf: L.toCall / Math.max(1, L.pot - L.toCall), odds: L.toCall / (L.pot + L.toCall),
      spr: L.stack / Math.max(1, L.pot),
      pfr: pre.length > 0 && pre[pre.length - 1].seat === seat,
      ip: live[live.length - 1] === seat,
      scary: board.length > 3 && scaryBoard(prev, board, Math.max(...prev.map(Cards.rank))),
      slow: !!(la && bettor === human.seat && la.street === hand.street && (la.type === 'bet' || la.type === 'raise')
        && la.thinkMs > (human.avgThinkMs || 0) + 2000),
    };
  }

  const POST = {
    rock(f) {
      const { L, cls, bf } = f;
      if (!L.toCall) { // passive = rarely bluffs, not "checks its good hands": value bets small, almost always
        const cb = f.pfr && f.street === 'flop'; // its preflop raise was strength: a small c-bet, sometimes with AK-high
        const p = cls === 'strong' ? 0.9 : cls === 'medium' ? (f.a.topPair ? 0.7 : 0.25) * (f.nOpp > 1 ? 0.7 : 1)
          : cb && f.nOpp === 1 ? 0.35 : cls === 'draw' ? 0.06 : 0.02;
        return U.chance(p) ? potBet(L, rnd(0.33, 0.5)) : CHECK;
      }
      if (f.nuts && L.canRaise) {
        if (f.street !== 'flop') return U.chance(0.6) ? potBet(L, rnd(0.8, 1.1)) : CALL; // big late raise = nuts
        return U.chance(0.35) ? potBet(L, 0.5) : CALL;
      }
      if (cls === 'strong') return bf > 1.2 && f.hs < 0.85 && U.chance(0.5) ? FOLD : CALL;
      if (cls === 'medium') { // a nit, not a fool: top pair / an overpair calls up to half pot; weaker pairs give up
        if (f.a.topPair && bf <= 0.5) return U.chance(f.nOpp > 1 ? 0.6 : 0.75) ? CALL : FOLD;
        return U.chance((bf <= 0.4 ? 0.6 : bf <= 0.75 ? 0.2 : 0.03) * (f.nOpp > 1 ? 0.6 : 1)) ? CALL : FOLD;
      }
      if (cls === 'draw') return bf <= 0.4 && f.eq >= f.odds ? CALL : FOLD;
      return FOLD;
    },
    station(f) {
      const { L, cls, bf, a } = f;
      if (!L.toCall) {
        // stabs small with any pair (a calling station's "blocking" lead), never bluffs
        // (not when short: a crumb-sized stack turns the stab into an all-in, and its big bets must stay near-nuts)
        const p = cls === 'strong' ? (f.nuts ? 0.5 : 0.4) : a.pair && f.spr > 2 ? 0.3 : 0;
        return U.chance(p) ? potBet(L, rnd(0.3, 0.45)) : CHECK;
      }
      if (f.nuts && L.canRaise && U.chance(0.55)) return potBet(L, f.street === 'flop' ? 0.5 : rnd(1, 1.3)); // monsters: big later
      if (cls !== 'bluff' || a.pair || (a.sOuts === 1 && !f.river)) return CALL;
      if ((a.aceHigh || a.over) && bf <= 0.75) return U.chance(f.river ? 0.5 : 0.9) ? CALL : FOLD;
      // pure air: sticky on the flop, but big turn/river bets get through (none at all: a river bet of ¾ pot or more)
      if (f.street === 'flop') return U.chance(0.45) ? CALL : FOLD;
      return U.chance(f.river ? (bf < 0.75 ? 0.12 * (1 - bf) : 0) : 0.3 * Math.max(0, 1 - bf)) ? CALL : FOLD;
    },
    reg(f) {
      const { L, cls, bf, a, street } = f;
      const size = () => potBet(L, rnd(0.5, 0.75));
      if (!L.toCall) {
        if (street === 'flop' && f.pfr) { // continuation bet
          const p = { strong: 0.9, medium: 0.75, draw: 0.8, bluff: f.nOpp > 2 ? 0.35 : 0.65 }[cls];
          return U.chance(p) ? size() : CHECK;
        }
        if (cls === 'strong') return U.chance(0.85) ? (f.nuts && f.river ? potBet(L, rnd(0.75, 1)) : size()) : CHECK;
        if (cls === 'medium') return U.chance(f.a.topPair ? (f.river ? 0.45 : 0.6) : f.river ? 0.15 : 0.3) ? potBet(L, 0.5) : CHECK;
        if (cls === 'draw') return U.chance(a.outs >= 12 ? 0.7 : 0.5) ? size() : CHECK; // semi-bluff
        if (f.nOpp > 2) return CHECK;
        if (street === 'flop') return f.ip && f.nOpp === 1 && U.chance(0.3) ? potBet(L, 0.5) : CHECK;
        return U.chance((f.scary ? 0.4 : 0.25) * (f.ip ? 1 : 0.75)) ? size() : CHECK; // bluff turns/rivers, more on scary cards
      }
      if (f.nuts && L.canRaise) return U.chance(0.65) ? potBet(L, rnd(0.75, 1)) : CALL;
      if (cls === 'strong') {
        if (L.canRaise && U.chance(street === 'flop' ? 0.35 : 0.2)) return size();
        return bf > 1 && f.hs < 0.8 && U.chance(0.4) ? FOLD : CALL;
      }
      if (cls === 'medium') {
        let p = bf <= 0.55 ? 0.95 : bf <= 0.85 ? 0.65 : 0.3;
        if (f.nOpp > 1) p *= 0.75;
        if (f.slow) p *= 0.4; // a long think before a bet usually means strength
        return f.eq >= f.odds * 0.8 && U.chance(p) ? CALL : FOLD;
      }
      if (cls === 'draw') {

      return !f.river && f.nOpp === 1 && bf <= 0.6 && (a.over || a.aceHigh || a.sOuts) && U.chance(0.4) ? CALL : FOLD;

    maniac(f) {

      if (!L.toCall) return U.chance({ strong: 0.9, medium: 0.75, draw: 0.85, bluff: 0.65 }[cls]) ? big() : CHECK;
      if (cls === 'strong') return L.canRaise && U.chance(0.65) ? big() : CALL;
      if (cls === 'medium') return L.canRaise && U.chance(0.4) ? big() : bf > 1.5 && U.chance(0.3) ? FOLD : CALL;
      if (cls === 'draw') return L.canRaise && U.chance(0.5) ? big() : CALL;

    if (preflop && action.type === 'fold') return U.randInt(400, 800);
    let ms = U.randInt(700, 1600);
    if (style === 'rock' || style === 'station') {
      if (aggressive && strong) ms += U.randInt(900, 1800);
      else if (easy) ms *= 0.6;
    } else if (style === 'reg') ms = U.randInt(1100, 1700);
    else if (style === 'maniac') ms = U.randInt(450, 3200);
    else if (style === 'actor') {
      if (strong) ms = U.randInt(450, 900);
      else if (aggressive) ms += U.randInt(1200, 2000);

  // decision sees that capped pot, not the shover's whole stack (as Coach does for the hero).
  function capPot(hand, seat, L) {
    if (L.toCall >= L.currentBet - L.myBet) return L;
    const paid = (s) => hand.committed[s] - ((hand.returned && hand.returned[s]) || 0), lim = paid(seat) + L.toCall;
    return { ...L, pot: hand.seats.reduce((a, s) => a + Math.min(paid(s), lim), 0) };
  }

    const L = capPot(hand, seat, legal || Engine.legal(hand)), p = table.players[seat], st = base(p);
    let intent, strong;
    if (hand.street === 'preflop') {
      const f = preInfo(table, hand, seat, L);
      intent = PRE[st](f);
      strong = f.top <= 0.05;
    } else {
      const f = postInfo(hand, seat, L, human);
      intent = POST[st](f);
      if (intent === FOLD && f.bf <= 0.2 && f.eq >= 2.5 * f.odds) intent = CALL; // a tiny bet never buys the pot
      strong = f.cls === 'strong';

  const CHAT = ['«Кто-нибудь смотрел вчера футбол?»', '«Эх, сейчас бы кофе…»', '«А долго ещё до перерыва?»',
    '«Хорошая сегодня погода, правда?»', '«Кстати, где тут можно нормально поужинать?»'];

  const TELLS = {
    glance: { shown: 'strength', subtle: ['бросает быстрый взгляд на свои фишки', 'взгляд на фишки'],

    freeze: { shown: 'strength', subtle: ['на секунду задерживает дыхание', 'задерживает дыхание'],

    quiet: { shown: 'strength', subtle: ['перестаёт болтать и замолкает', 'замолкает'],

    lookaway: { shown: 'weakness', subtle: ['безразлично отводит взгляд в сторону', 'смотрит в сторону'],

    chatter: { shown: 'weakness', subtle: ['начинает болтать с соседом', null], obvious: ['начинает громко болтать со всеми подряд', null] },
    shrug: { shown: 'weakness', subtle: ['едва заметно пожимает плечами', 'пожимает плечами'],

  // Acting: a strong hand plays weak (sigh), a weak hand plays strong (smile / chip toss).
  function acted(seat, truth, street, onBet = false) {
    if (truth === 'strong') {
      return { seat, shown: 'weakness', truth, acting: true, random: false, anim: 'sigh',
        text: onBet ? 'ставит с тяжёлым демонстративным вздохом' : 'демонстративно вздыхает',
        bubble: onBet ? '«Ну ладно, поставлю…»' : street === 'flop' ? '«Ну и флоп…»' : '«Ну и карта…»',
        meaning: 'показная слабость часто скрывает сильную руку' };
    }
    const toss = U.chance(0.5);
    return { seat, shown: 'strength', truth, acting: true, random: false, anim: toss ? 'toss' : 'smile',
      text: toss ? (onBet ? 'с вызовом бросает фишки в банк' : 'с вызовом поигрывает фишками') : 'показно улыбается и уверенно смотрит на соперников',
      bubble: toss ? (onBet ? 'бросает фишки' : 'играет фишками') : 'улыбается',
      meaning: onBet ? 'показная уверенность при ставке часто прикрывает блеф' : 'показная уверенность часто прикрывает слабую руку' };
  }
  // The style's way of showing a strong or weak change of its hand.
  function show(style, seat, truth, street) {
    const shown = truth === 'strong' ? 'strength' : 'weakness';

      case 'station': return honest(seat, shown, truth, street, 'obvious');
      case 'reg': return U.chance(0.5) ? acted(seat, truth, street) : honest(seat, shown, truth, street, 'subtle');
      case 'maniac': return honest(seat, U.chance(0.5) ? 'strength' : 'weakness', truth, street, 'obvious', { random: true });

  // truth drawn as often as real ones come: only ~1 in 9 street events really makes a hand strong (measured with all-bot
  // games for every style), so a 50/50 draw would swamp the rare real "strength" tells. This way about 85% of each
  // signal stays true.
  const NOISE_STRONG = 0.12;

  // How the new card(s) changed the bot's holding: 'strong' | 'weak' | 'neutral'.
  function streetTruth(hole, prev, board) {
    const pair = Cards.rank(hole[0]) === Cards.rank(hole[1]);
    const before = prev.length >= 3 ? analyze(hole, prev) : { cls: pair ? 'medium' : 'bluff', cat: pair ? 1 : 0 };
    const after = analyze(hole, board);

    if (after.cls === 'bluff' || (before.cls === 'strong' && after.cls === 'medium')) return 'weak';
    if (after.cls === 'medium' && scaryBoard(prev, board, after.pairRank)) return 'weak';
    return 'neutral';
  }

  const SHOW = { rock: 0.45, station: 0.85, reg: 0.15, maniac: 0.6, actor: 0.8 };

  function streetReaction({ table, hand, seat, newCards = [] } = {}) {
    const p = table.players[seat], hole = hand.hole[seat];
    if (!p || p.isHuman || !hole || hand.folded[seat] || hand.board.length < 3) return null;
    const fresh = new Set(newCards), street = hand.street;

    if (truth === 'neutral') return U.chance(0.13) ? noise(p.style, seat, truth, street) : null; // mostly nothing to show
    return U.chance(0.13) ? noise(p.style, seat, truth, street) : show(p.style, seat, truth, street);
  }

  // Occasional tell right after the bot's own bet/raise; like street tells, some show a made-up holding (noise).
  function betReaction({ table, hand, seat, entry } = {}) {
    const p = table.players[seat], hole = hand.hole[seat];
    if (!p || p.isHuman || !hole || !entry || (entry.type !== 'bet' && entry.type !== 'raise') || hand.board.length < 3) return null;
    const a = analyze(hole, hand.board), truth = a.cls === 'strong' ? 'strong' : a.cls === 'medium' ? 'neutral' : 'weak';
    if (p.style === 'maniac') return U.chance(0.2) ? { ...acted(seat, U.chance(0.5) ? 'strong' : 'weak', hand.street, true), truth, acting: false, random: true } : null;
    const fake = U.chance(0.15), t = fake ? U.pick(['strong', 'weak']) : truth; // the holding the tell is about

    if ((p.style === 'rock' || p.style === 'station') && monster && U.chance(p.style === 'rock' ? 0.25 : 0.5)) {
      const subtle = p.style === 'rock';
      r = { seat, shown: 'strength', truth, acting: false, random: false, anim: 'tremble',
        text: subtle ? 'ставит, и пальцы едва заметно дрожат' : 'ставит фишки, и руки заметно дрожат',
        bubble: 'руки дрожат', meaning: 'дрожь в руках при ставке часто выдаёт очень сильную руку — так волнуются, а не блефуют' };
    } else if (p.style === 'actor' && t !== 'neutral' && U.chance(t === 'weak' ? 0.6 : 0.3)) r = acted(seat, t, hand.street, true);
    else if (p.style === 'reg' && t !== 'neutral' && U.chance(0.04)) r = acted(seat, t, hand.street, true);
    return r && fake ? { ...r, truth, acting: false, random: true } : r;
  }

  // classifyHolding, measured with tools/sim-bots.js (25k + 25k hands, 9- and 6-max); re-measure after changing
  // the policies or classifyHolding.
  const READ_PROFILE = {
    rock: { strong: 0.98, medium: 0.02, draw: 0, bluff: 0 },
    station: { strong: 0.97, medium: 0.03, draw: 0, bluff: 0 },
    reg: { strong: 0.46, medium: 0.11, draw: 0.1, bluff: 0.33 },
    maniac: { strong: 0.13, medium: 0.23, draw: 0.09, bluff: 0.55 },
  };

  return {
    STYLE_IDS, BASE_STYLES, STYLES, NAMES, createBot, randomLineup, decide, streetReaction, betReaction,
    classifyHolding, READ_PROFILE, foldEquity, base,
  };
})();

    const pot = U.sum(prior.map((e) => e.add || 0)), call = Math.min(toCall, stack);
