  const date = (ts) => new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const style = (id) => STYLE_KEYS.map((k, i) => { const v = opt(() => Bots.STYLES[id][k]); return typeof v === 'string' && v ? v : STYLE_ROWS[id][i]; });
  const group = (p) => opt(() => Ranges.POS_INFO[p].group) || GROUP[p];
  const openText = (p) => opt(() => Ranges.OPEN_TEXT[p]) || OPEN[p];
  const rule4 = (o) => o * 4 - Math.max(0, o - 8);
  const isRed = (s) => s === '♥' || s === '♦';
  // Russian typography: one-letter words stick to the next word, a dash to the previous one.
  const typo = (html) => html.replace(/(?<=^|[\s>(«])([вксуоиаВКСУОИА]) /g, '$1\u00a0').replace(/ —/g, '\u00a0—');
  const modal = (title, body, opts) => View.modal(title, typo(body), opts);

  // ---------- plumbing ----------
  function mount(html, acts) {
    const root = View.el(typo(html));
    document.getElementById('app').replaceChildren(root);
    window.scrollTo(0, 0);
    const h = root.querySelector('h1');
    if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
    if (acts) onAct(root, acts);
    return root;
  }
  // Click delegation: <button data-act="name" data-arg="x"> → acts.name('x', el)
  function onAct(root, acts) {
    root.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (el && root.contains(el) && acts[el.dataset.act]) acts[el.dataset.act](el.dataset.arg, el);
    });
  }
  const header = (title) => `<header class="sc-head"><button class="btn btn-ghost btn-sm" data-act="back">← Назад</button><h1>${title}</h1></header>`;
  // cols: header cells; rows: arrays of cell HTML; numeric columns from index `numFrom` are right-aligned.
  const table = (cols, rows, numFrom = 1, cls = '') => `<div class="sc-tw"><table class="tbl ${cls}"><thead><tr>${cols.map((c, i) => `<th${i >= numFrom ? ' class="num"' : ''}>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td${i >= numFrom ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ---------- menu ----------
  function menu(opts = {}) {
    const s = Settings.get(), t = Stats.data().total;
    const fact = {
      learn: 'Блайнды 10/20. Проиграешь стек — получишь новый.',
      practice: `Вопросы примерно в ${s.practiceFreq}% решений.`,
      tournament: `Блайнды растут каждые ${U.nplural(s.levelHands, 'раздачу', 'раздачи', 'раздач')}, разбор ${s.tournamentReview === 'end' ? 'в конце турнира' : 'после каждой раздачи'}.`,
    };
    const summary = `Стол на ${U.nplural(s.players, 'игрока', 'игрока', 'игроков')}, стек ${s.startBB} BB.<br>` +
      (t.n ? `Верных ответов: ${pct(t)}% из ${t.n}.` : 'Точность появится после первых ответов.');
    mount(`<main class="sc sc-menu">
      <section class="sc-rail"><div class="sc-felt">
        <div class="sc-fan" aria-hidden="true">${View.cardHTML(Cards.parse('As'))}${View.cardHTML(Cards.parse('Kh'))}</div>
        <h1 class="sc-title">Тренажёр покера</h1>
        <p class="sc-sub">No-Limit Hold'em — подготовка к первому живому турниру</p>
        <p class="sc-summary">${summary}</p>
      </div></section>
      <section class="sc-modes">${MODES.map((m) => `<article class="panel sc-mode sc-mode-${m.id}">
        <header><span class="sc-chip" aria-hidden="true">${m.suit}</span><h2>${m.name}</h2></header>
        <p>${m.desc}</p><p class="sc-fact">${fact[m.id]}</p>
        <button class="btn btn-primary" data-act="start" data-arg="${m.id}">${m.cta}</button></article>`).join('')}</section>
      <nav class="sc-nav" aria-label="Разделы"><button class="btn" data-act="settings">Настройки</button><button class="btn" data-act="stats">Статистика</button><button class="btn" data-act="cheat">Шпаргалка</button></nav>
      <section class="sc-how"><h2>Как играть</h2><ul>${HOW.map((h, i) => {
        const suit = '♠♥♦♣'[i];
        return `<li><span class="sc-suit${isRed(suit) ? ' red' : ''}" aria-hidden="true">${suit}</span><span>${h}</span></li>`;
      }).join('')}</ul></section>
    </main>`, {
      start: (mode) => opts.onStart && opts.onStart(mode),
      settings: () => settings({ onBack: () => menu(opts) }),
      stats: () => stats({ onBack: () => menu(opts) }),
      cheat: () => cheatSheet(),
    });
  }

  // ---------- settings ----------
  const SPEEDS = [['slow', 'Медленно'], ['normal', 'Обычно'], ['fast', 'Быстро']];
  const FREQS = [25, 50, 75, 100].map((f) => [f, f + '%']);
  const REVIEWS = [['hand', 'После каждой раздачи'], ['end', 'В конце турнира']];
  const BOT_MODES = [['random', 'Случайный состав'], ['manual', 'Выбрать вручную']];
  const NUMERIC = ['players', 'startBB', 'levelHands', 'practiceFreq'];
  const RANGE_OUT = {
    startBB: (v) => `${v} BB <small>${U.fmt(v * 20)} фишек</small>`,
    levelHands: (v) => `каждые ${U.nplural(v, 'раздачу', 'раздачи', 'раздач')}`,
  };
  const seg = (name, value, items, label) => `<div class="sc-seg" role="radiogroup" aria-label="${label}">${items.map(([v, l]) =>
    `<label><input type="radio" name="${name}" value="${v}"${v === value ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
  const slider = (name, value, [lo, hi], step, label) => `<input type="range" name="${name}" min="${lo}" max="${hi}" step="${step}" value="${value}" aria-label="${label}">`;
  const field = (label, control, out = '', hint = '') => `<div class="sc-field"><div class="sc-field-label"><span>${label}</span>${out}</div>${control}${hint ? `<p class="sc-hint">${hint}</p>` : ''}</div>`;
  const out = (name, v) => `<output data-out="${name}">${RANGE_OUT[name](v)}</output>`;

  function botsHTML(s) {
    if (s.botsMode !== 'manual') return '<p class="sc-hint">Стили соперников выбираются случайно в начале каждой игры.</p>';
    return `<div class="sc-bots">${s.botStyles.slice(0, s.players - 1).map((id, i) => `<label class="sc-bot"><span>Соперник ${i + 1}</span>
      <select name="bot" data-i="${i}">${Settings.STYLE_IDS.map((x) => `<option value="${x}"${x === id ? ' selected' : ''}>${esc(style(x)[0])}</option>`).join('')}</select></label>`).join('')}</div>
      <p class="sc-hint">Чем отличаются стили — <button class="sc-link" data-act="types">в шпаргалке</button>.</p>`;
  }

  function settings(opts = {}) {
    const s = Settings.get(), L = Settings.LIMITS;
    const players = [];
    for (let n = L.players[0]; n <= L.players[1]; n++) players.push([n, n]);
    const root = mount(`<main class="sc sc-settings">${header('Настройки')}
      <p class="sc-lead">Изменения сохраняются сразу.</p>
      <div class="sc-cols">
        <div>
          <section class="panel sc-sec"><h2>Стол</h2>
            ${field('Игроков за столом', seg('players', s.players, players, 'Игроков за столом'), '', 'Считая тебя.')}
            ${field('Стартовый стек', slider('startBB', s.startBB, L.startBB, 10, 'Стартовый стек в больших блайндах'), out('startBB', s.startBB))}
            ${field('Рост блайндов', slider('levelHands', s.levelHands, L.levelHands, 1, 'Блайнды в турнире растут каждые N раздач'), out('levelHands', s.levelHands), 'Только в режиме «Турнир».')}
          </section>
          <section class="panel sc-sec"><h2>Игра</h2>
            ${field('Скорость анимаций', seg('speed', s.speed, SPEEDS, 'Скорость анимаций'))}
            ${field('Вопросы в тренировке', seg('practiceFreq', s.practiceFreq, FREQS, 'Частота вопросов в тренировке'), '', 'Доля ключевых решений, на которых появляются вопросы.')}
            ${field('Разбор ошибок в турнире', seg('tournamentReview', s.tournamentReview, REVIEWS, 'Разбор ошибок в турнире'))}
          </section>
        </div>
        <div>
          <section class="panel sc-sec"><h2>Соперники</h2>
            ${seg('botsMode', s.botsMode, BOT_MODES, 'Состав соперников')}
            <div data-bots>${botsHTML(s)}</div>
          </section>
          <section class="panel sc-sec"><h2>Вопросы</h2>
            ${QUESTIONS.map(([k, name, hint]) => `<label class="sc-switch"><span><b>${name}</b><small>${hint}</small></span>
              <input type="checkbox" name="q" value="${k}"${s.questions[k] ? ' checked' : ''}></label>`).join('')}
          </section>
        </div>
      </div>
      <div class="sc-foot"><button class="btn" data-act="reset">Сбросить настройки</button></div>
    </main>`, {
      back: () => opts.onBack && opts.onBack(),
      reset: () => { Settings.set(Settings.DEFAULTS); settings(opts); View.toast('Настройки сброшены'); },
      types: () => cheatSheet('types'),
    });
    root.addEventListener('input', (e) => {
      const o = root.querySelector(`[data-out="${e.target.name}"]`);
      if (o) o.innerHTML = RANGE_OUT[e.target.name](+e.target.value);
    });
    root.addEventListener('change', (e) => {
      const t = e.target;
      if (t.name === 'q') Settings.set({ questions: { [t.value]: t.checked } });
      else if (t.name === 'bot') { const b = Settings.get().botStyles; b[+t.dataset.i] = t.value; Settings.set({ botStyles: b }); }
      else if (t.name) Settings.set({ [t.name]: NUMERIC.includes(t.name) ? +t.value : t.value });
      if (t.name === 'players' || t.name === 'botsMode') root.querySelector('[data-bots]').innerHTML = typo(botsHTML(Settings.get()));
    });
  }

  // ---------- stats ----------
  function barsHTML(byCat, onlyPlayed) {
    const cats = Stats.CATS.filter((c) => !onlyPlayed || (byCat[c] && byCat[c].n));
    if (!cats.length) return '<p class="sc-empty">Оценённых решений не было.</p>';
    return `<div class="sc-bars">${cats.map((cat) => {
      const c = byCat[cat] || { ok: 0, n: 0 }, p = pct(c);
      return `<div class="sc-bar"><div class="sc-bar-top"><span>${cat === 'tells' ? 'Теллы: смотрел на соперников' : Stats.CAT_RU[cat]}
        <small>${c.n ? `${c.ok} из ${c.n}` : 'нет ответов'}</small></span>${p === null ? '<b class="sc-dim">—</b>' : `<b>${p}%</b>`}</div>
        <div class="sc-track"><i style="width:${p || 0}%"></i></div></div>`;
    }).join('')}</div>`;
  }

  const posTable = (byPos) => table(['Позиция', 'Верно', 'Решений'], POSITIONS.map((p) => {
    const c = byPos[p] || { ok: 0, n: 0 }, v = pct(c);
    return [`<b>${p}</b> <small class="sc-inline">${esc(group(p).toLowerCase())}</small>`,
      v === null ? '<span class="sc-dim">—</span>' : `<span class="sc-meter"><i style="width:${v}%"></i></span>${v}%`, c.n];
  }), 2, 'sc-pos');

  const mistakesHTML = (list) => (list.length ? `<ol class="sc-mlist">${list.map((m, i) => `<li><button class="sc-mrow" data-act="mistake" data-arg="${i}">
      <span class="sc-mdate">${m.ts ? date(m.ts) : m.handNo != null ? 'Раздача ' + esc(m.handNo) : ''}</span><span class="sc-tag">${esc(Stats.CAT_RU[m.cat] || m.cat || 'Ошибка')}</span>
      <span class="sc-mtitle">${txt(m.title || 'Ошибка')}</span></button></li>`).join('')}</ol>` : '<p class="sc-empty">Ошибок пока нет.</p>');

  function statsHTML(d) {
    const t = d.total, played = d.sessions.filter((s) => s.n > 0).length;
    const weak = Stats.CATS.filter((c) => c !== 'tells' && d.byCat[c].n >= 5).sort((a, b) => pct(d.byCat[a]) - pct(d.byCat[b]))[0];
    return `<section class="panel sc-sec sc-overview">${t.n ? `<div class="sc-big">${pct(t)}%</div><div>
        <p class="sc-big-label">верных ответов</p><p class="sc-dim">${t.ok} из ${t.n}, ${U.nplural(played, 'сессия', 'сессии', 'сессий')}</p>
        ${weak ? `<p class="sc-weak">Слабее всего: ${Stats.CAT_RU[weak].toLowerCase()}, ${pct(d.byCat[weak])}%. <button class="sc-link" data-act="cheat" data-arg="${TAB_FOR[weak]}">Повторить в шпаргалке</button></p>` : ''}</div>`
      : '<p class="sc-empty">Пока нет ответов. Сыграй несколько раздач — здесь появится твоя точность по категориям, позициям и сессиям.</p>'}</section>
      <div class="sc-cols">
        <section class="panel sc-sec"><h2>По категориям</h2>${barsHTML(d.byCat)}</section>
        <section class="panel sc-sec"><h2>Префлоп по позициям</h2>${posTable(d.byPos)}</section>
      </div>
      <section class="panel sc-sec"><h2>Прогресс по сессиям</h2><div class="sc-chart"></div></section>
      <section class="panel sc-sec"><h2>Последние ошибки</h2>${mistakesHTML(d.mistakes)}</section>
      <div class="sc-foot"><button class="btn btn-danger" data-act="reset">Сбросить статистику</button></div>`;
  }

  // Accuracy per session (sessions with answers, last 20), drawn at the box's real width so text stays 1:1.
  function drawChart(box, list) {
    const W = Math.floor(box.clientWidth), H = 196, L = 42, R = 14, T = 24, B = 26;
    if (W < 120) return;
    const n = list.length, v = list.map((s) => Math.round((100 * s.ok) / s.n));
    const x = (i) => (n === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (n - 1));
    const y = (p) => T + ((100 - p) * (H - T - B)) / 100;
    const step = Math.max(1, Math.ceil(n / Math.floor((W - L - R) / 30)));
    const path = v.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p).toFixed(1)}`).join(' ');
    box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Точность по сессиям: последняя ${v[n - 1]}%${n > 1 ? `, первая ${v[0]}%` : ''}">
      <g class="g">${[0, 25, 50, 75, 100].map((p) => `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}"/><text x="${L - 8}" y="${y(p) + 4}" text-anchor="end">${p}%</text>`).join('')}</g>
      ${v.map((_, i) => ((n - 1 - i) % step ? '' : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`)).join('')}
      ${n > 1 ? `<path class="ar" d="${path} L${x(n - 1)} ${y(0)} L${x(0)} ${y(0)} Z"/><path class="ln" d="${path}"/>` : ''}
      <line class="x" y1="${T}" y2="${y(0)}"/>
      ${v.map((p, i) => `<circle class="dt" cx="${x(i)}" cy="${y(p)}" r="4"/>`).join('')}
      <text class="lbl" x="${x(n - 1)}" y="${y(v[n - 1]) - 10}" text-anchor="${n > 1 ? 'end' : 'middle'}">${v[n - 1]}%</text>
    </svg><p class="sc-readout" aria-live="polite"></p>`;
    const svg = box.firstElementChild, cross = svg.querySelector('.x'), read = box.lastElementChild;
    const show = (i) => {
      const s = list[i];
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
      read.textContent = `Сессия ${i + 1}${s.mode && MODE_RU[s.mode] ? ` (${MODE_RU[s.mode].toLowerCase()})` : ''}, ${date(s.ts)}: ${v[i]}%, верно ${s.ok} из ${s.n}`;
    };
    svg.addEventListener('pointermove', (e) => {
      svg.classList.add('hover');
      const px = e.clientX - svg.getBoundingClientRect().left;
      show(n === 1 ? 0 : U.clamp(Math.round(((px - L) * (n - 1)) / (W - L - R)), 0, n - 1));
    });
    svg.addEventListener('pointerleave', () => { svg.classList.remove('hover'); show(n - 1); });
    show(n - 1);
  }
  function chart(box, list) {
    if (!list.length) { box.innerHTML = '<p class="sc-empty">График появится после первой игры с ответами.</p>'; return; }
    let w = -1;
    const draw = () => { if (box.clientWidth !== w) { w = box.clientWidth; drawChart(box, list); } };
    draw();
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => (box.isConnected ? draw() : ro.disconnect()));
    ro.observe(box);
  }

  function fillStats(box) {
    const d = Stats.data();
    box.innerHTML = typo(statsHTML(d));
    chart(box.querySelector('.sc-chart'), d.sessions.filter((s) => s.n > 0).slice(-20));
  }
  function wireStats(box) {
    onAct(box, {
      mistake: (i) => mistake(Stats.data().mistakes[+i]),
      cheat: (tab) => cheatSheet(tab),
      reset: async () => {
        const yes = await modal('Сбросить статистику?', '<p>Удалятся все ответы, сессии и список ошибок. Вернуть их будет нельзя.</p>',
          { buttons: [{ label: 'Отмена', value: false }, { label: 'Сбросить', value: true, cls: 'btn-danger' }] });
        if (yes) { Stats.reset(); fillStats(box); }
      },
    });
    fillStats(box);
  }
  function stats(opts = {}) {
    const root = mount(`<main class="sc sc-stats">${header('Статистика')}<div class="sc-stats-body"></div></main>`, { back: () => opts.onBack && opts.onBack() });
    wireStats(root.querySelector('.sc-stats-body'));
  }
  const statsModal = () => modal('Статистика', '<div class="sc-stats-body"></div>', { wide: true, onOpen: (body) => wireStats(body.firstElementChild) });

  // ---------- cheat sheet ----------
  const PANES = {
    outs: () => `<p>Аут — карта, которая улучшит твою руку до, скорее всего, лучшей. Шанс поймать аут:</p>
      ${table(['Дро', 'Ауты', 'Одна карта', 'Две карты'], DRAWS.map(([name, o, p1, p2, ex]) => [`${name}<small>${txt(ex.split(' на ').map((g) => g.replace(/ /g, '\u00a0')).join(' на '))}</small>`, o, p1 + '%', p2 + '%']))}
      <p class="sc-note"><b>Как считать.</b> Флеш-дро: в масти 13 карт, 4 ты видишь, осталось 9 аутов. Открытое стрит-дро: по 4 карты с каждой стороны, итого 8.</p>
      <p class="sc-note"><b>Грязные ауты</b> улучшают и тебя, и соперника: спаривают борд, когда у него возможен фулл-хаус, или дают тебе не старший флеш. Когда в банке трое и больше, считай только чистые ауты.</p>`,
    rule: () => `<div class="sc-formula">
        <p><b>Одна карта</b> — ставка не олл-ин, ты увидишь только следующую карту:</p><p class="sc-eq">эквити ≈ ауты × 2</p>
        <p><b>Две карты</b> — олл-ин на флопе, ты увидишь и тёрн, и ривер:</p><p class="sc-eq">эквити ≈ ауты × 4</p>
        <p>Больше 8 аутов — × 4 завышает шанс. Поправка:</p><p class="sc-eq">эквити ≈ ауты × 4 − (ауты − 8)</p></div>
      ${table(['Ауты', 'Правило × 2', 'Точно, одна карта', 'Правило × 4', 'Точно, две карты'], DRAWS.map(([, o, p1, p2]) => [o, o * 2 + '%', p1 + '%', rule4(o) + '%', p2 + '%']))}
      <p class="sc-note"><b>Пример.</b> Флеш-дро и стрит-дро — 15 аутов, соперник на флопе пошёл олл-ин. Ты увидишь две карты: 15 × 4 = 60, поправка 15 − 8 = 7, итого 60 − 7 = 53%. Точное значение — 54%, правило почти не ошибается. Если бы ставка была не олл-ин, ты увидел бы одну карту: 15 × 2 = 30%.</p>`,
    odds: () => `<div class="sc-formula"><p>Сколько эквити нужно, чтобы колл окупался в долгую:</p>
        <p class="sc-eq">нужно % = колл ÷ (банк со ставкой соперника + колл) × 100</p></div>
      ${table(['Ставка соперника', 'Нужно эквити'], ODDS.map(([b, p]) => [b, p + '%']))}
      <p class="sc-note"><b>Пример.</b> В банке 100, соперник ставит 100. Банк со ставкой — 200, тебе доплатить 100: 100 ÷ (200 + 100) = 33%.</p>
      <p class="sc-note"><b>Как решать.</b> Эквити не меньше нужного — колл. Меньше — сброс. С сильным дро (8+ аутов) против соперника, который умеет сбрасывать, рейз-полублеф может быть лучше. С 12+ аутами рейз почти всегда лучше, кроме игры против коллинг-станции.</p>
      <p class="sc-note"><b>Вместе с правилом 2 и 4.</b> Флеш-дро на тёрне (9 аутов), соперник ставит банк: эквити 9 × 2 = 18%, нужно 33%, значит сброс.</p>`,
    pos: () => `<p class="sc-note">Первый рейз, когда до тебя все сбросили. Нажми на позицию, чтобы увидеть сетку рук.</p>
      ${table(['Позиция', 'Группа', 'Открывай рейзом (стол на 9)'], POSITIONS.map((p) => [
        `<button class="sc-link sc-pos-btn" data-act="range" data-arg="${p}" data-title="Диапазон открытия: ${p}">${p}</button>`,
        esc(group(p)), esc(openText(p)) + (POS_NOTE[p] ? `<small>${POS_NOTE[p]}</small>` : '')]), 9, 'sc-wide')}
      <p class="sc-note">«77+» — 77 и все пары старше, «AJs+» — AJs, AQs, AKs. s — одномастные, o — разномастные. За столом меньше 9 человек ранние позиции убираются: за 6 первым ходит LJ, играй его диапазон.</p>
      <h3>Против рейза</h3>
      <ul class="sc-rules">
        <li><b>3-бет (ререйз):</b> QQ+, AK.</li>
        <li><b>Колл:</b> JJ–22, AQs, AJs, KQs; одномастные коннекторы 76s+ — только на BTN и CO. Маленькие пары — только если твой стек не меньше 20 рейзов соперника: это игра на сет.</li>
        <li><b>Остальное:</b> сброс.</li>
        <li><b>Против рейза и ререйза:</b> только QQ+ и AK, остальное — сброс.</li>
      </ul>
      <p><button class="btn btn-sm" data-act="range" data-arg="vsRaise" data-title="Против рейза">Сетка против рейза</button>
        <button class="btn btn-sm" data-act="range" data-arg="vs3bet" data-title="Против рейза и ререйза">Сетка против 3-бета</button></p>`,
    types: () => `${table(['Стиль', 'VPIP', 'Рейз префлоп', 'Агрессия после флопа', 'Сброс на ставку', 'Блеф', 'Теллы'],
        Object.keys(STYLE_ROWS).map((id) => { const r = style(id).map(esc); return [`<b>${r[0]}</b><small>${r[1]}</small>`, ...r.slice(2, 8)]; }), 9, 'sc-wide')}
      <p class="sc-note">VPIP — как часто игрок добровольно вкладывает фишки до флопа. Стиль соперника подписывается после 20 раздач с ним.</p>
      <h3>Как играть против</h3>
      <dl class="sc-vs">${Object.keys(STYLE_ROWS).map((id) => { const r = style(id).map(esc); return `<dt>${r[0]}</dt><dd>${r[8]}</dd>`; }).join('')}</dl>`,
  };

  function cheatSheet(tab) {
    const cur = PANES[tab] ? tab : 'outs';
    const body = `<div class="sc-tabs" role="tablist">${TABS.map(([id, label]) =>
      `<button class="sc-tab" role="tab" data-act="tab" data-arg="${id}" aria-selected="${id === cur}">${label}</button>`).join('')}</div>
      ${TABS.map(([id]) => `<section class="sc-pane" data-pane="${id}" role="tabpanel"${id === cur ? '' : ' hidden'}>${PANES[id]()}</section>`).join('')}`;
    return modal('Шпаргалка', body, {
      wide: true,
      onOpen: (root) => onAct(root, {
        tab: (id) => {
          root.querySelectorAll('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== id; });
          root.querySelectorAll('.sc-tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.arg === id));
          root.closest('.modal').scrollTop = 0;
        },
        range: (key, el) => rangeModal(key, el.dataset.title),
      }),
    });
  }

  // ---------- range grid ----------
  function rangeModal(key, title) {
    const grid = opt(() => Ranges.grid(key));
    let cells = Array.isArray(grid) ? grid.flat() : null;
    if (!cells && OPEN[key]) { const set = Cards.parseRange(OPEN[key]); cells = Cards.HAND_CODES.map((code) => ({ code, cls: set.has(code) ? 'in' : 'out' })); }
    const text = POSITIONS.includes(key) ? openText(key) : '';
    const used = cells ? Object.keys(LEGEND).filter((k) => cells.some((c) => c.cls === k)) : [];
    const body = cells ? `<div class="sc-grid" role="img" aria-label="${esc(title || key)}${text ? ': ' + esc(text) : ''}">${cells.map((c) => `<span class="sc-cell sc-c-${esc(c.cls)}">${esc(c.code)}</span>`).join('')}</div>
      <div class="sc-legend">${used.map((k) => `<span><i class="sc-c-${k}"></i>${LEGEND[k]}</span>`).join('')}</div>
      ${text ? `<p class="sc-note sc-center">${esc(text)}${POS_NOTE[key] ? '<br>' + POS_NOTE[key] : ''}</p>` : ''}
      <p class="sc-note sc-center">Над диагональю — одномастные руки (s), под ней — разномастные (o), на диагонали — пары.</p>`
      : '<p class="sc-empty">Сетка для этого диапазона пока недоступна.</p>';
    return modal(title || 'Диапазон', body);
  }

  // ---------- one stored mistake ----------
  function mistake(m) {
    if (!m) return Promise.resolve(null);
    const meta = [['Категория', Stats.CAT_RU[m.cat] || m.cat], ['Позиция', m.pos], ['Раздача', m.handNo != null && '№' + m.handNo],
      ['Режим', MODE_RU[m.mode] || m.mode], ['Когда', m.ts && date(m.ts)]].filter(([, v]) => v);
    const cards = (label, cs) => (cs && cs.length ? `<div class="sc-mcards"><span>${label}</span>${View.cardsHTML(cs, { size: 'sm' })}</div>` : '');
    return modal('Разбор ошибки', `<dl class="sc-meta">${meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <div class="sc-mhand">${cards('Твои карты', m.hole)}${cards('Борд', m.board)}</div>
      ${View.feedbackHTML({ verdict: 'mistake', title: m.title || 'Ошибка', lines: m.lines })}`);
  }

  // ---------- tournament results ----------
  function results(sum = {}, opts = {}) {
    const { place = 0, total = 0, hands = 0, won = false, mistakes = [], byCat = {}, eliminated = [] } = sum;
    const counted = Stats.CATS.filter((c) => c !== 'tells').map((c) => byCat[c] || { ok: 0, n: 0 });
    const t = { ok: U.sum(counted.map((c) => c.ok)), n: U.sum(counted.map((c) => c.n)) };
    const confetti = won ? `<div class="sc-confetti" aria-hidden="true">${Array.from({ length: 24 }, (_, i) => {
      const suit = '♠♥♦♣'[i % 4];
      return `<i class="${isRed(suit) ? 'red' : ''}" style="left:${(i * 41 + 3) % 97}%;animation-delay:${((i * 7) % 12) * 0.12}s;animation-duration:${2.4 + (i % 5) * 0.4}s">${suit}</i>`;
    }).join('')}</div>` : '';
    const elim = eliminated.slice().sort((a, b) => b.place - a.place);
    mount(`<main class="sc sc-results">
      <section class="sc-rail"><div class="sc-felt">${confetti}
        ${won ? `<p class="sc-medal" aria-hidden="true">1</p><h1 class="sc-place">Победа! Ты выиграл турнир</h1>
          <p class="sc-sub">Все фишки стола у тебя — за ${U.nplural(hands, 'раздачу', 'раздачи', 'раздач')}.</p>`
        : `<h1 class="sc-place">Ты занял ${place}-е место из ${total}</h1>
          <p class="sc-sub">Раздач сыграно: ${hands}. Разбери ошибки ниже — так быстрее всего растёт результат.</p>`}
      </div></section>
      <div class="sc-actions"><button class="btn btn-primary" data-act="again">Сыграть ещё турнир</button><button class="btn" data-act="menu">В меню</button></div>
      <div class="sc-cols">
        <section class="panel sc-sec"><h2>Точность в турнире</h2>
          ${t.n ? `<p class="sc-dim">Верных ответов: ${pct(t)}%, ${t.ok} из ${t.n}.</p>` : ''}${barsHTML(byCat, true)}</section>
        <section class="panel sc-sec"><h2>Вылеты</h2>${elim.length ? `<ol class="sc-elim">${elim.map((e) => `<li><span class="sc-elim-place">${esc(e.place)}-е</span>
          <span>${esc(e.name)}</span><span class="sc-dim">раздача ${esc(e.hand)}</span></li>`).join('')}</ol>` : '<p class="sc-empty">Никто не вылетел.</p>'}</section>
      </div>
      <section class="panel sc-sec"><h2>Ошибки турнира</h2>${mistakesHTML(mistakes)}</section>
    </main>`, {
      again: () => opts.onAgain && opts.onAgain(),
      menu: () => opts.onMenu && opts.onMenu(),
      mistake: (i) => mistake(mistakes[+i]),
    });
  }

  return { menu, settings, stats, statsModal, cheatSheet, rangeModal, mistake, results };
})();

// ===== 90-game.js =====
// ===== Game: controller — session setup, the async hand loop, coach flow, tournament bookkeeping =====
// One session object S drives everything; UI renders from it. Every pause point goes through wait()/guard(),
// so leaving to the menu (token.kill) unwinds the loop, and Pause freezes the timers.
const Game = (() => {
  const LEVELS = [[10, 20], [15, 30], [20, 40], [30, 60], [40, 80], [50, 100], [75, 150], [100, 200], [150, 300], [200, 400],
    [300, 600], [400, 800], [500, 1000], [700, 1400], [1000, 2000], [1500, 3000], [2000, 4000], [3000, 6000], [5000, 10000]];
  const LOOK_MS = { slow: 3000, normal: 2000, fast: 1600 };
  const QCAT = { outs: 'outs', cards: 'outs', equity: 'equity', potodds: 'potodds' };
  const CANCEL = { cancelled: true };
  const fmt = U.fmt;
  let S = null;
  const api = { autoplay: false }; // Game.autoplay = true → the human acts automatically (tests)

  const auto = () => api.autoplay;
  const speed = () => (auto() ? 0 : Settings.speedFactor());
  const hasCoach = () => typeof Coach !== 'undefined';
  const P = (seat) => S.table.players[seat];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const fem = (name) => /[ая]$/.test(String(name).split(' ')[0]);
  // Genitive of a first name for «Стиль Игоря»: Игорь → Игоря, Ольга → Ольги, Павел → Павла.
  function gen(name) {
    const [w, ...rest] = String(name).split(' ');
    const g = w === 'Павел' ? 'Павла' : /[ьй]$/.test(w) ? w.slice(0, -1) + 'я' : /[гкхжшщч]а$/.test(w) ? w.slice(0, -1) + 'и'
      : /а$/.test(w) ? w.slice(0, -1) + 'ы' : /я$/.test(w) ? w.slice(0, -1) + 'и' : w + 'а';
    return [g, ...rest].join(' ');
  }

  // ---------- cancellable, pausable waiting ----------
  function newToken() {
    const t = { cancelled: false };
    t.dead = new Promise((_, rej) => { t.kill = () => { t.cancelled = true; rej(CANCEL); }; });
    t.dead.catch(() => {});
    return t;
  }
  async function wait(ms) {
    const s = S, tok = s.token;
    let left = ms * speed();
    do {
      const step = s.paused ? 100 : Math.min(left, 50);
      await U.sleep(step);
      if (tok.cancelled) throw CANCEL;
      if (!s.paused) left -= step;
    } while (left > 0 || s.paused);
  }
  async function guard(p) {
    const tok = S.token;
    const v = await Promise.race([p, tok.dead]);
    if (tok.cancelled) throw CANCEL;
    return v;
  }
  async function withPause(p) {
    const s = S;
    if (!s) return p;
    const was = s.paused;
    s.paused = true; UI.render();
    try { return await p; } finally { if (S === s) { s.paused = was; UI.render(); } }
  }

  // ---------- session ----------
  function boot() {
    if (typeof location !== 'undefined' && /autoplay/.test(location.hash)) api.autoplay = true;
    toMenu();
  }
  function stop() { if (S) { S.token.kill(); S = null; } }
  function toMenu() { stop(); Screens.menu({ onStart: start }); }
  const state = () => (S ? { table: S.table, hand: S.hand, mode: S.mode, over: S.over, paused: S.paused } : null);

  const handlers = {
    cheat: () => withPause(Screens.cheatSheet()),
    stats: () => withPause(Screens.statsModal ? Screens.statsModal() : Promise.resolve()),
    pause: () => { S.paused = !S.paused; UI.render(); },
    menu: async () => {
      const ok = await withPause(View.modal('Выйти в меню?', '<p>Текущая игра закончится. Статистика ответов уже сохранена.</p>',
        { buttons: [{ label: 'Остаться', value: false, cls: 'btn-primary' }, { label: 'Выйти в меню', value: true, cls: 'btn-danger' }] }));
      if (ok) toMenu();
    },
    hint: () => {
      const h = S.hint && S.hint();
      S.hint = null;
      UI.render();
      if (h) { UI.coachFb({ kind: 'hint', verdict: 'info', title: h.title || '💡 Подсказка', lines: h.lines || [] }); UI.openSheet('coach'); }
    },
    range: () => {
      const k = S.rangeKey;
      if (k) withPause(Screens.rangeModal(k, k === 'vsRaise' ? 'Против рейза' : k === 'vs3bet' ? 'Против рейза и ререйза' : `Диапазон открытия: ${k}`));
    },
    reveal: (seat) => { if (S.mode === 'learn' && P(seat)) P(seat).revealed = true; },
  };

  function start(mode) {
    stop();
    if (!['learn', 'practice', 'tournament'].includes(mode)) mode = 'learn';
    const st = Settings.get();
    const n = U.clamp(st.players | 0, 2, 9), stack = st.startBB * 20;
    const styles = st.botsMode === 'manual' ? st.botStyles.slice(0, n - 1) : Bots.randomLineup(n - 1);
    const players = [{ name: 'Ты', isHuman: true, stack, avatar: { initials: 'Ты', color: '#b8862e' } }];
    const used = ['Ты'];
    for (const style of styles) {
      const b = Bots.createBot({ style, usedNames: used });
      used.push(b.name);
      players.push({ ...b, stack });
    }
    const table = Engine.createTable({ players, sb: LEVELS[0][0], bb: LEVELS[0][1], button: U.randInt(0, n - 1) });
    const anim = auto() ? 0 : Settings.speedFactor();
    document.documentElement.style.setProperty('--speed', String(Math.max(anim, 0.01)));
    S = {
      mode, st, table, hand: null, token: newToken(), paused: false, anim, startStack: stack,
      level: 0, levelInfo: null, notes: [], thinkHist: [], decisions: 0, lastTimingAt: -99,
      places: [], tMistakes: [], over: null, ctx: null,
      boardShown: 0, reveal: new Set(), winners: null, payouts: null, hl: null, acts: {}, turn: null, caption: '', paid: false,
      hint: null, rangeKey: null, asking: false,
    };
    Stats.beginSession(mode);
    if (hasCoach() && Coach.timing) Coach.timing.reset();
    UI.mount(S, handlers);
    run(S);
  }

  async function run(s) {
    let fails = 0;
    while (S === s && !s.over) {
      try {
        if (await beforeHand()) return;
        await playHand();
        if (await afterHand()) return;
        fails = 0;
      } catch (e) {
        if (e === CANCEL || s.token.cancelled) return;
        console.error(e);
        View.toast(`Сбой в раздаче: ${e && e.message ? e.message : e}. Раздача отменена, фишки возвращены.`, 6000);
        voidHand(s);
        if (++fails >= 3) { toMenu(); return; }
        try { await wait(1200); } catch (_) { return; }
      }
    }
  }

  // An aborted hand is voided: everyone gets their stack from before the blinds back.
  function voidHand(s) {
    const h = s.hand;
    if (!h || h.phase === 'done') return;
    s.table.players.forEach((p, i) => { if (h.startStacks[i] !== undefined) p.stack = h.startStacks[i]; });
    h.phase = 'done';
  }

  // ---------- between hands ----------
  async function beforeHand() {
    const { table, mode, st } = S;
    S.notes = [];
    if (mode === 'tournament') {
      const lvl = Math.min(LEVELS.length - 1, Math.floor(table.handNo / st.levelHands));
      if (lvl !== S.level) {
        S.level = lvl;
        [table.sb, table.bb] = LEVELS[lvl];
        View.toast(`Блайнды выросли: ${fmt(table.sb)}/${fmt(table.bb)}`);
        S.notes.push(`Блайнды выросли: ${fmt(table.sb)}/${fmt(table.bb)}`);
      }
      S.levelInfo = { level: lvl + 1, left: lvl < LEVELS.length - 1 ? (lvl + 1) * st.levelHands - table.handNo : 0 };
      return false;
    }
    for (const p of table.players) {
      if (!p.isHuman && p.stack <= 0) { p.stack = S.startStack; S.notes.push(`${p.name} ${fem(p.name) ? 'докупилась' : 'докупился'} до ${fmt(S.startStack)}`); }
    }
    if (table.players[0].stack <= 0) {
      const v = auto() ? 'rebuy' : await guard(View.modal('Фишки закончились',
        `<p>Твой стек пуст. Докупись до ${fmt(S.startStack)} и продолжай тренировку или выйди в меню.</p>`,
        { buttons: [{ label: 'Докупиться', value: 'rebuy', cls: 'btn-primary' }, { label: 'В меню', value: 'menu' }] }));
      if (v === 'menu') { toMenu(); return true; }
      table.players[0].stack = S.startStack;
      S.notes.push(`Докупка: твой стек снова ${fmt(S.startStack)}`);
    }
    return false;
  }

  // ---------- one hand ----------
  async function playHand() {
    const { table } = S;
    Object.assign(S, { boardShown: 0, reveal: new Set(), winners: null, payouts: null, hl: null, acts: {}, turn: null,
      caption: '', paid: false, hint: null, rangeKey: null, asking: false });
    UI.coachClear();
    UI.logReset();
    const hand = Engine.startHand(table);
    S.hand = hand;
    S.ctx = { spots: [], reads: [], missed: [], seen: [], think: {}, vpip: new Set(), pfr: new Set(), review: [], humanLast: null };
    for (const s of hand.seats) if (s !== 0) table.players[s].hud.hands++;
    for (const t of S.notes) UI.logLine(t, 'note');
    UI.logStreet('preflop');
    hand.log.forEach(logEntry);
    UI.render();
    UI.deal(hand.seats, 260 * S.anim);
    await wait(380 + 70 * hand.seats.length);
    while (hand.phase !== 'done') {
      if (hand.phase === 'betting') {
        if (hand.toAct === 0) await humanTurn(); else await botTurn(hand.toAct);
      } else {
        if (hand.bets.some((b) => b > 0)) { UI.collect(280 * S.anim); await wait(320); }
        const ev = Engine.advance(hand);
        if (ev.returned) UI.logLine(`${P(ev.returned.seat).name}: несыгранная ставка ${fmt(ev.returned.amount)} возвращена`, 'note');
        if (ev.type === 'street') await onStreet(ev); else await onResult(ev);
      }
    }
  }

  const ACT = { fold: () => 'сброс', check: () => 'чек', call: (e) => `колл ${fmt(e.add)}`, bet: (e) => `ставка ${fmt(e.to)}`,
    raise: (e) => `рейз до ${fmt(e.to)}`, sb: (e) => `малый блайнд ${fmt(e.add)}`, bb: (e) => `большой блайнд ${fmt(e.add)}` };
  const actText = (e) => (ACT[e.type] ? ACT[e.type](e) : e.type) + (e.allIn ? ' (олл-ин)' : '');
  function logEntry(e) { UI.logLine(`${P(e.seat).name} (${S.hand.pos[e.seat]}) — ${actText(e)}`, e.seat === 0 ? 'me' : ''); }

  function afterAction(seat, e) {
    S.acts[seat] = e.allIn && e.type !== 'fold' ? 'Олл-ин' : cap(actText(e));
    S.caption = `${P(seat).name}: ${actText(e)}`;
    logEntry(e);
    UI.render();
  }

  function humanInfo() {
    const h = S.thinkHist.slice(-20);
    return { seat: 0, lastAction: S.ctx.humanLast, avgThinkMs: h.length ? U.sum(h) / h.length : 0 };
  }

  async function botTurn(seat) {
    const { hand, table } = S;
    const legal = Engine.legal(hand);
    S.turn = seat;
    UI.render();
    const d = Bots.decide({ table, hand, seat, legal, human: humanInfo() });
    await wait(d.thinkMs * (Engine.inHand(hand, 0) ? 1 : 0.35)); // the hero folded: play the rest out faster
    const pre = hand.street === 'preflop';
    const entry = Engine.act(hand, d.action);
    S.ctx.think[seat] = d.thinkMs;
    const hud = P(seat).hud;
    if (pre && (entry.type === 'call' || entry.type === 'bet' || entry.type === 'raise')) {
      if (!S.ctx.vpip.has(seat)) { S.ctx.vpip.add(seat); hud.vpip++; }
      if (entry.type !== 'call' && !S.ctx.pfr.has(seat)) { S.ctx.pfr.add(seat); hud.pfr++; }
    }
    S.turn = null;
    afterAction(seat, entry);
    if (Bots.betReaction && Engine.inHand(hand, 0)) {
      const r = Bots.betReaction({ table, hand, seat, entry });
      if (r) { UI.bubble(seat, r, 2200 * speed()); S.ctx.seen.push(r); }
    }
    await wait(160);
  }

  // ---------- the human's decision ----------
  function situationHTML(hand) {
    const sit = Ranges.situation(hand, 0), pos = hand.pos[0];
    const info = Ranges.POS_INFO[pos] || { group: '' };
    const k = sit.kind;
    const parts = [`Твоя позиция: <b>${pos}</b> (${info.group === 'Блайнд' ? 'блайнд' : info.group.toLowerCase()}).`];
    if (k === 'open') parts.push('До тебя все сбросили.');
    else if (k === 'limped') parts.push(`До тебя без повышения вошли: ${U.nplural(sit.limpers, 'игрок', 'игрока', 'игроков')}.`);
    else if (k === 'bbOption') parts.push('Никто не повышал — можно бесплатно посмотреть флоп.');
    else if (k === 'vsRaise') parts.push(`${U.esc(P(sit.raiser).name)} (${hand.pos[sit.raiser]}) повышает до ${fmt(sit.raiseTo)}.`);
    else if (k === 'vs3bet') parts.push(`Был рейз и ререйз — до ${fmt(sit.raiseTo)}.`);
    parts.push(`Рука: <b>${View.suitText(Cards.strList(hand.hole[0]).replace(' ', ''))}</b>.`);
    parts.push(k === 'vsRaise' || k === 'vs3bet' ? 'Стоит ли продолжать с этой рукой?' : k === 'bbOption' ? 'Стоит ли повышать с этой рукой?' : 'Входит ли она в диапазон?');
    return parts.join(' ') + '<div class="row"><button class="btn btn-sm" data-cmd="hint">💡 Подсказка</button><button class="btn btn-sm" data-cmd="range">Посмотреть диапазон</button></div>';
  }

  async function humanTurn() {
    const { hand, table, mode, st } = S, ctx = S.ctx;
    const street = hand.street, pre = street === 'preflop';
    const legal = Engine.legal(hand);
    let spot = null;
    S.turn = 0;
    if (pre) {
      const sit = Ranges.situation(hand, 0);
      S.rangeKey = mode === 'tournament' ? null : sit.kind === 'vsRaise' || sit.kind === 'vs3bet' ? sit.kind : sit.pos;
      S.hint = mode === 'learn' ? () => Ranges.hint(hand, 0, table) : null;
      if (mode === 'learn' && st.questions.preflop) UI.coachAdd(situationHTML(hand), 'c-prompt', `Твой ход: ${hand.pos[0]}, ${Cards.strList(hand.hole[0])}`);
      UI.render();
    } else {
      UI.render();
      spot = hasCoach() ? Coach.analyze(hand, 0, table) : null;
      if (spot) ctx.spots.push(spot);
      if (mode !== 'tournament') {
        await askRead();
        if (spot && (mode === 'learn' || U.chance(st.practiceFreq / 100))) await askSpot(spot);
      }
    }
    const t0 = U.now();
    const action = await guard(UI.askAction(legal, auto() ? autoAction(legal) : null));
    const ms = auto() ? U.randInt(800, 3000) : U.now() - t0;
    S.hint = null; S.rangeKey = null;
    // evaluate against the pre-action state
    const pfb = pre && st.questions.preflop ? Ranges.evaluate(hand, 0, action, table) : null;
    const afb = spot ? Coach.evaluateAction(spot, action) : null;
    const strong = hasCoach() && Coach.heroStrong ? Coach.heroStrong(hand.hole[0], hand.board) : false;
    const entry = Engine.act(hand, action);
    S.turn = null;
    afterAction(0, entry);
    if (pfb) judge(pfb, 'preflop', { pos: hand.pos[0] });
    if (afb) judge(afb, 'action');
    ctx.humanLast = { street, type: entry.type, thinkMs: ms };
    S.thinkHist.push(ms);
    if (S.thinkHist.length > 40) S.thinkHist.shift();
    if (hasCoach() && Coach.timing) {
      Coach.timing.add(ms, strong);
      S.decisions++;
      const w = Coach.timing.warning();
      if (w && S.decisions - S.lastTimingAt >= 10) {
        S.lastTimingAt = S.decisions;
        const fb = { kind: 'timing', verdict: 'acceptable', title: '⚠️ Тайминг выдаёт силу руки', lines: [w] };
        if (mode === 'tournament') ctx.review.push(fb); else UI.coachFb(fb);
      }
    }
  }

  // Feedback per mode: learn — always; practice — unless correct; tournament — mistakes queued for the review.
  function judge(fb, cat, opts) {
    const ok = fb.verdict !== 'mistake';
    Stats.record(cat, ok, opts);
    if (!ok) addMistake(fb, cat);
    if (S.mode === 'learn' || (S.mode === 'practice' && fb.verdict !== 'correct')) UI.coachFb(fb);
    else if (S.mode === 'tournament' && !ok) S.ctx.review.push(fb);
  }
  function addMistake(fb, cat) {
    const h = S.hand;
    Stats.addMistake({ cat, title: fb.title, lines: fb.lines, handNo: h.no, mode: S.mode, pos: h.pos[0], hole: h.hole[0], board: h.board.slice(0, S.boardShown) });
  }

  async function askRead() {
    const { hand, table, mode, st } = S;
    if (!st.questions.read || !hasCoach()) return;
    const rq = Coach.readQuestion(hand, 0, table);
    if (!rq || !U.chance(mode === 'learn' ? 0.5 : (0.5 * st.practiceFreq) / 100)) return;
    const b = P(rq.bettor);
    const sub = `${b.name}: ставка ${fmt(hand.bets[rq.bettor])}` + (rq.sizeFrac ? ` — ${U.pct(rq.sizeFrac)} банка` : '');
    S.asking = true; UI.render();
    const q = { id: 'read', type: 'choice', prompt: 'Что, скорее всего, у соперника?', options: rq.options };
    const answer = await guard(UI.askQuestion(q, { sub, hole: hand.hole[0], board: hand.board }, auto() ? U.pick(rq.options).v : null));
    S.asking = false;
    S.ctx.reads.push({ read: rq, answer, thinkMs: S.ctx.think[rq.bettor], tellsSeen: S.ctx.seen.filter((r) => r.seat === rq.bettor) });
  }

  async function askSpot(spot) {
    const { hand, mode, st } = S;
    const qs = Coach.questions(spot, st) || [];
    const answers = {};
    S.asking = true;
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i];
      S.hint = mode === 'learn' && q.hint ? () => (typeof q.hint === 'string' ? { title: '💡 Подсказка', lines: [q.hint] } : q.hint) : null;
      UI.render();
      const v = await guard(UI.askQuestion(q, { n: i + 1, of: qs.length, hole: hand.hole[0], board: hand.board }, auto() ? autoAnswer(q, spot) : null));
      S.hint = null;
      const fb = Coach.check(spot, q.id, v, { ...answers });
      answers[q.id] = v;
      const cat = QCAT[q.id] || 'outs';
      Stats.record(cat, !!fb.ok);
      if (!fb.ok) addMistake(fb, cat);
      if (mode === 'learn' || !fb.ok) UI.coachFb(fb);
    }
    S.asking = false;
    UI.render();
  }

  // ---------- streets, look overlay, showdown ----------
  async function onStreet(ev) {
    const { hand, table, st } = S;
    S.acts = {};
    const runout = hand.phase !== 'betting';
    if (runout && !S.reveal.size) {
      hand.seats.filter((s) => !hand.folded[s]).forEach((s) => S.reveal.add(s)); // all-in: hands are tabled
      S.caption = 'Олл-ин — карты открываются';
      UI.render();
      await wait(1000);
    }
    const bots = hand.seats.filter((s) => s !== 0 && !hand.folded[s]);
    if (!runout && Engine.inHand(hand, 0) && !hand.allIn[0] && bots.length && st.questions.tells) {
      const reactions = bots.map((seat) => Bots.streetReaction({ table, hand, seat, newCards: ev.cards })).filter(Boolean);
      S.caption = '';
      UI.render();
      const choice = await guard(UI.askLook(ev.street, auto() ? 30 : LOOK_MS[st.speed] || 2000, auto() ? U.pick(['board', 'players']) : null));
      Stats.recordLook(choice === 'players');
      if (choice === 'players') {
        reactions.forEach((r) => UI.bubble(r.seat, r, 2000 * speed()));
        S.ctx.seen.push(...reactions);
        S.caption = reactions.length ? '' : 'Никто ничем себя не выдал';
        UI.render();
        await wait(2000);
      } else if (reactions.length) S.ctx.missed.push({ street: ev.street, reactions });
    }
    S.boardShown = hand.board.length;
    S.caption = '';
    UI.logStreet(ev.street, hand.board.slice());
    UI.render();
    await wait(runout ? 1100 : 450);
  }

  async function onResult(ev) {
    const { hand } = S, res = ev.result;
    S.boardShown = hand.board.length;
    S.acts = {};
    if (ev.type === 'showdown') {
      res.shown.forEach((s) => S.reveal.add(s));
      S.hl = new Set(res.winners.flatMap((w) => res.best[w] || []));
      UI.logStreet('Вскрытие');
      for (const s of res.shown) UI.logLine(`${P(s).name} — ${Cards.strList(hand.hole[s])}: ${res.names[s].toLowerCase()}`, s === 0 ? 'me' : '');
    }
    const lines = res.pots.map((pot) => {
      const who = pot.winners.map((s, i) => (i && s === 0 ? 'ты' : P(s).name)).join(' и ');
      const me = pot.winners.includes(0);
      const verb = pot.winners.length > 1 ? (me ? 'делите' : 'делят') : me ? 'забираешь' : 'забирает';
      const why = res.uncontested ? 'все сбросили' : res.names[pot.winners[0]].toLowerCase();
      return `${res.pots.length > 1 ? pot.name + ': ' : ''}${who} ${verb} ${fmt(pot.amount)} — ${why}`;
    });
    lines.forEach((l) => UI.logLine(l, 'res'));
    S.winners = res.winners;
    S.caption = lines[0];
    UI.render();
    await wait(ev.type === 'showdown' ? 900 : 350);
    UI.payout(res.winners, 450 * S.anim);
    S.paid = true;
    S.payouts = res.payouts;
    UI.render();
    await wait(600);
  }

  // ---------- after the hand: review, style reveals, tournament ----------
  async function afterHand() {
    const { hand, table, mode, st } = S, ctx = S.ctx;
    const shown = table.players.filter((p) => !p.isHuman && !p.revealed && p.hud.hands >= 20);
    const styleOf = (p) => (Bots.STYLES[p.style] ? Bots.STYLES[p.style].name : p.style);
    shown.forEach((p) => { p.revealed = true; });
    if (shown.length === 1) View.toast(`Стиль ${gen(shown[0].name)}: ${styleOf(shown[0])}`);
    else if (shown.length) View.toast(`Стили соперников раскрыты: ${shown.map((p) => `${p.name} — ${styleOf(p)}`).join(', ')}`, 6000);
    const items = mode === 'tournament' ? ctx.review.slice() : [];
    if (hasCoach()) {
      if (mode !== 'tournament') {
        for (const spot of ctx.spots) if (spot.outs && spot.outs.total > 0) { const fb = Coach.realEquity(spot, hand); if (fb) items.push(fb); }
      }
      for (const r of ctx.reads) {
        const fb = Coach.readReview(r.read, r.answer, hand, table, { thinkMs: r.thinkMs, tellsSeen: r.tellsSeen });
        if (!fb) continue;
        Stats.record('read', fb.verdict !== 'mistake');
        if (fb.verdict === 'mistake') addMistake(fb, 'read');
        items.push(fb);
      }
      for (const m of ctx.missed) { const fb = Coach.lookHint(m.reactions, table, m.street); if (fb) items.push(fb); }
    }
    let over = null;
    if (mode === 'tournament') {
      const CAT = { preflop: 'preflop', action: 'action', tells: 'tells', timing: 'tells', read: 'read' };
      for (const fb of items) {
        S.tMistakes.push({ ts: Date.now(), cat: CAT[fb.kind] || 'action', title: fb.title, lines: fb.lines, handNo: hand.no, mode,
          pos: hand.pos[0], hole: hand.hole[0] || [], board: hand.board.slice() });
      }
      over = tournamentBook(); // after queueing: the summary must include this hand's review
    }
    UI.render();
    const showReview = items.length && (mode !== 'tournament' || st.tournamentReview === 'hand');
    if (showReview) UI.review(items);
    if (over) {
      if (showReview) await guard(UI.waitNext(auto(), 'К итогам турнира'));
      else await wait(1500);
      finish(over);
      return true;
    }
    if (mode !== 'tournament' || showReview) await guard(UI.waitNext(auto()));
    else await wait(1400);
    return false;
  }

  // Marks players who just lost their stack as busted and assigns places (worst first).
  // Simultaneous busts: the bigger stack at the start of the hand places higher.
  function eliminate(players, startStacks) {
    const alive = players.filter((p) => !p.busted);
    const out = alive.filter((p) => p.stack <= 0).sort((a, b) => startStacks[a.seat] - startStacks[b.seat]);
    let place = alive.length;
    for (const p of out) { p.busted = true; p.place = place--; }
    return out;
  }

  // Tournament bookkeeping after a hand; returns the results summary when the tournament is over.
  function tournamentBook() {
    const { table, hand } = S;
    for (const p of eliminate(table.players, hand.startStacks)) {
      S.places.push({ place: p.place, name: p.name, hand: hand.no });
      const text = p.isHuman ? `Ты выбываешь — ${p.place}-е место` : `${p.name} выбывает — ${p.place}-е место`;
      UI.logLine(text, 'res');
      if (!p.isHuman) View.toast(text);
    }
    const me = table.players[0], left = table.players.filter((p) => !p.busted);
    if (!me.busted && left.length > 1) return null;
    const session = Stats.data().sessions.slice(-1)[0];
    const placeMe = me.busted ? me.place : 1;
    return { place: placeMe, total: table.players.length, hands: table.handNo, won: placeMe === 1, mistakes: S.tMistakes.slice(),
      byCat: session ? session.byCat : {}, eliminated: S.places.slice() };
  }

  function finish(summary) {
    S.over = summary;
    Screens.results(summary, { onMenu: toMenu, onAgain: () => start('tournament') });
  }

  // ---------- autoplay (test hook) ----------
  function autoAction(L) {
    const h = S.hand, r = U.rng();
    const strong = h.street === 'preflop' ? Equity.holeTopPct(h.hole[0]) < (S.mode === 'tournament' ? 0.15 : 0.25) : U.chance(0.45);
    const size = () => (U.chance(0.06) ? L.maxTo : Engine.sizeTo(h, U.pick([1 / 3, 0.5, 2 / 3, 1])));
    if (L.canCheck) return L.canRaise && r < (strong ? 0.5 : 0.12) ? { type: 'raise', to: size() } : { type: 'check' };
    if (!strong && r < (h.street === 'preflop' ? (S.mode === 'tournament' ? 0.9 : 0.7) : 0.45)) return { type: 'fold' };
    if (L.canRaise && r > 0.8) return { type: 'raise', to: size() };
    return { type: 'call' };
  }
  function autoAnswer(q, spot) {
    const right = { outs: spot.correctOuts, cards: spot.cardsToSee, equity: spot.ruleEq, potodds: spot.needed }[q.id];
    if (q.type === 'choice') {
      const vals = (q.options || []).map((o) => (o && typeof o === 'object' ? o.v : o));
      return U.chance(0.7) && vals.some((v) => String(v) === String(right)) ? right : U.pick(vals);
    }
    return U.chance(0.6) && Number.isFinite(+right) ? Math.round(+right) : U.randInt(0, 40);
  }

  return Object.assign(api, { boot, start, state, toMenu, eliminate, gen });
})();

// ===== 99-main.js =====
// ===== Main: boots the game in the browser (no-op in Node tests) =====
const Main = (() => {
  if (typeof document !== 'undefined') Game.boot();
  return {};
})();

</script>
